<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>직원관리</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--red:#b83838}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.shell{width:min(100%,720px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.help{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.55}.account-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #edf1f6}.account-head{grid-column:1/-1;display:flex;align-items:center;gap:8px}.account-label{color:#64748b;font-size:12px;font-weight:900}.delete-account{min-height:26px;padding:3px 8px;border:1px solid #efcaca;border-radius:8px;background:#fff7f7;color:var(--red);font-size:10px;font-weight:900}.current{padding:3px 7px;border-radius:999px;background:#edf5ff;color:var(--blue);font-size:9px;font-weight:900}input{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font-size:14px}.small-btn{width:100%;min-height:41px;margin-top:12px;padding:8px 11px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:var(--navy);font-weight:900}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:430px){.account-row{grid-template-columns:1fr 1fr}.account-row input{padding:11px 9px;font-size:13px}}
</style></head><body><main class="shell"><a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>직원관리</h1><p>근무자와 관리자 계정을 만들고 PIN을 변경합니다.</p></header>
<form id="staffForm" inert>
<section class="card"><h2>근무자 계정</h2><p class="help">이름과 개인 PIN(숫자 6~8자리)을 입력합니다. 기존 PIN은 비워두면 유지됩니다.</p><div id="employeeAccounts"></div><button id="addEmployee" class="small-btn" type="button">+ 근무자 추가</button></section>
<section class="card"><h2>관리자 계정</h2><p class="help">관리자 로그인 화면에 표시할 계정명과 PIN(숫자 6~8자리)을 입력합니다.</p><div id="adminAccounts"></div><button id="addAdmin" class="small-btn" type="button">+ 관리자 추가</button></section>
<button id="saveButton" class="save" type="submit">계정 저장</button><div id="message" class="message" role="alert"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("staffForm"),employeesNode=document.getElementById("employeeAccounts"),adminsNode=document.getElementById("adminAccounts"),message=document.getElementById("message");let session=null,config=null;
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function renumber(){[...employeesNode.children].forEach((row,index)=>row.querySelector(".account-label").textContent=`근무자 ${index+1}`);[...adminsNode.children].forEach((row,index)=>{const label=row.querySelector(".account-label");label.firstChild.textContent=`관리자 ${index+1} `;});}
function employeeRow(employee=null){const row=document.createElement("div");row.className="account-row";row.dataset.employeeId=employee?.employee_id||"";row.innerHTML=`<div class="account-head"><span class="account-label">근무자</span><button class="delete-account" type="button">Delete</button></div><input class="account-name" type="text" maxlength="50" placeholder="근무자 이름" value="${esc(employee?.display_name||"")}"><input class="account-pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" placeholder="${employee?"PIN 변경 시 입력":"PIN 6~8자리"}">`;row.querySelector(".delete-account").onclick=async()=>{if(!employee){row.remove();renumber();return;}if(!confirm(`‘${employee.display_name}’ 근무자를 삭제할까요?`))return;try{config=await window.omgWorkConfig.deleteEmployee(session.accessToken,employee.employee_id);load(config);show("근무자가 삭제되었습니다.");}catch(error){show(error.message,false);}};employeesNode.append(row);renumber();}
function adminRow(admin=null){const row=document.createElement("div");row.className="account-row";row.dataset.ownerId=admin?.owner_id||"";row.innerHTML=`<div class="account-head"><span class="account-label">관리자 ${admin?.is_current?'<span class="current">현재 계정</span>':""}</span>${admin?.is_current?"":'<button class="delete-account" type="button">Delete</button>'}</div><input class="admin-name" type="text" maxlength="50" placeholder="관리자 계정명" value="${esc(admin?.login_id||admin?.display_name||"")}"><input class="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" placeholder="${admin?"PIN 변경 시 입력":"PIN 6~8자리"}">`;row.querySelector(".delete-account")?.addEventListener("click",async()=>{if(!admin){row.remove();renumber();return;}if(!confirm(`‘${admin.display_name}’ 관리자 계정을 삭제할까요?`))return;try{config=await window.omgWorkConfig.deleteAdministrator(session.accessToken,admin.owner_id);load(config);show("관리자 계정이 삭제되었습니다.");}catch(error){show(error.message,false);}});adminsNode.append(row);renumber();}
function collect(node,type){return[...node.querySelectorAll(".account-row")].map(row=>type==="employee"?{employee_id:row.dataset.employeeId||null,display_name:row.querySelector(".account-name").value.trim(),pin:row.querySelector(".account-pin").value.trim()}:{owner_id:row.dataset.ownerId||null,display_name:row.querySelector(".admin-name").value.trim(),login_id:row.querySelector(".admin-name").value.trim(),pin:row.querySelector(".admin-pin").value.trim()}).filter(item=>item.display_name||item.pin);}
function validate(items,label,idKey){if(!items.length)throw new Error(`${label} 계정을 한 개 이상 등록해주세요.`);items.forEach(item=>{if(!item.display_name)throw new Error(`${label} 계정명을 입력해주세요.`);if(!item[idKey]&&!item.pin)throw new Error(`${item.display_name}의 PIN을 입력해주세요.`);if(item.pin&&!/^[0-9]{6,8}$/.test(item.pin))throw new Error(`${item.display_name}의 PIN은 숫자 6~8자리여야 합니다.`);});}
function load(next){config=next;employeesNode.replaceChildren();adminsNode.replaceChildren();config.employees.forEach(employeeRow);(config.administrators||[]).forEach(adminRow);}
function show(text,ok=true){message.className=`message ${ok?"ok":"error"}`;message.textContent=text;}
document.getElementById("addEmployee").onclick=()=>employeeRow();document.getElementById("addAdmin").onclick=()=>adminRow();
form.addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveButton");button.disabled=true;message.textContent="";try{const employees=collect(employeesNode,"employee"),admins=collect(adminsNode,"admin");validate(employees,"근무자","employee_id");validate(admins,"관리자","owner_id");config=await window.omgWorkConfig.saveEmployees(session.accessToken,employees);config=await window.omgWorkConfig.saveAdministrators(session.accessToken,admins);load(config);show("근무자와 관리자 계정이 저장되었습니다.");}catch(error){show(error.message||"계정을 저장하지 못했습니다.",false);}finally{button.disabled=false;}});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!config.can_manage){location.replace("app.html");return;}load(config);form.inert=false;})().catch(error=>show(error.message,false));
</script></body></html>
