<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Property 설정</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff;--red:#b83838}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,720px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.help{margin:0 0 15px;color:var(--muted);font-size:11px;line-height:1.55}label.title{display:block;margin:15px 0 7px;color:var(--navy);font-size:13px;font-weight:900}input[type=text],input[type=password],textarea,select{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font:15px/1.5 inherit}textarea{min-height:90px;resize:vertical}.room-row{display:grid;grid-template-columns:135px 1fr auto;gap:9px;align-items:start;margin-top:10px}.account-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #edf1f6}.account-head{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;gap:8px}.account-label{color:#64748b;font-size:12px;font-weight:900}.delete-account{min-height:26px;padding:3px 8px;border:1px solid #efcaca;border-radius:8px;background:#fff7f7;color:var(--red);font-size:10px;font-weight:900}.employee-panel{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbfcfe}.employee-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.employee-name{color:var(--navy);font-size:17px;font-weight:900}.role{padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:900}.group-title{margin:16px 0 8px;color:#586b84;font-size:12px;font-weight:900}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.check{position:relative}.check input{position:absolute;opacity:0}.check label{display:flex;align-items:center;justify-content:center;min-height:39px;padding:7px 5px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;color:#607087;font-size:11px;font-weight:800;text-align:center;cursor:pointer}.check input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy)}.reminder{margin-top:18px;padding-top:18px;border-top:2px solid #e8eef7}.reminder-switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card-editor{margin-top:9px;border:1px solid #dae5f2;border-radius:14px;background:#fff;overflow:hidden}.card-summary{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;width:100%;padding:11px 12px;border:0;background:#fff;color:var(--navy);text-align:left;font-weight:900}.card-summary-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.weekday-mini{display:flex;gap:2px}.weekday-mini i{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#edf1f6;color:#9aa5b4;font-size:9px;font-style:normal}.weekday-mini i.on{background:#dcecff;color:var(--blue)}.chevron{font-size:18px;transition:transform .18s}.card-editor.open .chevron{transform:rotate(180deg)}.card-detail{display:none;padding:0 12px 12px;border-top:1px solid #edf1f6}.card-editor.open .card-detail{display:block}.weekday-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:11px 0}.weekday-picker label{margin:0}.weekday-picker input{position:absolute;opacity:0}.weekday-picker span{display:grid;place-items:center;min-height:30px;border:1px solid #d5e0ed;border-radius:8px;color:#7b899b;font-size:10px;font-weight:900}.weekday-picker input:checked+span{border-color:var(--blue);background:var(--soft);color:var(--blue)}.card-row{display:grid;grid-template-columns:86px 1fr;gap:12px}.preview{width:86px;height:108px;object-fit:cover;border-radius:11px;background:#eef4fb}.editor-actions{display:flex;gap:8px;margin-top:9px}.small-btn{min-height:39px;padding:8px 11px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;color:var(--navy);font-weight:800}.remove{color:var(--red)}.add{width:100%;margin-top:12px}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:560px){.room-row{grid-template-columns:92px 1fr auto}.account-row{grid-template-columns:1fr 1fr}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}.check label{font-size:10px;padding:6px 3px}.card-row{grid-template-columns:72px 1fr}.preview{width:72px;height:96px}.weekday-mini i{width:17px;height:18px;font-size:8px}}
.property-grid{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px}.management-number{background:#f2f5f9!important;color:#596b82!important;font-weight:900;text-align:center}.number-note{grid-column:2;margin:-2px 2px 8px;color:var(--muted);font-size:9px;line-height:1.4}@media(max-width:420px){.property-grid{grid-template-columns:minmax(0,1fr) 110px}}
</style></head><body><main class="shell">
<a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>Property 설정</h1><p>숙소, 객실 타입, 근무자 계정과 직원별 출퇴근 보고 항목을 관리합니다.</p></header>
<form id="settingsForm" inert>
<section class="card"><h2>숙소 기본정보</h2><p class="help">숙소명은 로그인과 메인화면의 제목으로 바로 표시됩니다.</p><div class="property-grid"><div><label class="title" for="propertyName">숙소명</label><input id="propertyName" type="text" maxlength="80" required></div><div><label class="title" for="managementNumber">숙소 번호</label><input id="managementNumber" class="management-number" type="text" value="1" readonly aria-readonly="true"></div><p class="number-note">OMG WORKS 운영자만 변경 가능</p></div><label class="title">객실 타입과 객실번호</label><p class="help">왼쪽에는 객실 타입명, 오른쪽에는 해당 객실번호를 쉼표로 구분해 입력하세요.</p><div id="roomTypes"></div><button id="addRoomType" class="small-btn add" type="button">+ 객실 타입 추가</button><p id="roomCount" class="help">총 0개 객실</p></section>
<section class="card"><h2>근무자 계정</h2><p class="help">이름과 개인 PIN(숫자 6~8자리)을 입력합니다. 기존 PIN은 비워두면 유지됩니다.</p><div id="employeeAccounts"></div><button id="addEmployee" class="small-btn add" type="button">+ 근무자 추가</button></section>
<section class="card"><h2>근무자별 보고 항목</h2><p class="help">근무자 한 명을 선택하면 그 직원의 설정만 아래에 표시됩니다.</p><label class="title" for="employeeSelect">근무자 선택</label><select id="employeeSelect"></select><div id="employeePanel" class="employee-panel"></div></section>
<button id="saveButton" class="save" type="submit">전체 설정 저장</button><div id="message" class="message" role="alert"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("settingsForm"),panel=document.getElementById("employeePanel"),select=document.getElementById("employeeSelect"),message=document.getElementById("message"),roomTypesNode=document.getElementById("roomTypes"),accountsNode=document.getElementById("employeeAccounts");let session=null,config=null,employeeConfigs={};
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function splitRooms(value){return[...new Set(String(value||"").split(/[\n,]+/).map(room=>room.trim()).filter(Boolean))];}
function parseRoomTypes(){return[...roomTypesNode.querySelectorAll(".room-row")].map((row,index)=>({name:row.querySelector(".type-name").value.trim()||`객실타입${index+1}`,rooms:splitRooms(row.querySelector(".room-numbers").value)})).filter(group=>group.rooms.length);}
function updateRoomCount(){document.getElementById("roomCount").textContent=`총 ${parseRoomTypes().flatMap(group=>group.rooms).length}개 객실`;}
function addRoomType(group={name:"",rooms:[]}){const row=document.createElement("div");row.className="room-row";row.innerHTML=`<input class="type-name" type="text" maxlength="40" placeholder="객실타입 이름" value="${esc(group.name)}"><input class="room-numbers" type="text" maxlength="800" placeholder="객실번호: 101, 102, 103" value="${esc((group.rooms||[]).join(", "))}"><button class="small-btn remove" type="button">삭제</button>`;row.querySelectorAll("input").forEach(input=>input.addEventListener("input",updateRoomCount));row.querySelector(".remove").onclick=()=>{row.remove();updateRoomCount();};roomTypesNode.append(row);updateRoomCount();}
function addAccount(employee=null,index=accountsNode.children.length){const row=document.createElement("div");row.className="account-row";row.dataset.employeeId=employee?.employee_id||"";row.innerHTML=`<div class="account-head"><span class="account-label">근무자 ${index+1}</span><button class="delete-account" type="button">Delete</button></div><input class="account-name" type="text" maxlength="50" placeholder="근무자 이름" value="${esc(employee?.display_name||"")}"><input class="account-pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" placeholder="${employee?"PIN 변경 시 입력":"PIN 6~8자리"}">`;row.querySelector(".delete-account").addEventListener("click",async()=>{if(!employee){row.remove();renumberAccounts();return;}if(!confirm(`‘${employee.display_name}’ 근무자를 삭제할까요?\n기존 출퇴근·미션 기록은 보관되고 로그인만 중지됩니다.`))return;const button=row.querySelector(".delete-account");button.disabled=true;try{config=await window.omgWorkConfig.deleteEmployee(session.accessToken,employee.employee_id);delete employeeConfigs[employee.employee_id];loadConfig(config);message.className="message ok";message.textContent="근무자가 삭제되었습니다.";}catch(error){button.disabled=false;message.className="message error";message.textContent=error.message||"근무자를 삭제하지 못했습니다.";}});accountsNode.append(row);}
function renumberAccounts(){[...accountsNode.children].forEach((row,index)=>row.querySelector(".account-label").textContent=`근무자 ${index+1}`);}
function collectAccounts(){return[...accountsNode.querySelectorAll(".account-row")].map(row=>({employee_id:row.dataset.employeeId||null,display_name:row.querySelector(".account-name").value.trim(),pin:row.querySelector(".account-pin").value.trim()})).filter(item=>item.employee_id||item.display_name||item.pin);}
function roleName(role){return role==="manager"?"매니저":"직원";}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("사진을 읽지 못했습니다."));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error("사진 형식을 확인해주세요."));image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78));};image.src=reader.result;};reader.readAsDataURL(file);});}
function syncCurrent(){const id=panel.dataset.employeeId;if(!id||!employeeConfigs[id])return;const current=employeeConfigs[id];current.clock_in=[...panel.querySelectorAll('input[data-type="clock_in"]:checked')].map(i=>i.value);current.clock_out=[...panel.querySelectorAll('input[data-type="clock_out"]:checked')].map(i=>i.value);current.reminder_cards=[...panel.querySelectorAll(".card-editor")].map(row=>({id:row.dataset.cardId,title:row.querySelector(".card-title").value.trim(),image:row.querySelector(".preview").getAttribute("src"),text:row.querySelector(".card-text").value.trim(),weekdays:[...row.querySelectorAll('.weekday-picker input:checked')].map(input=>Number(input.value))})).filter(card=>card.title&&card.image&&card.text);}
function makeCheck(type,key,label,selected){const id=`${select.value}-${type}-${key}`;return`<span class="check"><input id="${id}" type="checkbox" data-type="${type}" value="${key}" ${selected.includes(key)?"checked":""}><label for="${id}">${label}</label></span>`;}
function cardEditor(card,index){const days=["일","월","화","수","목","금","토"],selected=new Set(card.weekdays??[0,1,2,3,4,5,6]);return`<div class="card-editor" data-card-id="${esc(card.id||`card-${Date.now()}-${index}`)}"><button class="card-summary" type="button"><span class="card-summary-title">카드 ${index+1} · ${esc(card.title||"새 리마인더")}</span><span class="weekday-mini">${days.map((day,value)=>`<i class="${selected.has(value)?"on":""}">${day}</i>`).join("")}</span><span class="chevron">⌄</span></button><div class="card-detail"><div class="weekday-picker">${days.map((day,value)=>`<label><input type="checkbox" value="${value}" ${selected.has(value)?"checked":""}><span>${day}</span></label>`).join("")}</div><div class="card-row"><img class="preview" src="${esc(card.image)}" alt="카드 사진"><div><input class="card-title" type="text" maxlength="50" value="${esc(card.title)}" placeholder="카드 제목"><label class="title">뒷면 안내문</label><textarea class="card-text" maxlength="1000" placeholder="사진 뒷면에 표시할 내용을 입력하세요.">${esc(card.text)}</textarea></div></div><div class="editor-actions"><label class="small-btn">사진 변경<input class="image-input" type="file" accept="image/*" hidden></label><button class="small-btn remove" type="button">카드 삭제</button></div></div></div>`;}
function bindImage(input){input.addEventListener("change",async()=>{if(!input.files[0])return;try{input.closest(".card-editor").querySelector(".preview").src=await fileToDataUrl(input.files[0]);}catch(error){alert(error.message);}input.value="";});}
function bindCardEditor(row){bindImage(row.querySelector(".image-input"));row.querySelector(".card-summary").onclick=()=>row.classList.toggle("open");row.querySelector(".card-title").addEventListener("input",event=>{const index=[...row.parentNode.children].indexOf(row)+1;row.querySelector(".card-summary-title").textContent=`카드 ${index} · ${event.target.value.trim()||"새 리마인더"}`;});row.querySelectorAll(".weekday-picker input").forEach((input,index)=>input.addEventListener("change",()=>row.querySelectorAll(".weekday-mini i")[index].classList.toggle("on",input.checked)));row.querySelector(".remove").onclick=()=>row.remove();}
function render(){syncCurrent();const employee=config.employees.find(item=>item.employee_id===select.value);if(!employee){panel.innerHTML="";return;}const saved=employeeConfigs[employee.employee_id]||window.omgWorkConfig.normalizeReportConfig(employee.report_config);employeeConfigs[employee.employee_id]=saved;panel.dataset.employeeId=employee.employee_id;panel.innerHTML=`<div class="employee-head"><span class="employee-name">${esc(employee.display_name)}</span><span class="role">${roleName(employee.role)}</span></div>`;for(const type of["clock_in","clock_out"]){panel.insertAdjacentHTML("beforeend",`<div class="group-title">${type==="clock_in"?"출근보고":"퇴근보고"}</div><div class="checks">${window.omgWorkConfig.fieldGroups[type].map(field=>makeCheck(type,field.key,field.label,saved[type])).join("")}</div>`);}panel.insertAdjacentHTML("beforeend",`<div class="reminder"><div class="group-title">리마인더 카드</div><p class="help">요일을 선택하고, 카드 줄의 화살표를 누르면 사진과 뒷면 안내문을 편집할 수 있습니다.</p><div class="reminder-switches">${makeCheck("clock_in","reminder_cards","출근보고에 표시",saved.clock_in)}${makeCheck("clock_out","reminder_cards","퇴근보고에 표시",saved.clock_out)}</div><div id="cardEditors">${saved.reminder_cards.map(cardEditor).join("")}</div><button id="addCard" class="small-btn add" type="button">+ 리마인더 카드 추가</button></div>`);panel.querySelectorAll(".card-editor").forEach(bindCardEditor);document.getElementById("addCard").onclick=()=>{if(panel.querySelectorAll(".card-editor").length>=12){alert("리마인더 카드는 최대 12개까지 만들 수 있습니다.");return;}const container=document.getElementById("cardEditors");container.insertAdjacentHTML("beforeend",cardEditor({id:`card-${Date.now()}`,title:"",image:"shiba-worker-logo-v2.png",text:"",weekdays:[0,1,2,3,4,5,6]},container.children.length));const row=container.lastElementChild;row.classList.add("open");bindCardEditor(row);};}
function loadConfig(next){config=next;document.getElementById("propertyName").value=config.property.name;document.getElementById("managementNumber").value=config.property.management_number??"미지정";roomTypesNode.replaceChildren();(config.property.room_types||[]).forEach(addRoomType);if(!roomTypesNode.children.length)addRoomType();accountsNode.replaceChildren();config.employees.forEach(addAccount);config.employees.forEach(employee=>{employeeConfigs[employee.employee_id]=employeeConfigs[employee.employee_id]||window.omgWorkConfig.normalizeReportConfig(employee.report_config);});const selected=select.value;select.replaceChildren();config.employees.forEach(employee=>select.add(new Option(employee.display_name,employee.employee_id)));if(config.employees.some(employee=>employee.employee_id===selected))select.value=selected;render();}
document.getElementById("addRoomType").onclick=()=>addRoomType();document.getElementById("addEmployee").onclick=()=>addAccount();select.addEventListener("change",render);
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;const loaded=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!loaded.can_manage){location.replace("app.html");return;}loadConfig(loaded);form.inert=false;})().catch(error=>{message.className="message error";message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();syncCurrent();message.textContent="";const button=document.getElementById("saveButton");button.disabled=true;button.textContent="저장 중...";try{const roomTypes=parseRoomTypes();if(!roomTypes.length)throw new Error("객실 타입과 객실번호를 한 개 이상 입력해주세요.");const accounts=collectAccounts();if(!accounts.length)throw new Error("근무자를 한 명 이상 등록해주세요.");for(const item of accounts){if(!item.display_name)throw new Error("근무자 이름을 입력해주세요.");if(!item.employee_id&&!item.pin)throw new Error(`${item.display_name}의 PIN을 입력해주세요.`);if(item.pin&&!/^[0-9]{6,8}$/.test(item.pin))throw new Error(`${item.display_name}의 PIN은 숫자 6~8자리여야 합니다.`);}config=await window.omgWorkConfig.saveEmployees(session.accessToken,accounts);config.employees.forEach(employee=>{employeeConfigs[employee.employee_id]=employeeConfigs[employee.employee_id]||window.omgWorkConfig.normalizeReportConfig(employee.report_config);});for(const item of Object.values(employeeConfigs)){if((item.clock_in.includes("reminder_cards")||item.clock_out.includes("reminder_cards"))&&!item.reminder_cards.length)throw new Error("표시할 리마인더 카드를 한 개 이상 완성해주세요.");}config=await window.omgWorkConfig.save(session.accessToken,document.getElementById("propertyName").value.trim(),roomTypes,employeeConfigs);loadConfig(config);message.className="message ok";message.textContent="전체 설정이 저장되었습니다. 직원 화면에 바로 반영됩니다.";}catch(error){message.className="message error";message.textContent=error.message||"설정을 저장하지 못했습니다.";}finally{button.disabled=false;button.textContent="전체 설정 저장";}});
</script></body></html>
