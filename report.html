space:nowrap;cursor:pointer}.room input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy);box-shadow:0 0 0 2px rgba(36,103,189,.08)}.compact-field{padding:15px 18px}.compact-input{width:76px;height:42px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:var(--navy);font-size:19px;font-weight:900;text-align:center}.expand-rooms{display:none;margin-top:14px;padding-top:13px;border-top:1px solid #edf2f8}.expand-rooms.open{display:block}.expand-note{margin:0 0 10px;color:var(--muted);font-size:11px}.empty{padding:15px;border-radius:13px;background:#f6f8fb;color:#7d8999;font-size:12px}.directive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.directive-card{height:280px;perspective:1000px;cursor:pointer}.directive-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}.directive-card.flipped .directive-inner{transform:rotateY(180deg)}.directive-face{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #dbe4f0;border-radius:16px;background:#fff;backface-visibility:hidden}.directive-front img{width:100%;height:100%;object-fit:cover}.directive-label{position:absolute;left:8px;right:8px;bottom:8px;padding:8px;border-radius:10px;background:rgba(24,49,83,.9);color:#fff;text-align:center;font-size:12px;font-weight:900}.directive-back{transform:rotateY(180deg);padding:13px 10px 10px;background:linear-gradient(155deg,#f8fbff,#eaf2fc)}.directive-back h3{margin:0 0 9px;color:var(--navy);font-size:14px;text-align:center}.directive-back p{margin:0;white-space:pre-line;color:#2b3f5c;font-size:13px;line-height:1.35}.ack{width:100%;min-height:38px;margin-top:auto;border:1px solid #cfd9e8;border-radius:10px;background:transparent;color:#53657d;font-weight:800}.directive-card.acknowledged .directive-face{border-color:#72a6e8}.directive-card.acknowledged .ack{background:var(--blue);color:#fff}.memo-card{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff}.memo-card label{display:block;margin-bottom:9px;color:var(--navy);font-size:16px;font-weight:900}.memo-card textarea{width:100%;min-height:100px;padding:13px;border:1px solid #cbd8e8;border-radius:13px;font:14px/1.5 inherit;resize:vertical}#reminderSlot .reminder-section{margin-top:14px}.submit{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.submit:disabled{opacity:.55}.message{min-height:20px;margin-top:11px;color:#c33;font-size:12px;text-align:center}#donePage{display:none;text-align:center;padding-top:90px}.done-card{padding:34px 22px;border:1px solid var(--line);border-radius:24px;background:#fff}.done-card .check{font-size:48px}.done-card h1{color:var(--navy)}.done-card p{color:var(--muted);line-height:1.6}.done-card a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}@media(max-width:420px){.field-card{padding:15px 12px}.room-group{grid-template-columns:58px minmax(0,1fr);gap:8px}.rooms{gap:4px}.room label{padding:8px 1px;border-radius:9px;font-size:11px}.directive-card{height:245px}.directive-back p{font-size:12px}}
.stepper{display:grid;grid-template-columns:38px 52px 38px;gap:6px;align-items:center}.stepper button{width:38px;height:38px;border:1px solid #cbd8e8;border-radius:11px;background:var(--soft);color:var(--blue);font-size:23px;font-weight:900;line-height:1;cursor:pointer}.stepper button:active{transform:scale(.94)}.stepper .compact-input{width:52px;height:38px;padding:0;font-size:18px;-moz-appearance:textfield}.stepper .compact-input::-webkit-inner-spin-button,.stepper .compact-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.custom-result .field-head{gap:10px}.custom-result h2{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}.custom-value{width:48%;min-width:0;max-width:240px;min-height:40px;padding:8px 10px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:var(--ink);font:14px inherit}.custom-choice{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue);background:var(--soft)}.custom-photo{display:flex;align-items:center;gap:5px;flex-shrink:0}.custom-photo .custom-choice{width:auto}.custom-photo img{width:40px;height:40px;border-radius:8px;object-fit:cover}.photo-remove{border:0;background:#fff0f1;border-radius:50%;color:#b83e4c;width:24px;height:24px}.room-dialog{width:calc(100% - 28px);max-width:520px;max-height:80dvh;border:0;border-radius:20px;padding:20px;color:var(--ink)}.room-dialog::backdrop{background:#18315377}.room-dialog h2{margin:0 0 20px}.room-done{width:100%;padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;margin-top:20px}[hidden]{display:none!important}

  <div class="top"><a class="back" href="app.html">‹ 메인으로</a><span id="propertyName" class="property">불러오는 중...</span></div>

<script>
const reportType = new URLSearchParams(location.search).get("type");
const isClockIn = reportType === "clock_in";
const title = isClockIn ? "출근보고" : "퇴근보고";
const form = document.getElementById("reportForm");
const fieldContainer = document.getElementById("fields");
const message = document.getElementById("formMessage");
let pageConfig = null;
let pendingEditPayload = null;
const customPhotos=new Map();let preparingPhotos=0;

function selectedRooms(key){return [...document.querySelectorAll(`input[name="${key}"]:checked`)].map(input=>input.value);}
function updateCount(key){const node=document.querySelector(`[data-count="${key}"]`);if(node)node.textContent=`${selectedRooms(key).length}개 선택`;}
function createStepper(id,label,onChange){const wrap=document.createElement("div");wrap.className="stepper";const minus=document.createElement("button"),input=document.createElement("input"),plus=document.createElement("button");minus.type=plus.type="button";minus.textContent="−";plus.textContent="+";minus.setAttribute("aria-label",`${label} 수량 줄이기`);plus.setAttribute("aria-label",`${label} 수량 늘리기`);input.id=id;input.className="compact-input";input.type="number";input.inputMode="numeric";input.min="0";input.max="99";input.value="0";input.setAttribute("aria-label",`${label} 수량`);const setValue=value=>{input.value=String(Math.max(0,Math.min(99,Number(value)||0)));input.dispatchEvent(new Event("input"));};minus.onclick=()=>setValue(Number(input.value)-1);plus.onclick=()=>setValue(Number(input.value)+1);input.addEventListener("change",()=>setValue(input.value));if(onChange)input.addEventListener("input",()=>onChange(input));wrap.append(minus,input,plus);return{wrap,input};}
function createCustomField(field,roomTypes){
 const section=document.createElement("section");section.className="field-card custom-result";const head=document.createElement("div");head.className="field-head";const heading=document.createElement("h2");heading.textContent=field.label;head.append(heading);section.append(head);
 if(field.kind==="text"||field.kind==="numeric"){const input=document.createElement("input");input.id=field.key;input.className="custom-value";input.type=field.kind==="numeric"?"number":"text";if(field.kind==="numeric"){input.step="any";input.inputMode="decimal";}else input.maxLength=500;input.setAttribute("aria-label",field.label);head.append(input);}
 else if(field.kind==="counter"){head.append(createStepper(field.key,field.label).wrap);}
 else if(field.kind==="rooms"){const button=document.createElement("button");button.type="button";button.className="custom-value custom-choice";button.id=field.key;button.textContent="객실선택";head.append(button);const dialog=document.createElement("dialog");dialog.className="room-dialog";const title=document.createElement("h2");title.textContent=field.label;dialog.append(title);if(roomTypes.length)appendRoomGroups(dialog,field,roomTypes);else{const empty=document.createElement("p");empty.textContent="등록된 객실이 없습니다.";dialog.append(empty);}const done=document.createElement("button");done.type="button";done.className="room-done";done.textContent="확인";dialog.append(done);section.append(dialog);const update=()=>{button.textContent=selectedRooms(field.key).join(", ")||"객실선택";button.title=button.textContent;};dialog.addEventListener("change",update);done.onclick=()=>{update();dialog.close();};button.onclick=()=>dialog.showModal();}
 else if(field.kind==="photo"){const wrap=document.createElement("div");wrap.className="custom-photo";const input=document.createElement("input");input.type="file";input.accept="image/*";input.id=field.key;input.hidden=true;const button=document.createElement("button");button.type="button";button.className="custom-value custom-choice";button.textContent="사진첨부";const img=document.createElement("img");img.hidden=true;img.alt=field.label;img.dataset.photo=field.key;const remove=document.createElement("button");remove.type="button";remove.className="photo-remove";remove.textContent="×";remove.hidden=true;remove.setAttribute("aria-label",field.label+" 사진 삭제");remove.onclick=()=>{customPhotos.delete(field.key);img.hidden=remove.hidden=true;button.textContent="사진첨부";};button.onclick=()=>input.click();input.onchange=async()=>{const file=input.files[0];if(!file)return;preparingPhotos++;button.disabled=true;button.textContent="준비 중";try{const url=await window.OMGPhoto.dataURL(file);customPhotos.set(field.key,url);img.src=url;img.hidden=remove.hidden=false;}catch(error){message.textContent=error.message;}finally{preparingPhotos--;button.disabled=false;button.textContent=customPhotos.has(field.key)?"변경":"사진첨부";input.value="";}};wrap.append(img,button,remove,input);head.append(wrap);}
 return section;
}
function customValue(field){if(field.kind==="photo")return customPhotos.get(field.key)||"";if(field.kind==="rooms")return selectedRooms(field.key);const input=document.getElementById(field.key);if(field.kind==="numeric"){if(!input?.value)return "";const value=Number(input.value);if(!Number.isFinite(value))throw new Error(field.label+" 숫자를 확인해주세요.");return value;}if(field.kind==="counter")return Math.max(0,Math.min(99,Number(input?.value)||0));return input?.value.trim()||"없음";}
function restoreCustomField(field,payload){const input=document.getElementById(field.key),value=payload[field.key];if(field.kind==="photo"){if(typeof value==="string"&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value)){customPhotos.set(field.key,value);const img=document.querySelector(`[data-photo="${field.key}"]`);if(img){img.src=value;img.hidden=false;img.parentNode.querySelector(".photo-remove").hidden=false;img.parentNode.querySelector(".custom-choice").textContent="변경";}}}else if(field.kind==="rooms"){const rooms=new Set(Array.isArray(value)?value:[]);document.querySelectorAll(`input[name="${field.key}"]`).forEach(box=>box.checked=rooms.has(box.value));if(input)input.textContent=[...rooms].join(", ")||"객실선택";}else if(input)input.value=value==="없음"?"":value??(field.kind==="counter"?0:"");}
function createField(field, roomTypes){
  if(field.custom)return createCustomField(field,roomTypes);
  const section=document.createElement("section");section.className="field-card";
  const head=document.createElement("div");head.className="field-head";
  const heading=document.createElement("h2");heading.textContent=field.label;
  const count=document.createElement("span");count.className="count";count.dataset.count=field.key;count.textContent="0개 선택";
  head.append(heading,count);section.append(head);
  const help=document.createElement("p");help.className="help";help.textContent=field.help;section.append(help);
  if(field.kind==="text"){count.remove();const input=document.createElement("input");input.type="text";input.id=field.key;input.maxLength=500;input.placeholder=`${field.label} 내용을 입력해주세요.`;section.append(input);return section;}
  if(field.kind==="number"){section.classList.add("compact-field");help.remove();count.remove();head.append(createStepper(field.key,field.label).wrap);return section;}
  if(field.kind==="room_count"){
    section.classList.add("compact-field");help.remove();count.remove();const stepper=createStepper(`${field.key}_count`,field.label,input=>expandable.classList.toggle("open",Number(input.value)>0)),input=stepper.input;head.append(stepper.wrap);
    const expandable=document.createElement("div");expandable.className="expand-rooms";expandable.innerHTML='<p class="expand-note">노쇼 객실을 선택해주세요.</p>';
    appendRoomGroups(expandable,field,roomTypes);section.append(expandable);
    input.addEventListener("input",()=>{input.value=String(Math.max(0,Math.min(99,Number(input.value)||0)));expandable.classList.toggle("open",Number(input.value)>0);});return section;
  }
  if(!roomTypes.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Property 설정에서 객실을 먼저 등록해주세요.";section.append(empty);return section;}
  appendRoomGroups(section,field,roomTypes);return section;
}
function appendRoomGroups(parent,field,roomTypes){roomTypes.forEach((group,groupIndex)=>{const block=document.createElement("div");block.className="room-group";const type=document.createElement("p");type.className="room-type";type.textContent=group.name;block.append(type);const list=document.createElement("div");list.className="rooms";group.rooms.forEach((room,index)=>{const wrap=document.createElement("span");wrap.className="room";const input=document.createElement("input");input.type="checkbox";input.name=field.key;input.value=room;input.id=`${field.key}-${groupIndex}-${index}`;input.addEventListener("change",()=>updateCount(field.key));const label=document.createElement("label");label.htmlFor=input.id;label.textContent=room;wrap.append(input,label);list.append(wrap);});block.append(list);parent.append(block);});}
function createReminder(cards){const section=document.createElement("section");section.className="reminder-section";section.innerHTML='<h2>리마인더 카드</h2><p class="help">사진을 누르면 뒷면 안내가 보입니다. 모든 내용을 확인해주세요.</p><div class="directive-grid"></div>';const grid=section.querySelector(".directive-grid");cards.forEach((item,index)=>{const card=document.createElement("article");card.className="directive-card";card.tabIndex=0;card.dataset.cardId=item.id;card.innerHTML=`<div class="directive-inner"><div class="directive-face directive-front"><img alt=""><span class="directive-label"></span></div><div class="directive-face directive-back"><h3></h3><p></p><button class="ack" type="button">이해했음</button></div></div>`;card.querySelector("img").src=item.image;card.querySelector("img").alt=item.title;card.querySelector(".directive-label").textContent=item.title;card.querySelector("h3").textContent=item.title;card.querySelector("p").textContent=item.text;card.addEventListener("click",event=>{if(!event.target.closest(".ack"))card.classList.toggle("flipped");});card.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&!event.target.closest("button")){event.preventDefault();card.classList.toggle("flipped");}});card.querySelector(".ack").addEventListener("click",event=>{event.stopPropagation();card.classList.add("acknowledged","flipped");event.currentTarget.textContent="✓ 이해했음";event.currentTarget.disabled=true;});grid.append(card);});return section;}
function currentWeekday(timezone){const short=new Intl.DateTimeFormat("en-US",{timeZone:timezone,weekday:"short"}).format(new Date());return({Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6})[short];}
function restorePayload(payload){if(!payload)return;document.getElementById("memo").value=payload.memo==="없음"?"":payload.memo||"";window.omgWorkConfig.fieldsFor(pageConfig?.property).forEach(field=>{if(field.custom){restoreCustomField(field,payload);return;}if(field.kind==="text"){const input=document.getElementById(field.key);if(input)input.value=payload[field.key]||"";return;}if(field.kind==="number"||field.kind==="room_count"){const input=document.getElementById(field.kind==="room_count"?`${field.key}_count`:field.key);if(input){input.value=String(Math.max(0,Number(payload[`${field.key}_count`]??payload[field.key])||0));if(field.kind==="room_count")input.dispatchEvent(new Event("input"));}if(field.kind==="number")return;}const selected=new Set(Array.isArray(payload[`${field.key}_array`])?payload[`${field.key}_array`]:String(payload[field.key]||"").split(",").map(value=>value.trim()));document.querySelectorAll(`input[name="${field.key}"]`).forEach(input=>input.checked=selected.has(input.value));updateCount(field.key);});const acknowledged=new Set(payload.reminder_cards_acknowledged||[]);document.querySelectorAll(".directive-card").forEach(card=>{if(acknowledged.has(card.dataset.cardId)){card.classList.add("acknowledged","flipped");const button=card.querySelector(".ack");button.textContent="✓ 이해했음";button.disabled=true;}});}
window.omgReport.onEdit=payload=>{pendingEditPayload=payload;if(pageConfig)restorePayload(payload);};
function buildPayload(session, config){
  const fields=window.omgWorkConfig.orderedFields(config.property,config.report_config[reportType]);
  const enabled=new Set(config.report_config[reportType]);
  const submittedAt=new Date();
  const payload={report_type:title,shift:"근무",property_name:config.property.name,submitted_at:submittedAt.toISOString(),submitted_at_text:submittedAt.toLocaleString("ko-KR"),worker:session.employeeName,memo:document.getElementById("memo").value.trim()||"없음"};
  const lines=[`[${title}]`,`숙소: ${config.property.name}`,`근로자: ${session.employeeName}`,isClockIn?`출근시각: ${window.omgReport.clockInText()}`:`제출시각: ${submittedAt.toLocaleString("ko-KR")}`,""];
  payload.report_fields=[];
  fields.filter(field=>enabled.has(field.key)).forEach(field=>{if(field.custom){const value=customValue(field);payload[field.key]=value;payload.report_fields.push({key:field.key,label:field.label,kind:field.kind,value:field.kind==="photo"?null:value});lines.push(`${field.label}: ${field.kind==="photo"?(value?"사진 첨부":"없음"):Array.isArray(value)?value.join(", ")||"없음":value}`,"");return;}payload.report_fields.push({key:field.key,label:field.label,kind:field.kind||"rooms",value:field.kind==="number"?Number(document.getElementById(field.key)?.value)||0:field.kind==="room_count"?{count:Number(document.getElementById(`${field.key}_count`)?.value)||0,rooms:selectedRooms(field.key)}:selectedRooms(field.key)});if(field.kind==="text"){const value=document.getElementById(field.key)?.value.trim()||"없음";payload[field.key]=value;lines.push(`${field.label}: ${value}`,"");return;}if(field.kind==="number"){const value=Math.max(0,Number(document.getElementById(field.key)?.value)||0);payload[`${field.key}_count`]=value;payload[field.key]=String(value);lines.push(`${field.label}: ${value}개`,"");return;}const rooms=selectedRooms(field.key);if(field.kind==="room_count"){const value=Math.max(0,Number(document.getElementById(`${field.key}_count`)?.value)||0);payload[`${field.key}_count`]=value;payload[`${field.key}_array`]=rooms;payload[field.key]=rooms.join(", ")||"없음";lines.push(`${field.label}: ${value}개`,rooms.join(", ")||"객실 미선택","");return;}payload[`${field.key}_array`]=rooms;payload[`${field.key}_count`]=rooms.length;payload[field.key]=rooms.join(", ")||"없음";lines.push(`${field.label}: ${rooms.length}개`,rooms.join(", ")||"없음","");});
  if(isClockIn){payload.watch_test_after_minutes=5;payload.watch_test_requested=true;}
  if(enabled.has("reminder_cards")){payload.reminder_cards_acknowledged=[...document.querySelectorAll(".directive-card.acknowledged")].map(card=>card.dataset.cardId);lines.push(`리마인더 확인: ${payload.reminder_cards_acknowledged.length}개`,"");}lines.push(`특이사항: ${payload.memo}`);payload.text=lines.join("\n");return payload;
}
(async()=>{

  if(!isClockIn){document.getElementById("doneText").textContent="퇴근시간이 기록되고 보고가 전달되었습니다.";document.getElementById("doneLink").href="login.html";document.getElementById("doneLink").textContent="확인";}
  const fields=window.omgWorkConfig.orderedFields(pageConfig.property,pageConfig.report_config[reportType]);
  if(fields.length)fields.forEach(field=>fieldContainer.append(createField(field,pageConfig.property.room_types||[])));
  const weekday=currentWeekday(session.timezone);const cards=pageConfig.report_config.reminder_cards.filter(card=>(card.report_types||["clock_in"]).includes(reportType)&&(card.report_weekdays?.[reportType]||card.weekdays||[0,1,2,3,4,5,6]).includes(weekday));
  if(enabled.has("reminder_cards")&&cards.length)document.getElementById("reminderSlot").append(createReminder(cards));

  if(pendingEditPayload)restorePayload(pendingEditPayload);
  window.omgTransition.ready();
})().catch(error=>{message.textContent=error.message;window.omgTransition.ready();});
