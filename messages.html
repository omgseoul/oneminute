<style>.mail-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:4px 0 16px;padding:4px;border-radius:14px;background:#eaf1fa}.mail-tabs[hidden],.list-title[hidden],.list[hidden]{display:none}.mail-tab{height:43px;border:0;border-radius:11px;background:transparent;color:#718198;font-weight:900}.mail-tab.on{background:#fff;color:#183153;box-shadow:0 3px 10px rgba(42,78,120,.1)}.compose-toggle.active{background:#e7eef7;color:#183153}.composer.compose-mode{position:relative;margin-top:5px;padding-top:0;border-color:#bfd3ea;box-shadow:0 9px 25px rgba(42,78,120,.1);overflow:visible}.composer.compose-mode:before{content:"";position:absolute;inset:0 0 auto;height:5px;border-radius:21px 21px 0 0;background:linear-gradient(90deg,#183153,#2467bd)}.compose-head{margin:0 -17px 17px;padding:26px 17px 17px;border-radius:21px 21px 0 0;background:linear-gradient(145deg,#f1f7ff,#fff)}.compose-kicker{display:block;color:#183153;font-size:25px;line-height:1;font-weight:1000;letter-spacing:.08em}.compose-head p{margin:10px 0 0;color:#708095;font-size:11px}@media(max-width:380px){.compose-head{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.compose-kicker{font-size:22px}}</style>

<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>메세지</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script><style>
:root{--navy:#183153;--blue:#2467bd;--red:#cf3943;--ink:#17243a;--muted:#708095;--line:#dfe8f4;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,textarea{font:inherit}.shell{width:min(100%,540px);margin:auto;padding:20px 14px calc(38px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{color:#718198;text-decoration:none;font-size:13px}.refresh{border:0;border-radius:11px;background:#eaf3ff;color:var(--blue);padding:9px 12px;font-size:11px;font-weight:900}.head{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 14px}.head h1{margin:0;font-size:31px;letter-spacing:-.05em}.unread{display:inline-grid;min-width:25px;height:25px;margin-left:6px;padding:0 7px;place-items:center;border-radius:999px;background:var(--red);color:white;font-size:11px;vertical-align:4px}.compose-toggle{height:42px;border:0;border-radius:13px;background:var(--navy);color:white;padding:0 15px;font-size:13px;font-weight:900}.composer{margin-bottom:15px;padding:17px;border:1px solid var(--line);border-radius:21px;background:white;box-shadow:0 6px 20px rgba(42,78,120,.06)}.composer[hidden]{display:none}.section-label{display:block;margin-bottom:9px;color:var(--navy);font-size:13px;font-weight:900}.recipients{display:flex;flex-wrap:wrap;gap:8px}.recipient{min-height:38px;border:1px solid #cdd9e8;border-radius:999px;background:#f8fafc;color:#55677e;padding:0 13px;font-size:12px;font-weight:800}.recipient.selected{border-color:var(--blue);background:#eaf3ff;color:var(--blue)}.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.type-button{height:42px;border:1px solid #d7e1ed;border-radius:12px;background:#f8fafc;color:#66778d;font-weight:900}.type-button.selected{border-color:var(--blue);background:#eaf3ff;color:var(--blue)}.type-button.urgent.selected{border-color:#e6a3a8;background:#fff0f1;color:var(--red)}.composer textarea{display:block;width:100%;min-height:128px;margin-top:13px;padding:14px;border:1px solid #ccd8e7;border-radius:14px;color:var(--ink);font-size:15px;line-height:1.55;resize:vertical}.composer textarea:focus{outline:3px solid rgba(36,103,189,.1);border-color:var(--blue)}.composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.count{color:#8a97a8;font-size:10px}.send{height:44px;border:0;border-radius:12px;background:var(--blue);color:white;padding:0 20px;font-weight:900}.send.urgent{background:var(--red)}.send:disabled{opacity:.55}.notice{min-height:18px;margin-top:8px;color:var(--red);font-size:11px;text-align:center}.list-title{margin:20px 3px 10px;color:var(--navy);font-size:16px}.list{display:grid;gap:9px}.message-card{width:100%;min-width:0;padding:15px 16px;border:1px solid var(--line);border-radius:18px;background:white;color:inherit;text-align:left;box-shadow:0 4px 15px rgba(42,78,120,.045)}.message-card.unread-card{border-color:#efb7bc;background:linear-gradient(145deg,#fff,#fff9f9)}.message-card.sent{background:#f8fbff}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.sender{min-width:0;overflow:hidden;font-size:14px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.time{flex:0 0 auto;color:#8995a5;font-size:10px}.preview{margin:8px 0 0;overflow:hidden;color:#4f6179;font-size:13px;line-height:1.45;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;margin-right:6px;padding:3px 7px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:9px;font-style:normal}.tag.urgent{background:#fff0f1;color:var(--red)}.tag.approval{background:#fff0df;color:#9a5700}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--red)}.empty{padding:40px 16px;border:1px dashed #cad7e6;border-radius:19px;background:rgba(255,255,255,.55);color:var(--muted);font-size:13px;text-align:center}.error{min-height:20px;margin-top:11px;color:var(--red);font-size:12px;text-align:center}.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding-top:24px;background:rgba(17,34,56,.48)}.overlay[hidden]{display:none}.sheet{display:flex;flex-direction:column;width:min(100%,540px);max-width:100vw;max-height:calc(100dvh - 24px);padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:white;overflow:hidden}.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet h2{min-width:0;margin:0;color:var(--navy);font-size:21px;overflow-wrap:anywhere}.close{flex:0 0 38px;width:38px;height:38px;border:0;border-radius:12px;background:#eff4fa;color:var(--navy);font-size:20px}.detail-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain}.meta{margin-top:8px;color:#8290a2;font-size:11px;line-height:1.5;overflow-wrap:anywhere}.body{margin-top:15px;padding:16px;border-radius:15px;background:#f6f8fc;color:#263a56;font-size:15px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}.attendance{display:grid;gap:8px;margin-top:14px}.attendance[hidden]{display:none}.attendance-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;padding:11px 12px;border-radius:12px;background:#f6f8fc;font-size:13px}.attendance-row b{color:#6d7b90}.attendance-row span{overflow-wrap:anywhere}.ack{width:100%;height:49px;margin-top:15px;border:0;border-radius:14px;background:var(--blue);color:white;font-weight:900}.ack.done{background:#eaf6f0;color:#23815a}@media(max-width:380px){.shell{padding-left:11px;padding-right:11px}.composer{padding:14px}.message-card{padding:14px}.sheet{padding-left:13px;padding-right:13px}}
</style></head><body><main class="shell"><div class="top"><a class="back" href="app.html">‹ 메인으로</a><button id="refresh" class="refresh" type="button">새로고침</button></div><header class="head"><h1>메세지 <span id="unread" class="unread">0</span></h1><button id="composeToggle" class="compose-toggle" type="button">+ 새 메세지</button></header><form id="composer" class="composer" hidden><span class="section-label">받는 사람 · 복수 선택 가능</span><div id="recipients" class="recipients"></div><div class="type-row"><button class="type-button selected" data-priority="normal" type="button">일반</button><button class="type-button urgent" data-priority="urgent" type="button">긴급</button></div><textarea id="messageText" maxlength="2000" placeholder="보낼 내용을 입력해주세요."></textarea><div class="composer-foot"><span id="charCount" class="count">0 / 2000</span><button id="send" class="send" type="submit">메세지 보내기</button></div><div id="notice" class="notice" role="alert"></div></form><h2 class="list-title">주고받은 메세지</h2><div id="list" class="list"><div class="empty">메세지를 불러오는 중입니다.</div></div><div id="error" class="error"></div></main><div id="detail" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2 id="detailTitle">메세지</h2><button id="close" class="close" type="button">×</button></div><div class="detail-scroll"><div id="detailMeta" class="meta"></div><div id="detailBody" class="body"></div><div id="attendance" class="attendance" hidden><div class="attendance-row"><b>근무일</b><span id="workDate"></span></div><div class="attendance-row"><b>기존 시간</b><span id="originalTime"></span></div><div class="attendance-row"><b>요청 시간</b><span id="requestedTime"></span></div></div></div><button id="ack" class="ack" type="button">확인</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
const PUSH_URL="https://asia-northeast3-guesthouse-manager-ajh.cloudfunctions.net/appUrgent";
let session=null,current=null,timer=null,priority="normal",lastData=null,activeMailbox="inbox",recipientItems=[];const selected=new Set(),requestedRecipientId=new URLSearchParams(location.search).get("recipient_employee_id");
const list=document.getElementById("list"),errorNode=document.getElementById("error"),composer=document.getElementById("composer"),notice=document.getElementById("notice"),messageText=document.getElementById("messageText");
composer.classList.add("compose-mode");composer.insertAdjacentHTML("afterbegin",'<div class="compose-head"><span class="compose-kicker">NEW MESSAGE</span><p>받는 사람을 선택하고 내용을 작성해주세요.</p></div>');
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function clean(value){return String(value??"").replace(/\\n/g,"\n").trim();}
function fmt(value){return new Date(value).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}
function hm(value){return value?new Date(value).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}):"-";}
async function rpc(name,args){const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"메세지를 처리하지 못했습니다.");return data;}
function syncRecipientDropdown(){const root=document.getElementById("recipients"),allSelected=recipientItems.length>0&&recipientItems.every(item=>selected.has(item.recipient_key));root.querySelectorAll(".recipient-option[data-key] input").forEach(input=>input.checked=selected.has(input.closest(".recipient-option").dataset.key));const all=root.querySelector("#recipientAll");if(all)all.checked=allSelected;const names=recipientItems.filter(item=>selected.has(item.recipient_key)).map(item=>item.display_name),summary=root.querySelector("#recipientSummary");if(summary)summary.textContent=!names.length?"받는 사람 선택":allSelected?`All · ${names.length}명`:names.length<=2?names.join(", "):`${names[0]} 외 ${names.length-1}명`;}
function renderRecipients(items){recipientItems=items||[];const valid=new Set(recipientItems.map(item=>item.recipient_key));for(const key of selected)if(!valid.has(key))selected.delete(key);const root=document.getElementById("recipients");root.innerHTML=`<button id="recipientTrigger" class="recipient-trigger" type="button" aria-expanded="false"><span id="recipientSummary">받는 사람 선택</span><b>⌄</b></button><div id="recipientPanel" class="recipient-panel" hidden><label class="recipient-option all"><input id="recipientAll" type="checkbox"><span>All</span></label>${recipientItems.map(item=>`<label class="recipient-option" data-key="${esc(item.recipient_key)}" data-id="${esc(item.employee_id||"")}" data-name="${esc(item.display_name)}"><input type="checkbox"><span>${esc(item.display_name)}</span></label>`).join("")}</div>`;const trigger=root.querySelector("#recipientTrigger"),panel=root.querySelector("#recipientPanel");trigger.onclick=()=>{panel.hidden=!panel.hidden;trigger.setAttribute("aria-expanded",String(!panel.hidden));trigger.querySelector("b").textContent=panel.hidden?"⌄":"⌃";};root.querySelector("#recipientAll").onchange=event=>{selected.clear();if(event.target.checked)recipientItems.forEach(item=>selected.add(item.recipient_key));syncRecipientDropdown();};root.querySelectorAll(".recipient-option[data-key] input").forEach(input=>input.onchange=()=>{const key=input.closest(".recipient-option").dataset.key;input.checked?selected.add(key):selected.delete(key);syncRecipientDropdown();});syncRecipientDropdown();}
function render(data){lastData=data;document.getElementById("unread").textContent=data.unread_count||0;renderRecipients(data.recipients);const items=(data.messages||[]).filter(item=>activeMailbox==="sent"?item.is_sender:!item.is_sender),title=document.querySelector(".list-title");title.textContent=activeMailbox==="sent"?"발신 메세지":"수신 메세지";if(!items.length){list.innerHTML=`<div class="empty">${activeMailbox==="sent"?"보낸":"받은"} 메세지가 없습니다.</div>`;return;}list.innerHTML=items.map(item=>{const urgent=item.priority==="urgent",approval=item.message_type==="attendance_approval"||item.message_type==="property_share_approval",unread=!item.is_sender&&!item.read_at;const target=item.is_sender?`받는 사람 · ${(item.recipient_labels||[]).join(", ")}`:item.sender_label;return`<button class="message-card ${unread?"unread-card":""} ${item.is_sender?"sent":""}" data-id="${item.message_id}" type="button"><div class="card-top"><span class="sender">${unread?'<i class="dot"></i>':""}${urgent?'<i class="tag urgent">긴급</i>':approval?'<i class="tag approval">결재</i>':'<i class="tag">일반</i>'}${esc(target)}</span><span class="time">${fmt(item.created_at)}</span></div><p class="preview">${esc(clean(item.message))}</p></button>`;}).join("");list.querySelectorAll(".message-card").forEach((button,index)=>button.onclick=()=>openDetail(items[index]));}
async function load(){if(!session)return;try{const data=await rpc("list_property_messages",{p_access_token:session.accessToken});render(data);errorNode.textContent="";}catch(error){errorNode.textContent=error.message;}}
async function pushMessage(messageId){const response=await fetch(PUSH_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:session.accessToken,message_id:messageId})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.message||"메세지 알림을 전송하지 못했습니다.");}
function setComposeOpen(open,focus=true){composer.hidden=!open;mailTabs.hidden=open;document.querySelector(".list-title").hidden=open;list.hidden=open;const toggle=document.getElementById("composeToggle");toggle.textContent=open?"작성 취소":"+ 새 메세지";toggle.classList.toggle("active",open);if(open&&focus)messageText.focus();}
function openRequestedComposer(){if(!requestedRecipientId)return;const recipient=recipientItems.find(item=>item.employee_id===requestedRecipientId);if(!recipient)return;selected.add(recipient.recipient_key);syncRecipientDropdown();setComposeOpen(true);history.replaceState(null,"","messages.html");}
function replyTo(item){selected.clear();const recipient=item.sender_type==="owner"?recipientItems.find(node=>node.recipient_key==="owner"):recipientItems.find(node=>(item.sender_employee_id&&node.employee_id===item.sender_employee_id)||node.display_name===item.sender_label);if(!recipient){errorNode.textContent="답장할 사람을 찾지 못했습니다. 새 메세지에서 수신자를 선택해주세요.";document.getElementById("detail").hidden=true;setComposeOpen(true);return;}selected.add(recipient.recipient_key);syncRecipientDropdown();document.getElementById("detail").hidden=true;setComposeOpen(true);messageText.focus();}
async function openDetail(item){current=item;const attendanceApproval=item.message_type==="attendance_approval",shareApproval=item.message_type==="property_share_approval",approval=attendanceApproval||shareApproval,urgent=item.priority==="urgent";document.getElementById("detailTitle").textContent=attendanceApproval?"출퇴근 수정 결재":shareApproval?"Property 공유 결재":urgent?"긴급 메세지":"메세지";document.getElementById("detailMeta").textContent=`${item.is_sender?`받는 사람 · ${(item.recipient_labels||[]).join(", ")}`:`보낸 사람 · ${item.sender_label}`} · ${fmt(item.created_at)}`;document.getElementById("detailBody").textContent=clean(item.message);const attendance=document.getElementById("attendance");attendance.hidden=!attendanceApproval;if(attendanceApproval){document.getElementById("workDate").textContent=item.work_date||"-";document.getElementById("originalTime").textContent=`${hm(item.original_clock_in_at)} ~ ${hm(item.original_clock_out_at)}`;document.getElementById("requestedTime").textContent=`${hm(item.requested_clock_in_at)} ~ ${hm(item.requested_clock_out_at)}`;}const button=document.getElementById("ack"),approved=item.approval_status==="approved";button.hidden=item.is_sender;button.textContent=approval?(approved?"✓ 결재완료":"결재 승인"):"답장";button.classList.toggle("done",approval&&approved);button.disabled=approval&&approved;document.getElementById("detail").hidden=false;if(!item.is_sender&&!item.read_at&&!approval){try{await rpc("mark_property_message_read",{p_access_token:session.accessToken,p_message_id:item.message_id});item.read_at=new Date().toISOString();await load();}catch(_){}}}
const mailTabs=document.createElement("div");mailTabs.className="mail-tabs";mailTabs.innerHTML='<button class="mail-tab on" data-mailbox="inbox" type="button">수신함</button><button class="mail-tab" data-mailbox="sent" type="button">발신함</button>';document.querySelector(".head").after(mailTabs);mailTabs.querySelectorAll(".mail-tab").forEach(button=>button.onclick=()=>{activeMailbox=button.dataset.mailbox;mailTabs.querySelectorAll(".mail-tab").forEach(x=>x.classList.toggle("on",x===button));if(lastData)render(lastData);});document.getElementById("composeToggle").onclick=()=>setComposeOpen(composer.hidden);document.getElementById("refresh").onclick=load;document.getElementById("close").onclick=()=>document.getElementById("detail").hidden=true;document.getElementById("detail").onclick=e=>{if(e.target.id==="detail")e.currentTarget.hidden=true;};
document.querySelectorAll(".type-button").forEach(button=>button.onclick=()=>{priority=button.dataset.priority;document.querySelectorAll(".type-button").forEach(x=>x.classList.toggle("selected",x===button));const send=document.getElementById("send");send.classList.toggle("urgent",priority==="urgent");send.textContent=priority==="urgent"?"긴급 메세지 보내기":"메세지 보내기";});messageText.oninput=()=>document.getElementById("charCount").textContent=`${messageText.value.length} / 2000`;
composer.onsubmit=async event=>{event.preventDefault();const value=messageText.value.trim(),employeeIds=recipientItems.filter(item=>selected.has(item.recipient_key)).map(item=>item.employee_id).filter(Boolean),includeOwner=selected.has("owner"),button=document.getElementById("send");if(!selected.size){notice.textContent="받는 사람을 선택해주세요.";return;}if(!value){notice.textContent="메세지 내용을 입력해주세요.";return;}button.disabled=true;notice.textContent="";try{const data=await rpc("send_property_message",{p_access_token:session.accessToken,p_recipient_employee_ids:employeeIds,p_include_owner:includeOwner,p_message:value,p_priority:priority,p_message_type:"general"});await pushMessage(data.message_id);messageText.value="";selected.clear();setComposeOpen(false,false);await load();}catch(error){notice.textContent=error.message;}finally{button.disabled=false;}};
document.getElementById("ack").onclick=async()=>{if(!current)return;const approval=current.message_type==="attendance_approval"||current.message_type==="property_share_approval";if(!approval){replyTo(current);return;}const button=document.getElementById("ack");button.disabled=true;try{if(current.message_type==="attendance_approval")await rpc("approve_attendance_adjustment",{p_access_token:session.accessToken,p_request_id:current.attendance_request_id});else await rpc("approve_property_share",{p_access_token:session.accessToken,p_request_id:current.property_share_request_id});document.getElementById("detail").hidden=true;await load();}catch(error){errorNode.textContent=error.message;button.disabled=false;}};
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;await load();openRequestedComposer();timer=setInterval(load,10000);window.omgTransition.ready();})().catch(error=>{errorNode.textContent=error.message;window.omgTransition.ready();});addEventListener("pagehide",()=>clearInterval(timer));
</script></body></html>
