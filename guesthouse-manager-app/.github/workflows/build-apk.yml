name: Build Guesthouse Manager APK
on:
  workflow_dispatch:
  push:
    paths: ['guesthouse-manager-app/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleDebug
        working-directory: guesthouse-manager-app
      - uses: actions/upload-artifact@v4
        with:
          name: Guesthouse-Manager-debug
          path: guesthouse-manager-app/app/build/outputs/apk/debug/app-debug.apk
