<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fc">
  <title>사장 로그인</title>
  <style>
    :root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,480px);min-height:100vh;margin:auto;padding:38px 18px calc(32px + env(safe-area-inset-bottom));display:flex;align-items:center}.card{width:100%;padding:28px 22px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 12px 34px rgba(42,78,120,.1)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:25px}.brand img{width:70px;height:70px;object-fit:contain}.brand small{display:block;margin-bottom:4px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em}.brand h1{margin:0;color:var(--navy);font-size:29px;letter-spacing:-.05em}.intro{margin:0 0 23px;color:var(--muted);font-size:13px;line-height:1.55}label{display:block;margin:16px 2px 7px;color:var(--navy);font-size:13px;font-weight:800}input{width:100%;height:52px;padding:0 14px;border:1px solid #cfdaea;border-radius:13px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus{border-color:#6a9ddd;box-shadow:0 0 0 3px rgba(36,103,189,.1)}button{width:100%;height:54px;margin-top:23px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.message{min-height:20px;margin:13px 2px 0;color:#c33;font-size:12px;text-align:center}.links{display:flex;justify-content:center;margin-top:18px}.links a{color:#718198;font-size:12px;text-decoration:none}
  </style>
</head>
<body><main class="shell"><section class="card">
  <div class="brand"><img src="shiba-worker-logo-v2.png" alt="OMG Works 시바견"><div><small>OWNER CONSOLE</small><h1 id="propertyTitle">사장 로그인</h1></div></div>
  <p class="intro">사장 전용 계정입니다.<br>로그인해도 직원 출근기록에는 포함되지 않습니다.</p>
  <form id="ownerLoginForm">
    <label for="loginId">사장 아이디</label><input id="loginId" type="text" autocomplete="username" maxlength="50" required>
    <label for="pin">사장 PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="current-password" placeholder="6~8자리 숫자" required>
    <button id="loginButton" type="submit">사장 로그인</button><div id="message" class="message" role="alert"></div>
  </form>
  <div class="links"><a href="login.html">직원 로그인으로</a></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("ownerLoginForm");const button=document.getElementById("loginButton");const message=document.getElementById("message");
window.omgWorkConfig.loadLoginProperty().then(property=>{document.getElementById("propertyTitle").textContent=property.property_name;document.title=`${property.property_name} 사장 로그인`;}).catch(error=>{message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";button.disabled=true;button.textContent="확인 중...";try{const{data,error}=await window.omgSupabase.rpc("start_owner_session",{p_login_id:document.getElementById("loginId").value.trim(),p_pin:document.getElementById("pin").value,p_business_code:window.OMG_SUPABASE.businessCode,p_property_code:window.OMG_SUPABASE.propertyCode});if(error||!data?.ok)throw new Error(data?.message||"로그인하지 못했습니다.");window.omgSession.set(window.omgSession.fromResponse(data,data.access_token));location.replace("app.html");}catch(error){message.textContent=error.message||"로그인하지 못했습니다.";}finally{document.getElementById("pin").value="";button.disabled=false;button.textContent="사장 로그인";}});
</script></body></html>
