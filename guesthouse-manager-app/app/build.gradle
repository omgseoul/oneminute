plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.oneminute.guesthousemanager'
    compileSdk 35
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs += ['../../assets/chat-stickers'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testBuildType System.getenv('OMS_CHAT_TEST_BUILD') ?: 'release'
    signingConfigs {
        release {
            if (System.getenv('OMS_KEYSTORE_FILE')) {
                storeFile file(System.getenv('OMS_KEYSTORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('OMS_STORE_PASSWORD')
                keyAlias System.getenv('OMS_KEY_ALIAS')
                keyPassword System.getenv('OMS_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    defaultConfig {
        applicationId 'com.oneminute.guesthousemanager'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('OMS_VERSION_CODE') ?: '35')
        versionName '0.16.10'
        testInstrumentationRunner 'com.oneminute.guesthousemanager.UpdateProbe'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
