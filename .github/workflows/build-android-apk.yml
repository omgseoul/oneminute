name: Build Guesthouse Manager APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'guesthouse-manager-app/**'
      - '.github/workflows/build-android-apk.yml'
  push:
    paths:
      - 'guesthouse-manager-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON is required to build the APK."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        working-directory: guesthouse-manager-app
      - name: Build debug APK
        run: gradle clean assembleDebug --no-build-cache --stacktrace
        working-directory: guesthouse-manager-app
      - uses: actions/upload-artifact@v4
        with:
          name: Guesthouse-Manager-debug
          path: guesthouse-manager-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          install -D guesthouse-manager-app/app/build/outputs/apk/debug/app-debug.apk downloads/Guesthouse-Manager-0.8.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Guesthouse-Manager-0.8.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Guesthouse Manager 0.8.0 APK [skip ci]"
            git push
          fi
