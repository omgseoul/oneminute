<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>게하관리</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--red:#dc4242;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{display:flex;flex-direction:column;width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:0 3px 15px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--navy)}.logout{border:0;background:transparent;color:#8794a7;font-size:12px;padding:8px}.hero{position:relative;min-height:180px;padding:31px 145px 28px 23px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 9px 28px rgba(42,78,120,.08);overflow:hidden}.hero:after{content:"";position:absolute;right:-45px;bottom:-75px;width:180px;height:180px;border-radius:50%;background:#edf5ff}.hero h1{position:relative;z-index:2;margin:0;color:var(--navy);font-size:38px;line-height:1.05;letter-spacing:-.055em;overflow-wrap:anywhere}.hero h1.loading{width:150px;height:76px;border-radius:12px;background:linear-gradient(90deg,#edf2f8 25%,#f7f9fc 50%,#edf2f8 75%);background-size:200% 100%;animation:title-loading 1.2s infinite;color:transparent}.hero p{position:relative;z-index:2;margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.shiba{position:absolute;z-index:2;right:7px;bottom:24px;width:145px;height:145px;object-fit:contain}.section-title{margin:24px 3px 11px;color:var(--navy);font-size:17px;letter-spacing:-.03em}.menu{display:grid;gap:12px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{display:flex;align-items:center;justify-content:center;min-height:88px;padding:16px 8px;text-align:center}.report-card .copy b{margin:0;font-size:20px;line-height:1.2;white-space:nowrap}.report-card .copy span{display:block;margin-top:6px;font-size:11px;line-height:1.3}.card{position:relative;display:flex;align-items:center;min-height:104px;padding:19px 53px 19px 19px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 5px 18px rgba(42,78,120,.055);transition:.14s}.card:active{transform:scale(.978)}.copy{min-width:0}.copy b{display:block;margin-bottom:5px;color:var(--navy);font-size:17px}.copy span{color:var(--muted);font-size:12px}.secondary-grid,.owner-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-card{justify-content:space-between;min-height:88px;padding:12px 13px 12px 17px;text-align:left}.quick-card .copy b{margin:0;font-size:18px;line-height:1.18;white-space:normal}.quick-card.urgent .copy b{color:#bd3131;font-size:18px;letter-spacing:-.04em}.quick-card .copy span{display:none}.quick-visual{display:grid;place-items:center;flex:0 0 56px;width:56px;height:56px;margin-left:8px;border-radius:18px;background:#edf5ff;color:var(--navy);overflow:hidden}.quick-visual svg{width:36px;height:36px}.urgent .quick-visual{background:#fff0f0;font-size:30px}.account-dogs svg{width:58px;height:34px}.mission-counter{display:grid;place-items:center;align-content:center;flex:0 0 56px;width:56px;height:56px;margin-left:8px;border-radius:50%;background:#eaf3ff;color:var(--blue);line-height:1}.mission-counter strong{font-size:20px}.mission-counter small{margin-top:3px;font-size:8px;font-weight:900;white-space:nowrap}.owner-grid .card,.attendance-card{display:none}.owner-grid .quick-card .copy b{font-size:15px}.attendance-card{grid-column:1/-1;min-height:82px}.attendance-card .quick-visual{border-radius:17px}.staff-status-card{display:none}.notice-section{margin-top:23px;padding:0 3px}.notice-section .section-title{margin:0 0 9px;font-size:19px;font-weight:900}.notice-line{display:flex;align-items:flex-start;gap:7px;margin:0;color:var(--muted);font-size:14.3px;font-weight:700;line-height:1.65;white-space:pre-line}.notice-mark{color:var(--navy);font-weight:900}.notice-section.empty{display:none}@media(max-width:390px){.quick-card{padding:11px 11px 11px 14px}.quick-card .copy b,.quick-card.urgent .copy b{font-size:17px}.quick-visual,.mission-counter{width:52px;height:52px;flex-basis:52px;margin-left:5px}.quick-visual{font-size:28px}.mission-counter strong{font-size:18px}.owner-grid .quick-card .copy b{font-size:14px}}.foot{margin:auto 3px 0;padding-top:54px;color:#98a3b2;font-size:10px;text-align:center}@keyframes title-loading{to{background-position:-200% 0}}
.report-card{justify-content:space-between;padding:13px 12px 13px 16px;text-align:left}.report-card .report-dog{flex:0 0 64px;width:64px;height:64px;margin-left:4px;object-fit:contain}.report-card .copy b{font-size:18px}@media(max-width:390px){.report-card{padding-left:12px}.report-card .report-dog{flex-basis:55px;width:55px;height:55px}.report-card .copy b{font-size:17px}.report-card .copy span{font-size:10px}}
</style></head><body><main class="shell">
<div class="top"><span id="workerStatus" class="eyebrow">GUESTHOUSE MANAGER</span><button class="logout" onclick="logoutWorkApp()">로그아웃</button></div>
<section class="hero"><h1 id="propertyTitle" class="loading" aria-busy="true"></h1><p>게스트하우스 업무를<br>빠르고 정확하게</p><img class="shiba" src="shiba-worker-logo-v2.png?v=1" alt="시바견 캐릭터"></section>
<h2 class="section-title">업무 메뉴</h2>
<nav id="mainMenu" class="menu" inert>
<div id="reportMenu" class="report-grid"><a class="card report-card" href="report.html?type=clock_in"><span class="copy"><b>출근보고</b><span>근무 시작 보고</span></span><img class="report-dog" src="shiba-face-morning-in.png" alt="밝은 강아지 얼굴"></a><a class="card report-card" href="report.html?type=clock_out"><span class="copy"><b>퇴근보고</b><span>업무 마감 보고</span></span><img class="report-dog" src="shiba-face-morning-out-slim.png" alt="살짝 헬쓱한 지친 강아지 얼굴"></a></div>
<div id="ownerSettingsMenu" class="owner-grid"><a id="settings" class="card quick-card" href="owner-settings.html"><span class="copy"><b>Property</b></span><span class="quick-visual" data-icon="building-2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18M6 12H4a2 2 0 0 0-2 2v8h20v-8a2 2 0 0 0-2-2h-2M10 6h4M10 10h4M10 14h4M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a><a id="accountManagement" class="card quick-card" href="staff-management.html"><span class="copy"><b>계정관리</b></span><span class="quick-visual" data-icon="users-round" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M18 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M22 21a8 8 0 0 0-5.2-7.5M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span></a></div>
<div id="secondaryMenu" class="secondary-grid"><a id="emergency" class="card quick-card urgent" href="emergency.html"><span class="copy"><b>사장님<br>긴급보고</b><span>긴급 상황 보고</span></span><span class="quick-visual" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 23h14M11 23v-8a5 5 0 0 1 10 0v8M8 27h16" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 5V2M7.5 8.5 5 6M24.5 8.5 27 6M5 16H2M30 16h-3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M15 13.5h2M14 17h4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></span></a>
<a id="owner-inbox" class="card quick-card" href="owner-inbox.html" style="display:none"><span class="copy"><b>메세지함</b><span>직원 긴급보고 확인</span></span><span class="quick-visual" data-icon="message-square-text" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 8h8M8 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span></a>
<a id="missionMenu" class="card quick-card" href="mission.html"><span class="copy"><b>미션</b><span id="missionCopy">오늘의 업무와 전달사항 확인</span></span><span id="missionCounter" class="mission-counter"><strong id="todayMissionCount">0</strong><small>당일미션</small></span></a>
<a id="staffWorkStatus" class="card quick-card staff-status-card" href="attendance.html"><span class="copy"><b>근무현황</b></span><span class="quick-visual" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M5 25V17M12 25V11M19 25V15M26 25V6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 27h24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></a>
<a id="attendanceManagement" class="card quick-card attendance-card" href="attendance.html"><span class="copy"><b>근무시간 관리</b><span>출퇴근 및 근무시간 통계</span></span><span class="quick-visual" data-icon="chart-no-axes-combined" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16v5M16 14v7M20 10v11M4 18v3M8 14v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m22 3-8.65 8.65a.5.5 0 0 1-.7 0L9.35 8.35a.5.5 0 0 0-.7 0L2 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a></div>
</nav><p class="foot">OMG WORKS · STAFF MANAGEMENT</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
(async () => {
  const session = await window.omgSession.require({ allowCompleted: true });
  if (!session) return;
  const config = await window.omgWorkConfig.load(session.accessToken);
  const isOwner = session.sessionKind === "owner" && config.can_manage;
  const state = isOwner ? "관리 모드" : session.status === "completed" ? "근무 종료 · 보고 전송 확인" : "근무 중";
  document.getElementById("workerStatus").textContent = `${session.employeeName} · ${state}`;
  const propertyTitle = document.getElementById("propertyTitle");
  propertyTitle.textContent = config.property.name;
  propertyTitle.classList.remove("loading");
  propertyTitle.removeAttribute("aria-busy");
  document.title = `${config.property.name} · 게하관리`;
  document.getElementById("reportMenu").style.display = isOwner ? "none" : "";
  document.getElementById("settings").style.display = isOwner ? "flex" : "none";document.getElementById("accountManagement").style.display = isOwner ? "flex" : "none";document.getElementById("attendanceManagement").style.display = isOwner ? "flex" : "none";document.getElementById("staffWorkStatus").style.display = isOwner ? "none" : "flex";
  document.getElementById("owner-inbox").style.display = isOwner ? "" : "none";
  document.getElementById("emergency").style.display = isOwner ? "none" : "";
  document.getElementById("missionCopy").textContent = isOwner ? "미션 등록·진행 확인" : "오늘의 업무와 전달사항 확인";
const{data}=await window.omgSupabase.rpc("list_missions",{p_access_token:session.accessToken});if(data?.ok){const todayCount=(data.missions||[]).filter(item=>item.timing==="today"&&(isOwner?(Number(item.target_count)||0)>(Number(item.completed_count)||0):(!item.target_employee_ids?.length||item.target_employee_ids.includes(session.employeeId))&&!(item.completion_employee_ids||[]).includes(session.employeeId))).length;document.getElementById("todayMissionCount").textContent=String(todayCount);}  document.getElementById("mainMenu").inert = false;
})().catch(error => { document.getElementById("workerStatus").textContent = error.message; });
async function logoutWorkApp(){await window.omgSession.logout();location.replace("login.html");}
</script></body></html>
