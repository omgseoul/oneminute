<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>현장 게스트 채팅</title><link rel="stylesheet" href="guest-support.css"></head><body><main><div class="top"><a class="back" href="app.html">‹ 메인으로</a><button id="refresh" class="btn subtle">새로고침</button></div><div class="eyebrow">GUEST SUPPORT</div><h1>게스트 채팅</h1><p class="help">함께 확인하고, 담당자를 정해 대응하세요.</p><div class="grid2"><label class="field">지점<select id="property"><option value="">전체 지점</option></select></label><label class="field">대화 상태<select id="filter"><option value="open">진행 중</option><option value="all">전체 대화</option><option value="closed">종료됨</option></select></label></div><div id="status" class="status" role="status"></div><div id="rooms" class="room-list"></div><button id="older" class="btn wide" hidden>이전 대화 더 보기</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="guest-support-client.js"></script><script>
(async()=>{const G=GuestSupport,s=await omgSession.require({allowCompleted:true});if(!s)return;let busy=false,timer,rows=[],loaded=false,cursor=null,paged=false;const list=document.getElementById('rooms'),filter=document.getElementById('filter'),property=document.getElementById('property');function render(){const visible=rows.filter(r=>filter.value==='all'||r.status===filter.value);list.innerHTML=visible.map(r=>`<a class="room" href="guest-chat.html?room=${r.id}"><span class="avatar">${G.esc(r.guest_name.slice(0,1))}</span><div class="grow"><div class="row between"><span class="name">${G.esc(r.guest_name)}</span><time>${G.esc(new Date(r.updated_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</time></div><div class="preview">${G.esc(r.preview||'현장 게스트와의 대화가 시작되었습니다.')}</div><div class="row between" style="margin-top:9px"><span class="meta">${G.esc(r.property_name)} · ${G.esc(r.room_number||'객실 미정')}</span>${Number(r.unread)?`<span class="unread">${Number(r.unread)}</span>`:''}</div><span class="badge ${r.assigned_name?'online':''}" style="margin-top:8px">${G.esc(r.status==='closed'?'대화 종료':r.assigned_name?r.assigned_name+' 대응 중':'담당자 대기')}</span></div></a>`).join('')||'<div class="empty">표시할 대화가 없습니다.</div>';}
async function load(older=false){if(busy||document.hidden)return;busy=true;clearTimeout(timer);try{const v=await G.call('rooms',{property_id:property.value,...(older&&cursor?{before_updated:cursor.updated_at,before_id:cursor.id}:{})},{access_token:s.accessToken});const merge=new Map(rows.map(r=>[r.id,r]));v.rooms.forEach(r=>merge.set(r.id,r));rows=[...merge.values()].sort((a,b)=>b.updated_at.localeCompare(a.updated_at)||b.id.localeCompare(a.id));if(older)paged=true;if(older||!paged){cursor=v.rooms.at(-1)||null;document.getElementById('older').hidden=v.rooms.length<50;}if(!loaded){v.properties.forEach(p=>{const o=new Option(p.name,p.id);property.add(o);});loaded=true;}render();G.message('');}catch(e){G.message(e.message,true);}finally{busy=false;timer=setTimeout(()=>load(),5000);}}filter.onchange=render;property.onchange=()=>{rows=[];cursor=null;paged=false;load();};document.getElementById('refresh').onclick=()=>load();document.getElementById('older').onclick=()=>load(true);document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)load();});await load();})().catch(e=>GuestSupport.message(e.message,true));
</script></body></html>
