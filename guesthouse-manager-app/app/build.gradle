plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.oneminute.guesthousemanager'
    compileSdk 35
    buildFeatures { buildConfig true }
    testBuildType 'release'
    signingConfigs {
        release {
            if (System.getenv('OMS_KEYSTORE_FILE')) {
                storeFile file(System.getenv('OMS_KEYSTORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('OMS_STORE_PASSWORD')
                keyAlias System.getenv('OMS_KEY_ALIAS')
                keyPassword System.getenv('OMS_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    defaultConfig {
        applicationId 'com.oneminute.guesthousemanager'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('OMS_VERSION_CODE') ?: '28')
        versionName '0.15.0'
        testInstrumentationRunner 'com.oneminute.guesthousemanager.UpdateProbe'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
