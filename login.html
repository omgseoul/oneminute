<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>게하워크 PIN 로그인</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{width:min(100%,480px);min-height:100vh;margin:auto;padding:34px 18px calc(32px + env(safe-area-inset-bottom));display:flex;align-items:center}.card{width:100%;padding:28px 22px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 12px 34px rgba(42,78,120,.1)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:23px}.brand img{width:76px;height:76px;object-fit:contain}.brand small{display:block;margin-bottom:4px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em}.brand h1{margin:0;color:var(--navy);font-size:29px;letter-spacing:-.05em}.intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.55}.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:14px;background:#edf3fa}.role-tabs button{height:43px;border:0;border-radius:11px;background:transparent;color:#748399;font-size:14px;font-weight:900}.role-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(42,78,120,.1)}label{display:block;margin:16px 2px 7px;color:var(--navy);font-size:13px;font-weight:900}select,input{width:100%;height:52px;padding:0 14px;border:1px solid #cfdaea;border-radius:13px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus,select:focus{border-color:#6a9ddd;box-shadow:0 0 0 3px rgba(36,103,189,.1)}.primary{width:100%;height:54px;margin-top:23px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.primary:disabled{opacity:.55}.message{min-height:20px;margin:13px 2px 0;color:#c33;font-size:12px;text-align:center}.account-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:#8b97a7;font-size:11px}.account-row button{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:900}.foot{margin:20px 0 0;color:#9aa5b4;font-size:10px;text-align:center}
</style></head><body><main class="shell"><section class="card">
<div class="brand"><img src="shiba-worker-logo-v2.png" alt="게하워크 시바견"><div><small>OMG WORKS</small><h1 id="propertyTitle">게하워크</h1></div></div>
<p class="intro">유형을 선택하고 계정과 개인 PIN을 입력하세요.<br>근무자 로그인 시간은 오늘의 출근시간으로 기록됩니다.</p>
<div class="role-tabs"><button id="staffTab" class="on" type="button">근무자</button><button id="adminTab" type="button">관리자</button></div>
<form id="loginForm">
<label id="accountLabel" for="accountSelect">근무자</label><select id="accountSelect" required><option value="">불러오는 중...</option></select>
<label for="pin">개인 PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="off" placeholder="6~8자리 숫자" required>
<button id="loginButton" class="primary" type="submit" disabled>로그인</button><div id="message" class="message" role="alert"></div>
</form>
<div class="account-row"><span id="accountEmail"></span><button type="button" onclick="window.omgAccount.logout()">계정 로그아웃</button></div>
<p class="foot">LOGIN TIME = CLOCK-IN TIME</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
let role="staff",staff=[],admins=[];const accountSelect=document.getElementById("accountSelect"),button=document.getElementById("loginButton"),message=document.getElementById("message");
function renderAccounts(){const source=role==="staff"?staff:admins,label=role==="staff"?"근무자":"관리자";document.getElementById("accountLabel").textContent=label;accountSelect.replaceChildren(new Option(role==="staff"?"직원을 선택하세요":"관리자",""));source.forEach((item,index)=>accountSelect.add(new Option(role==="staff"?item.display_name:(source.length===1?"관리자":item.display_name),role==="staff"?item.employee_id:item.owner_id)));button.disabled=!source.length;message.textContent=source.length?"":`로그인 가능한 ${label} 계정이 없습니다.`;}
function setRole(next){role=next;document.getElementById("staffTab").classList.toggle("on",role==="staff");document.getElementById("adminTab").classList.toggle("on",role==="admin");renderAccounts();}
document.getElementById("staffTab").onclick=()=>setRole("staff");document.getElementById("adminTab").onclick=()=>setRole("admin");
async function ready(){const account=await window.omgAccount.require();if(!account)return;document.getElementById("accountEmail").textContent=account.user.email||"";const[property,resultStaff,resultAdmins]=await Promise.all([window.omgWorkConfig.loadLoginProperty(),window.omgSupabase.rpc("list_login_employees",{p_business_code:window.OMG_SUPABASE.businessCode,p_property_code:window.OMG_SUPABASE.propertyCode}),window.omgSupabase.rpc("list_login_admins",{p_business_code:window.OMG_SUPABASE.businessCode,p_property_code:window.OMG_SUPABASE.propertyCode})]);if(resultStaff.error||resultAdmins.error)throw new Error("로그인 계정 목록을 불러오지 못했습니다.");staff=resultStaff.data||[];admins=resultAdmins.data||[];document.getElementById("propertyTitle").textContent=property.property_name;document.title=`${property.property_name} 로그인`;renderAccounts();}
document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();message.textContent="";button.disabled=true;button.textContent="로그인 중...";try{const args=role==="staff"?{p_employee_id:accountSelect.value,p_pin:document.getElementById("pin").value,p_shift:"general",p_business_code:window.OMG_SUPABASE.businessCode,p_property_code:window.OMG_SUPABASE.propertyCode}:{p_owner_id:accountSelect.value,p_pin:document.getElementById("pin").value,p_business_code:window.OMG_SUPABASE.businessCode,p_property_code:window.OMG_SUPABASE.propertyCode};const{data,error}=await window.omgSupabase.rpc(role==="staff"?"start_work_session":"start_admin_session",args);if(error||!data?.ok)throw new Error(data?.message||"로그인하지 못했습니다.");window.omgSession.set(window.omgSession.fromResponse(data,data.access_token));location.replace("app.html");}catch(error){message.textContent=error.message||"로그인하지 못했습니다.";}finally{document.getElementById("pin").value="";button.disabled=false;button.textContent="로그인";}});
ready().catch(error=>{message.textContent=error.message;});
</script></body></html>
