let session=null,config=null,isOwner=false,missions=[],completionTarget=null,completionPhoto="",descriptionPhoto="",selectedPropertyIds=null;const sectionsNode=document.getElementById("sections"),message=document.getElementById("message");let workerFilterControl=null,targetPickerControl=null,targetPickerItems=[];const sectionInfo=[{key:"overdue",label:"지연된 할일"},{key:"today",label:"오늘"},{key:"this_week",label:"일주일"},{key:"anytime",label:"예정"},{key:"completed",label:"완료"}];const expanded={};

s");if(!completions.length)list.innerHTML='<div class="empty">표시할 완료 내역이 없습니다.</div>';else completions.forEach(entry=>{const node=document.createElement("article");node.className="completion-item";node.innerHTML=`<strong>${esc(entry.employee_name||"근무자")}</strong><span class="meta">${fmt(entry.completed_at)}</span><p>${esc(entry.note||"완료 메모 없음")}</p>${entry.photo?`<img src="${esc(entry.photo)}" alt="완료 사진">`:""}`;list.append(node);});showOverlay("detailOverlay");}
function canComplete(item){return !isOwner&&(!item.target_employee_ids?.length||item.target_employee_ids.includes(session.employeeId));}
function missionCard(item){const complete=isComplete(item),overdue=sectionKey(item)==="overdue",targets=item.target_names?.length?item.target_names.join(", "):"전체 직원",names=complete?completerNames(item):targets;const article=document.createElement("article");article.className=`mission${overdue?" overdue":""}${complete?" completed":""}`;article.tabIndex=0;article.setAttribute("role","button");article.setAttribute("aria-label",`${item.title} 상세 보기`);article.innerHTML=`<div class="mission-row"><div class="mission-title">${item.priority!=="normal"?'<span class="star" aria-label="중요">★</span>':""}<h3>${esc(item.title)}</h3></div>${complete?"":`<span class="mission-progress" aria-label="완료 ${Number(item.completed_count)||0}/${Number(item.target_count)||0}">${Number(item.completed_count)||0}/${Number(item.target_count)||0}</span>`}<span class="mission-chip target" title="${esc(names)}">${esc(names)}</span></div>${complete?"":`<div class="mission-preview-row"><p>${esc((item.description||"상세 업무 없음").split(/\n/)[0])}</p><span class="mission-due">${item.due_at?`마감 ${esc(fmtDueDate(item.due_at))}`:"마감일 없음"}</span></div>`}`;article.onclick=()=>openDetails(item);article.onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openDetails(item);}};return article;}
function filteredMissions(){const employeeId=selectedWorkerId();if(!employeeId)return missions;return missions.filter(item=>!item.target_employee_ids?.length||item.target_employee_ids.includes(employeeId));}
function render(){sectionsNode.replaceChildren();const groups=Object.fromEntries(sectionInfo.map(section=>[section.key,[]]));filteredMissions().forEach(item=>groups[sectionKey(item)].push(item));groups.anytime.sort(compareDeadlines);document.getElementById("sumOverdue").textContent=groups.overdue.length;document.getElementById("sumToday").textContent=groups.today.length;document.getElementById("sumWeek").textContent=groups.this_week.length;document.getElementById("sumAny").textContent=groups.anytime.length;document.getElementById("sumDone").textContent=groups.completed.length;sectionInfo.forEach(info=>{const wrap=document.createElement("section");wrap.className="section";wrap.id=`section-${info.key}`;const items=groups[info.key],limit=expanded[info.key]?items.length:2;wrap.innerHTML=`<div class="section-head"><h2>${info.label}<span class="count">${items.length}</span></h2>${items.length>2?`<button class="toggle" type="button">${expanded[info.key]?"접기":"모두 보기"}</button>`:""}</div>`;if(!items.length){wrap.insertAdjacentHTML("beforeend",`<div class="empty">${({overdue:"지연된 할 일이",today:"오늘 할 일이",this_week:"일주일 안에 마감할 일이",anytime:"예정된 할 일이",completed:"완료된 할 일이"})[info.key]} 없습니다.</div>`);}else items.slice(0,limit).forEach(item=>wrap.append(missionCard(item)));if(items.length>2){const button=wrap.querySelector(".toggle");button.onclick=()=>{expanded[info.key]=!expanded[info.key];render();document.getElementById(`section-${info.key}`).scrollIntoView({behavior:"smooth",block:"start"});};}sectionsNode.append(wrap);});}
function fillWorkerFilter(employees){const selected=workerFilterControl?.value()??(session.employeeId||""),many=new Set((employees||[]).map(x=>x.property_id).filter(Boolean)).size>1,items=[{value:"",label:"All",meta:"전체 근무자"},...(employees||[]).map(employee=>({value:employee.employee_id,label:many&&employee.property_name?`${employee.display_name} · ${employee.property_name}`:employee.display_name,meta:employee.property_name||""}))];if(workerFilterControl)workerFilterControl.setItems(items,selected);else workerFilterControl=window.omgPropertySelector.mountSingle({items,host:document.getElementById("workerFilterHost"),value:selected,placeholder:"근무자선택",title:"근무자",onChange:render});}
function mountTargetPicker(employees){const target=document.getElementById("target"),selected=isOwner?"":session.employeeId;targetPickerItems=isOwner?[{value:"",label:"전체 직원",meta:"모든 근무자"},...(employees||[]).map(employee=>({value:employee.employee_id,label:employee.display_name,meta:employee.property_name||""}))]:[{value:session.employeeId,label:session.employeeName,meta:config.property.name||""}];target.replaceChildren(...targetPickerItems.map(item=>new Option(item.label,item.value)));target.value=selected;targetPickerControl=window.omgPropertySelector.mountSingle({items:targetPickerItems,host:document.getElementById("targetPickerHost"),value:selected,placeholder:"전체 직원",title:"담당 근무자",onChange:value=>{target.value=value;}});}
function setTargetValue(value){const selected=String(value??"");document.getElementById("target").value=selected;targetPickerControl?.setItems(targetPickerItems,selected);}
async function loadMissions(){message.textContent="";const data=isOwner?await rpc("list_shared_missions",{p_access_token:session.accessToken,p_property_ids:selectedPropertyIds}):await rpc("list_missions",{p_access_token:session.accessToken});missions=data.missions||[];fillWorkerFilter(data.employees||config.employees||[]);render();}
function closeOverlay(id){document.getElementById(id).hidden=true;document.body.style.overflow="";}function showOverlay(id){document.getElementById(id).hidden=false;document.body.style.overflow="hidden";}
function setPriorityStar(selected){const priority=document.getElementById("priority"),button=document.getElementById("priorityStar"),star=button.querySelector(".star-toggle");priority.value=selected?"important":"normal";star.textContent=selected?"★":"☆";button.setAttribute("aria-pressed",String(selected));star.style.color=selected?"#f5a623":"#aab4c1";}
function openEditor(item=null){document.getElementById("missionForm").reset();document.getElementById("missionId").value=item?.id||"";document.getElementById("editorHeading").textContent=item?"To do 수정":"New To do";document.getElementById("missionTitle").value=item?.title||"";document.getElementById("description").value=item?.description||"";descriptionPhoto=item?.description_photo||"";const missionPreview=document.getElementById("descriptionPhotoPreview"),timing=document.getElementById("timing"),dueAt=document.getElementById("dueAt");missionPreview.src=descriptionPhoto;missionPreview.hidden=!descriptionPhoto;timing.value=item?.due_at?(dateSection(item.due_at)==="overdue"?item.timing:dateSection(item.due_at)):item?.timing||"today";document.getElementById("creatorDisplay").value=item?.creator_name||(isOwner?"관리자":session.employeeName);setPriorityStar(Boolean(item&&item.priority!=="normal"));setTargetValue(isOwner&&item?.target_employee_ids?.length===1?item.target_employee_ids[0]:isOwner?"":session.employeeId);dueAt.value=toLocalDate(item?.due_at)||dueDateForTiming(timing.value);document.getElementById("photoRequired").checked=Boolean(item?.photo_required);document.getElementById("editorMessage").textContent="";showOverlay("editorOverlay");}
function openComplete(item){completionTarget=item;completionPhoto="";document.getElementById("completeForm").reset();document.getElementById("completeHeading").textContent=item.title;document.getElementById("photoBox").hidden=!item.photo_required;document.getElementById("photoMark").textContent=item.photo_required?"(필수)":"";document.getElementById("photoPreview").style.display="none";document.getElementById("completeMessage").textContent="";showOverlay("completeOverlay");}
document.getElementById("timing").addEventListener("change",event=>{document.getElementById("dueAt").value=dueDateForTiming(event.target.value);});
document.getElementById("dueAt").addEventListener("change",event=>{if(!event.target.value)return;const today=new Date(`${dateAfterDays(0)}T00:00:00`),due=new Date(`${event.target.value}T00:00:00`),days=Math.round((due-today)/86400000),timing=document.getElementById("timing");if(days===0)timing.value="today";else if(days>0&&days<=7)timing.value="this_week";else if(days>7)timing.value="anytime";});
document.querySelectorAll("[data-close]").forEach(button=>button.onclick=()=>closeOverlay(button.dataset.close));document.querySelectorAll(".overlay").forEach(overlay=>overlay.addEventListener("click",event=>{if(event.target===overlay)closeOverlay(overlay.id);}));document.querySelectorAll("[data-jump]").forEach(button=>button.onclick=()=>document.getElementById(`section-${button.dataset.jump}`).scrollIntoView({behavior:"smooth"}));document.getElementById("newMission").onclick=()=>openEditor();document.getElementById("priorityStar").onclick=()=>setPriorityStar(document.getElementById("priority").value==="normal");document.getElementById("descriptionCamera").onclick=()=>document.getElementById("descriptionPhotoInput").click();document.getElementById("descriptionPhotoInput").addEventListener("change",async event=>{if(!event.target.files[0])return;try{descriptionPhoto=await fileToData(event.target.files[0]);const preview=document.getElementById("descriptionPhotoPreview");preview.src=descriptionPhoto;preview.hidden=false;}catch{document.getElementById("editorMessage").textContent="사진을 읽지 못했습니다.";}event.target.value="";});
document.getElementById("missionForm").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveMission"),notice=document.getElementById("editorMessage"),target=isOwner?document.getElementById("target").value:session.employeeId,dueDate=document.getElementById("dueAt").value;button.disabled=true;notice.textContent="";try{await rpc("save_mission",{p_access_token:session.accessToken,p_mission:{id:document.getElementById("missionId").value||null,title:document.getElementById("missionTitle").value.trim(),description:document.getElementById("description").value.trim(),description_photo:descriptionPhoto,timing:document.getElementById("timing").value,priority:document.getElementById("priority").value,target_employee_ids:target?[target]:[],photo_required:document.getElementById("photoRequired").checked,due_at:dueDate?new Date(`${dueDate}T23:59:59`).toISOString():null}});closeOverlay("editorOverlay");await loadMissions();}catch(error){notice.textContent=error.message;}finally{button.disabled=false;}});
document.getElementById("completePhoto").addEventListener("change",async event=>{if(!event.target.files[0])return;try{completionPhoto=await fileToData(event.target.files[0]);const preview=document.getElementById("photoPreview");preview.src=completionPhoto;preview.style.display="block";}catch{document.getElementById("completeMessage").textContent="사진을 읽지 못했습니다.";}});
document.getElementById("completeForm").addEventListener("submit",async event=>{event.preventDefault();const note=document.getElementById("completeNote").value.trim(),button=document.getElementById("submitComplete"),notice=document.getElementById("completeMessage");if(!note){notice.textContent="내 작업내용을 입력해주세요.";return;}if(completionTarget.photo_required&&!completionPhoto){notice.textContent="완료 사진을 올려주세요.";return;}button.disabled=true;notice.textContent="";try{await rpc("complete_mission",{p_access_token:session.accessToken,p_mission_id:completionTarget.id,p_note:note,p_photo_data_url:completionPhoto});closeOverlay("completeOverlay");const popup=document.getElementById("celebrate");popup.hidden=false;setTimeout(()=>{popup.hidden=true;loadMissions().catch(error=>message.textContent=error.message);},2000);}catch(error){notice.textContent=error.message;button.disabled=false;}});
let renderedDay=dateAfterDays(0);setInterval(()=>{const day=dateAfterDays(0);if(day!==renderedDay){renderedDay=day;render();}},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)render();});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);isOwner=session.sessionKind==="owner"&&config.can_manage;document.getElementById("title").textContent=isOwner?"To do list":"To do";document.getElementById("intro").textContent=isOwner?`${config.property.name} 업무를 만들고 완료 현황을 관리합니다.`:`${config.property.name} · 오늘의 업무와 전달사항`;document.getElementById("celebrateDog").src=window.OMG_HAPPY_SHIBA||"shiba-worker-logo-v2.png";document.getElementById("newMission").hidden=false;mountTargetPicker(config.employees||[]);if(isOwner){const control=await window.omgPropertySelector.mount({accessToken:session.accessToken,permission:"missions",host:document.getElementById("missionPropertyPicker"),allLabel:"지점선택",onChange:async ids=>{selectedPropertyIds=ids;await loadMissions();}});selectedPropertyIds=control.selectedIds();}await loadMissions();window.omgTransition.ready();})().catch(error=>{message.textContent=error.message;window.omgTransition.ready();});
</script></body></html>
