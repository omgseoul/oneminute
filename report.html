<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>업무 보고</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.container{width:min(100%,560px);margin:auto;padding:20px 16px calc(34px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#718198;text-decoration:none;font-size:13px}.property{color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.06em}.hero{padding:22px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:0 8px 26px rgba(42,78,120,.07)}.hero h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-.045em}.hero p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.clock{margin-top:13px;color:var(--blue);font-size:12px;font-weight:800}.fixed-notice{margin-top:14px;padding:15px;border-radius:16px;background:#fff8df;color:#66530e;font-size:12px;line-height:1.65}.fields{display:grid;gap:14px;margin-top:16px}.field-card{padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff}.field-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.field-head h2{margin:0;color:var(--navy);font-size:18px;letter-spacing:-.025em}.count{min-width:54px;color:var(--blue);font-size:12px;font-weight:900;text-align:right}.help{margin:6px 0 14px;color:var(--muted);font-size:11px}.rooms{display:flex;flex-wrap:wrap;gap:8px}.room input{position:absolute;opacity:0}.room label{display:block;min-width:58px;padding:11px 12px;border:1px solid #cbd8e8;border-radius:12px;background:#fff;color:#56667c;font-size:14px;font-weight:800;text-align:center;cursor:pointer}.room input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy);box-shadow:0 0 0 2px rgba(36,103,189,.08)}.empty{padding:15px;border-radius:13px;background:#f6f8fb;color:#7d8999;font-size:12px}.memo-card{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff}.memo-card label{display:block;margin-bottom:9px;color:var(--navy);font-size:16px;font-weight:900}.memo-card textarea{width:100%;min-height:100px;padding:13px;border:1px solid #cbd8e8;border-radius:13px;font:14px/1.5 inherit;resize:vertical}.submit{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.submit:disabled{opacity:.55}.message{min-height:20px;margin-top:11px;color:#c33;font-size:12px;text-align:center}#donePage{display:none;text-align:center;padding-top:90px}.done-card{padding:34px 22px;border:1px solid var(--line);border-radius:24px;background:#fff}.done-card .check{font-size:48px}.done-card h1{color:var(--navy)}.done-card p{color:var(--muted);line-height:1.6}.done-card a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}
</style></head><body>
<main id="formPage" class="container">
  <div class="top"><a class="back" href="index.html">‹ 출퇴근 보고</a><span id="propertyName" class="property">불러오는 중...</span></div>
  <section class="hero"><h1 id="reportTitle">업무 보고</h1><p id="reportIntro">직원별로 설정된 항목을 확인해주세요.</p><div id="clockInTime" class="clock"></div></section>
  <aside id="clockInNotice" class="fixed-notice" hidden>출근 즉시 워치를 착용하고 게하폰과 5m 이내에 두세요. 게스트 짐을 직접 들어 문 앞까지 동행하고 도어락과 카드키 사용법을 설명해주세요.</aside>
  <form id="reportForm">
    <div id="fields" class="fields"></div>
    <section class="memo-card"><label for="memo">특이사항</label><textarea id="memo" placeholder="추가로 보고할 내용이 있으면 입력해주세요."></textarea></section>
    <button id="submitButton" class="submit" type="submit">보고 제출</button>
    <div id="formMessage" class="message" role="alert"></div>
  </form>
</main>
<main id="donePage" class="container"><section class="done-card"><div class="check">✓</div><h1 id="doneTitle">보고 완료</h1><p id="doneText">보고가 저장되고 전달되었습니다.</p><a id="doneLink" href="app.html">메인으로</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script src="report-session.js"></script>
<script>
const reportType = new URLSearchParams(location.search).get("type");
const isClockIn = reportType === "clock_in";
const title = isClockIn ? "출근보고" : "퇴근보고";
const form = document.getElementById("reportForm");
const fieldContainer = document.getElementById("fields");
const message = document.getElementById("formMessage");
let pageConfig = null;

function selectedRooms(key){return [...document.querySelectorAll(`input[name="${key}"]:checked`)].map(input=>input.value);}
function updateCount(key){const node=document.querySelector(`[data-count="${key}"]`);if(node)node.textContent=`${selectedRooms(key).length}개 선택`;}
function createField(field, rooms){
  const section=document.createElement("section");section.className="field-card";
  const head=document.createElement("div");head.className="field-head";
  const heading=document.createElement("h2");heading.textContent=field.label;
  const count=document.createElement("span");count.className="count";count.dataset.count=field.key;count.textContent="0개 선택";
  head.append(heading,count);section.append(head);
  const help=document.createElement("p");help.className="help";help.textContent=field.help;section.append(help);
  if(!rooms.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Property 설정에서 객실을 먼저 등록해주세요.";section.append(empty);return section;}
  const list=document.createElement("div");list.className="rooms";
  rooms.forEach((room,index)=>{const wrap=document.createElement("span");wrap.className="room";const input=document.createElement("input");input.type="checkbox";input.name=field.key;input.value=room;input.id=`${field.key}-${index}`;input.addEventListener("change",()=>updateCount(field.key));const label=document.createElement("label");label.htmlFor=input.id;label.textContent=room;wrap.append(input,label);list.append(wrap);});
  section.append(list);return section;
}
function buildPayload(session, config){
  const fields=window.omgWorkConfig.fieldGroups[reportType];
  const enabled=new Set(config.report_config[reportType]);
  const submittedAt=new Date();
  const payload={report_type:title,shift:"근무",property_name:config.property.name,submitted_at:submittedAt.toISOString(),submitted_at_text:submittedAt.toLocaleString("ko-KR"),worker:session.employeeName,memo:document.getElementById("memo").value.trim()||"없음"};
  const lines=[`[${title}]`,`숙소: ${config.property.name}`,`근로자: ${session.employeeName}`,isClockIn?`출근시각: ${window.omgReport.clockInText()}`:`제출시각: ${submittedAt.toLocaleString("ko-KR")}`,""];
  fields.filter(field=>enabled.has(field.key)).forEach(field=>{const rooms=selectedRooms(field.key);payload[`${field.key}_array`]=rooms;payload[`${field.key}_count`]=rooms.length;payload[field.key]=rooms.join(", ")||"없음";lines.push(`${field.label}: ${rooms.length}개`,rooms.join(", ")||"없음","");});
  lines.push(`특이사항: ${payload.memo}`);payload.text=lines.join("\n");return payload;
}
(async()=>{
  if(!["clock_in","clock_out"].includes(reportType)){location.replace("index.html");return;}
  const session=await window.omgReport.ready;if(!session)return;
  pageConfig=await window.omgWorkConfig.load(session.accessToken);
  const enabled=new Set(pageConfig.report_config[reportType]);
  document.getElementById("propertyName").textContent=pageConfig.property.name;
  document.getElementById("reportTitle").textContent=title;document.title=`${pageConfig.property.name} ${title}`;
  document.getElementById("reportIntro").textContent=isClockIn?"오늘 업무 계획을 선택해주세요.":"완료한 객실을 선택해주세요.";
  document.getElementById("clockInTime").textContent=isClockIn?`출근 기록 ${window.omgReport.clockInText()}`:"";
  document.getElementById("clockInNotice").hidden=!isClockIn;
  document.getElementById("submitButton").textContent=isClockIn?"출근보고 제출":"퇴근보고 제출";
  document.getElementById("doneTitle").textContent=`${title} 완료`;
  if(!isClockIn){document.getElementById("doneText").textContent="퇴근시간이 기록되고 보고가 전달되었습니다.";document.getElementById("doneLink").href="login.html";document.getElementById("doneLink").textContent="확인";}
  const fields=window.omgWorkConfig.fieldGroups[reportType].filter(field=>enabled.has(field.key));
  if(fields.length)fields.forEach(field=>fieldContainer.append(createField(field,pageConfig.property.rooms||[])));
  else{const empty=document.createElement("div");empty.className="empty";empty.textContent="사장이 설정한 선택 항목이 없습니다. 특이사항만 작성할 수 있습니다.";fieldContainer.append(empty);}
})().catch(error=>{message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";const button=document.getElementById("submitButton");button.disabled=true;try{const session=await window.omgReport.ready;if(!session||!pageConfig)throw new Error("설정을 불러오는 중입니다. 잠시 후 다시 눌러주세요.");await window.omgReport.submit(buildPayload(session,pageConfig));}catch(error){message.textContent=error.message||"보고를 제출하지 못했습니다.";button.disabled=false;}});
</script></body></html>
