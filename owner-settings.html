<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Property 설정</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,680px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-.045em}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.help{margin:0 0 15px;color:var(--muted);font-size:11px;line-height:1.55}label.title{display:block;margin:15px 0 7px;color:var(--navy);font-size:13px;font-weight:900}input[type=text],textarea{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font:15px/1.5 inherit}textarea{min-height:150px;resize:vertical}.employee{margin-top:13px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbfcfe}.employee-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.employee-name{color:var(--navy);font-size:16px;font-weight:900}.role{padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:900}.group-title{margin:16px 0 8px;color:#586b84;font-size:12px;font-weight:900}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{position:relative}.check input{position:absolute;opacity:0}.check label{display:flex;align-items:center;min-height:45px;padding:10px 11px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:#607087;font-size:12px;font-weight:800;cursor:pointer}.check input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy)}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:430px){.checks{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>Property 설정</h1><p>숙소명과 객실을 등록하고, 각 근무자의 출근·퇴근 보고 항목을 선택합니다.</p></header>
<form id="settingsForm" inert>
  <section class="card"><h2>숙소 기본정보</h2><p class="help">숙소명은 직원 메인화면의 제목으로 표시됩니다.</p><label class="title" for="propertyName">숙소명</label><input id="propertyName" type="text" maxlength="80" required><label class="title" for="rooms">객실명</label><textarea id="rooms" placeholder="객실명을 한 줄에 하나씩 입력하세요.&#10;예:&#10;101&#10;102&#10;103" required></textarea><p id="roomCount" class="help">총 0개 객실</p></section>
  <section class="card"><h2>근무자별 보고 항목</h2><p class="help">체크한 항목만 해당 근무자의 보고 화면에 나타납니다.</p><div id="employees"></div></section>
  <button id="saveButton" class="save" type="submit">설정 저장</button><div id="message" class="message" role="alert"></div>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("settingsForm");const employeesNode=document.getElementById("employees");const message=document.getElementById("message");let session=null;let config=null;
function parseRooms(){return [...new Set(document.getElementById("rooms").value.split(/[\n,]+/).map(room=>room.trim()).filter(Boolean))];}
function updateRoomCount(){document.getElementById("roomCount").textContent=`총 ${parseRooms().length}개 객실`;}
function roleName(role){return role==="owner"?"사장":role==="manager"?"매니저":"직원";}
function renderEmployee(employee){
  const box=document.createElement("section");box.className="employee";box.dataset.employeeId=employee.employee_id;
  const head=document.createElement("div");head.className="employee-head";head.innerHTML=`<span class="employee-name"></span><span class="role"></span>`;head.querySelector(".employee-name").textContent=employee.display_name;head.querySelector(".role").textContent=roleName(employee.role);box.append(head);
  for(const type of ["clock_in","clock_out"]){const title=document.createElement("div");title.className="group-title";title.textContent=type==="clock_in"?"출근보고":"퇴근보고";box.append(title);const checks=document.createElement("div");checks.className="checks";const selected=new Set(employee.report_config[type]);window.omgWorkConfig.fieldGroups[type].forEach(field=>{const id=`${employee.employee_id}-${type}-${field.key}`;const wrap=document.createElement("span");wrap.className="check";const input=document.createElement("input");input.type="checkbox";input.id=id;input.dataset.type=type;input.value=field.key;input.checked=selected.has(field.key);const label=document.createElement("label");label.htmlFor=id;label.textContent=field.label;wrap.append(input,label);checks.append(wrap);});box.append(checks);}
  employeesNode.append(box);
}
function collectEmployeeConfigs(){const result={};document.querySelectorAll(".employee").forEach(box=>{result[box.dataset.employeeId]={clock_in:[...box.querySelectorAll('input[data-type="clock_in"]:checked')].map(input=>input.value),clock_out:[...box.querySelectorAll('input[data-type="clock_out"]:checked')].map(input=>input.value)};});return result;}
document.getElementById("rooms").addEventListener("input",updateRoomCount);
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!config.can_manage){location.replace("app.html");return;}document.getElementById("propertyName").value=config.property.name;document.getElementById("rooms").value=(config.property.rooms||[]).join("\n");updateRoomCount();config.employees.forEach(renderEmployee);form.inert=false;})().catch(error=>{message.className="message error";message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";const button=document.getElementById("saveButton");button.disabled=true;button.textContent="저장 중...";try{const rooms=parseRooms();if(!rooms.length)throw new Error("객실명을 한 개 이상 입력해주세요.");const saved=await window.omgWorkConfig.save(session.accessToken,document.getElementById("propertyName").value.trim(),rooms,collectEmployeeConfigs());config=saved;message.className="message ok";message.textContent="설정이 저장되었습니다. 직원 화면에 바로 반영됩니다.";}catch(error){message.className="message error";message.textContent=error.message||"설정을 저장하지 못했습니다.";}finally{button.disabled=false;button.textContent="설정 저장";}});
</script></body></html>
