<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>출퇴근 보고</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,520px);min-height:100vh;margin:0 auto;padding:22px 16px calc(30px + env(safe-area-inset-bottom))}.head{margin:7px 2px 23px}.back{display:inline-flex;align-items:center;margin-bottom:18px;color:#718198;text-decoration:none;font-size:13px}.head h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-.045em}.property{display:block;margin-top:7px;color:var(--muted);font-size:13px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu-card{position:relative;height:136px;padding:18px 78px 15px 16px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 6px 20px rgba(42,78,120,.06);display:flex;flex-direction:column;justify-content:center;transition:.14s}.menu-card:active{transform:scale(.975);border-color:#8eb4e8}.menu-card b{position:relative;z-index:2;display:block;color:var(--navy);font-size:20px;line-height:1.18;letter-spacing:-.035em}.menu-card span{position:relative;z-index:2;display:block;margin-top:7px;color:var(--muted);font-size:11px;font-weight:700}.shiba-face{position:absolute;z-index:1;right:7px;top:50%;width:68px;height:68px;object-fit:contain;transform:translateY(-50%)}.notice{margin-top:18px;padding:14px 15px;border:1px solid #d9e7f8;border-radius:16px;background:#f0f6fd;color:#607895;font-size:11px;line-height:1.5}
</style></head><body><main class="shell">
<header class="head"><a class="back" href="app.html">‹ 메인으로</a><h1>출퇴근 보고</h1><span id="propertyName" class="property">불러오는 중...</span></header>
<nav id="reportMenu" class="menu" inert>
<a class="menu-card" href="report.html?type=clock_in"><b>출근<br>보고</b><span>근무 시작 보고</span><img class="shiba-face" src="shiba-face-morning-in.png" alt="밝은 표정의 시바견"></a>
<a class="menu-card" href="report.html?type=clock_out"><b>퇴근<br>보고</b><span>업무 마감 보고</span><img class="shiba-face" src="shiba-face-morning-out.png" alt="피곤한 시바견"></a>
</nav>
<aside id="notice" class="notice">직원별로 설정된 항목만 보고 화면에 표시됩니다.</aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
(async () => {
  const session = await window.omgSession.require({ allowCompleted: true });
  if (!session) return;
  if (session.sessionKind !== "staff") { location.replace("app.html"); return; }
  const config = await window.omgWorkConfig.load(session.accessToken);
  document.getElementById("propertyName").textContent = config.property.name;
  document.title = `${config.property.name} 출퇴근 보고`;
  if (session.status === "completed") document.getElementById("notice").textContent = "오늘 근무는 종료됐습니다. 저장된 보고의 전달 상태를 확인할 수 있습니다.";
  document.getElementById("reportMenu").inert = false;
})().catch(error => { document.getElementById("notice").textContent = error.message; });
</script></body></html>
