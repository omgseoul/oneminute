async function loadWorkingEmployees(accessToken,propertyIds){const section=document.getElementById("workingSection"),grid=document.getElementById("workingGrid");const{data,error}=await window.omgSupabase.rpc("list_working_employees",{p_access_token:accessToken,p_property_ids:propertyIds});if(error||!data?.ok){grid.innerHTML='<span class="working-empty">근무중인 직원을 불러오지 못했습니다.</span>';return;}const employees=data.employees||[],many=new Set(employees.map(x=>x.property_id)).size>1;grid.innerHTML=employees.length?employees.map(item=>`<a class="working-person" href="messages.html?compose=1&recipient_employee_id=${encodeURIComponent(item.employee_id)}" title="${escapeWorking(item.display_name)} · ${escapeWorking(item.property_name)}"><i class="online-dot"></i>${escapeWorking(many?`${item.display_name} · ${item.property_name}`:item.display_name)}</a>`).join(""):'<span class="working-empty">현재 근무중인 직원이 없습니다.</span>';section.style.display="block";}
function showMessageArrival(item){const popup=document.getElementById("messageArrival"),dog=document.getElementById("messageArrivalDog");dog.src=MESSAGE_DOG_DATA;document.getElementById("messageArrivalSender").textContent=item?.sender_label?`${item.sender_label}님이 보냈습니다.`:"새 메세지";document.getElementById("messageArrivalBody").textContent=String(item?.message||"메세지 메뉴에서 확인해주세요.").replace(/\\n/g,"\n");popup.hidden=false;clearTimeout(messagePopupTimer);messagePopupTimer=setTimeout(()=>popup.hidden=true,4200);try{navigator.vibrate?.([180,90,220]);const AudioContext=window.AudioContext||window.webkitAudioContext,ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.setValueAtTime(660,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(990,ctx.currentTime+.18);gain.gain.setValueAtTime(.14,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);osc.start();osc.stop(ctx.currentTime+.5);}catch(_){}}
async function loadMessageSummary(accessToken,announce=false){const{data}=await window.omgSupabase.rpc("list_property_messages",{p_access_token:accessToken});if(!data?.ok)return;const count=Number(data.unread_count)||0,counter=document.getElementById("messageCounter");counter.textContent=count>99?"99+":String(count);counter.style.display=count?"grid":"none";if(announce&&lastUnreadCount!=null&&count>lastUnreadCount){const newest=(data.messages||[]).find(item=>!item.is_sender&&!item.read_at);showMessageArrival(newest);}lastUnreadCount=count;}
async function loadMissionSummary(session,isOwner){let data=null;if(isOwner){const{data:shareData}=await window.omgSupabase.rpc("list_property_shares",{p_access_token:session.accessToken});const propertyIds=(shareData?.properties||[]).filter(item=>item.is_own||(item.permissions||[]).includes("missions")).map(item=>item.property_id);const result=await window.omgSupabase.rpc("list_shared_missions",{p_access_token:session.accessToken,p_property_ids:propertyIds.length?propertyIds:null});data=result.data;}else{const result=await window.omgSupabase.rpc("list_missions",{p_access_token:session.accessToken});data=result.data;}if(!data?.ok)return;const todayCount=(data.missions||[]).filter(item=>item.timing==="today"&&(isOwner?(Number(item.target_count)||0)>(Number(item.completed_count)||0):(!item.target_employee_ids?.length||item.target_employee_ids.includes(session.employeeId))&&!(item.completion_employee_ids||[]).includes(session.employeeId))).length;document.getElementById("todayMissionCount").textContent=String(todayCount);}
(async () => {
  const session = await window.omgSession.require({ allowCompleted: true });
  if (!session) return;
  const config = await window.omgWorkConfig.load(session.accessToken);
  const isOwner = session.sessionKind === "owner" && config.can_manage;
  const state = isOwner ? "관리 모드" : session.status === "completed" ? "근무 종료 · 보고 전송 확인" : "근무 중";
  document.getElementById("workerStatus").textContent = `${session.employeeName} · ${state}`;
  const propertyTitle = document.getElementById("propertyTitle");
  propertyTitle.textContent = config.property.name;
  propertyTitle.classList.remove("loading");
  propertyTitle.removeAttribute("aria-busy");
  document.title = `${config.property.name} · 게하관리`;
  document.getElementById("reportMenu").style.display = isOwner ? "none" : "";
  document.getElementById("ownerSettingsMenu").style.display = isOwner ? "grid" : "none";
  document.getElementById("settings").style.display = isOwner ? "flex" : "none";document.getElementById("accountManagement").style.display = isOwner ? "flex" : "none";document.getElementById("attendanceManagement").style.display = isOwner ? "flex" : "none";document.getElementById("staffWorkStatus").style.display = isOwner ? "none" : "flex";
  document.getElementById("emergency").style.display = isOwner ? "none" : "";
  document.getElementById("missionCopy").textContent = isOwner ? "미션 등록·진행 확인" : "오늘의 업무와 전달사항 확인";
  const pushPropertyId = config.property.management_number;
  if (window.OMGNative?.registerPush && pushPropertyId != null) {
    window.OMGNative.registerPush(String(pushPropertyId), isOwner ? "owner" : "staff");
  }
  const memberId=isOwner?session.ownerId:session.employeeId;
  if(window.OMGNative?.registerMemberPush&&pushPropertyId!=null&&memberId){window.OMGNative.registerMemberPush(String(pushPropertyId),isOwner?"owner":"staff",String(memberId));}
  if(isOwner){const foot=document.querySelector(".foot");foot.insertAdjacentHTML("beforebegin",'<section id="workingSection" class="working-section"><div class="working-head"><h2>근무중</h2><div id="workingPropertyPicker"></div></div><div id="workingGrid" class="working-grid"><span class="working-empty">근무중인 직원을 불러오는 중입니다.</span></div></section>');const control=await window.omgPropertySelector.mount({accessToken:session.accessToken,permission:"attendance",host:document.getElementById("workingPropertyPicker"),onChange:ids=>loadWorkingEmployees(session.accessToken,ids)});await loadWorkingEmployees(session.accessToken,control.selectedIds());}
  const platformPromise=isOwner?window.omgSupabase.rpc("is_platform_administrator"):Promise.resolve({data:false});const[, ,{data:isPlatformAdmin}]=await Promise.all([loadMissionSummary(session,isOwner),loadMessageSummary(session.accessToken,false),platformPromise]);document.getElementById("platformAdmin").style.display=isOwner&&isPlatformAdmin?"flex":"none";homeMessageTimer=setInterval(()=>loadMessageSummary(session.accessToken,true).catch(()=>{}),10000);document.getElementById("mainMenu").inert=false;document.getElementById("appShell").classList.add("ready");window.omgTransition.ready();
})().catch(error => { document.getElementById("workerStatus").textContent = error.message;document.getElementById("appShell").classList.add("ready");window.omgTransition.ready(); });
async function logoutWorkApp(){await window.omgSession.logout();location.replace("login.html");}
addEventListener("pagehide",()=>{clearInterval(homeMessageTimer);clearTimeout(messagePopupTimer);});
</script></body></html>
