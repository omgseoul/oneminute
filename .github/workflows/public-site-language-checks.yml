name: Verify public website languages
on:
  pull_request:
    paths: ['index.html', 'feature-*.html', 'feature-details.*', 'site-language.*', 'tests/site-language/**', '.github/workflows/public-site-language-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tests/attendance-nfc
      - run: tests/attendance-nfc/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify language switching, content and responsive layouts
        env: {NODE_PATH: '${{ github.workspace }}/tests/attendance-nfc/node_modules'}
        run: |
          node --check site-language.js
          node tests/site-language/content.cjs
          node tests/site-language/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMS-public-site-language-preview
          path: /tmp/oms-site-*.png
