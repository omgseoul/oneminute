<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR 설정 (게스트용)</title><link rel="stylesheet" href="guest-support.css"><link rel="stylesheet" href="guest-qr-settings.css"></head><body><main><div class="top"><a class="back" href="owner-settings.html">‹ Property 설정</a><a class="btn subtle" href="messages.html?tab=guest">채팅방</a></div><div class="eyebrow">PROPERTY · GUEST SUPPORT</div><h1>QR 설정 (게스트용)</h1><p class="help">현장 QR을 통한 숙소 사용법 안내,<br>게스트 채팅 연결</p><div id="status" class="status" role="status">설정을 불러오는 중입니다.</div><form id="settings" hidden><section class="card"><div class="qr-enable-row"><h2>게스트 QR 기능 활성화</h2><label class="qr-switch"><input id="enabled" type="checkbox" role="switch" aria-label="게스트 QR 기능 활성화"><span class="switch-track"></span><span id="enabledLabel">비활성화</span></label></div><p class="help qr-description">현장에 도착한 고객이 QR 찍어서 바로 안내를 받을수있는 기능입니다. 별도의 어플설치없이 게스트와의 대화도 가능합니다.</p><section class="item-editor default-item"><div class="row between"><b class="item-number">기본 항목</b><label class="check"><input id="chatEnabled" type="checkbox">사용</label></div><div class="default-item-title"><span id="chatIcon"></span><b>직원과의 채팅</b></div><p class="help">게스트가 직원과 메시지와 사진을 주고받을 수 있습니다.</p></section><div id="items"></div><button class="btn wide" id="add" type="button">＋ 안내 항목 추가 <span id="itemCount" class="muted small"></span></button><button id="save" class="btn primary wide" style="margin-top:20px" type="submit">안내 설정 저장</button></section><section class="card"><h2>게스트 접속 QR</h2><p class="help">설정을 변경해도 주소와 QR은 그대로 유지됩니다.</p><div id="qr" class="qr"></div><input id="url" class="input small" readonly aria-label="게스트 안내 주소"><div class="row" style="margin-top:12px;flex-wrap:wrap"><button type="button" id="copy" class="btn grow">주소 복사</button><button type="button" id="download" class="btn grow">QR 저장</button><a id="preview" class="btn grow" target="_blank" rel="noopener">미리보기</a></div></section></form></main><dialog id="iconPicker"><div class="top"><h2>이모지 선택</h2><button id="closeIcons" type="button" class="icon-btn" aria-label="닫기">×</button></div><button id="noIcon" type="button" class="btn wide">이모지 없음</button><div id="iconOptions" class="icon-options"></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="photo-codec.js?v=20261001"></script><script src="guest-support-client.js?v=20261001-ui"></script><script src="vendor/qrcode.js"></script><script src="guest-icons.js"></script><script src="guest-support-settings.js"></script></body></html>
