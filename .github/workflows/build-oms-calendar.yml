name: Build OMS Calendar APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/oms-calendar]
    paths:
      - 'oms-calendar-android/**'
      - '.github/workflows/build-oms-calendar.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: oms-calendar-android
        run: gradle assembleDebug
      - name: Verify and prepare APK
        run: |
          APK=oms-calendar-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" OMS-Calendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OMS-Calendar-APK
          path: OMS-Calendar.apk
