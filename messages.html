function syncRecipientDropdowns(){syncRecipientDropdown("localRecipients",localRecipientItems,"받는 사람");syncRecipientDropdown("remoteRecipients",remoteRecipientItems,"타지점");}
function renderRecipientDropdown(rootId,items,emptyLabel){const root=document.getElementById(rootId),disabled=!items.length;root.innerHTML=`<button class="recipient-trigger" type="button" aria-expanded="false" ${disabled?"disabled":""}><span class="recipient-summary">${emptyLabel}</span><b>⌄</b></button><div class="recipient-panel" hidden>${items.length>1?'<label class="recipient-option all"><span>All</span><input data-recipient-all type="checkbox"></label>':""}${items.map(item=>`<label class="recipient-option" data-key="${esc(item.recipient_key)}" data-id="${esc(item.employee_id||"")}" data-name="${esc(item.display_name)}"><span>${esc(item.display_name)}</span><input type="checkbox"></label>`).join("")}</div>`;const trigger=root.querySelector(".recipient-trigger"),panel=root.querySelector(".recipient-panel");trigger.onclick=()=>{const opening=panel.hidden;closeRecipientDropdowns(root);panel.hidden=!opening;trigger.setAttribute("aria-expanded",String(opening));trigger.querySelector("b").textContent=opening?"⌃":"⌄";};const all=root.querySelector("[data-recipient-all]");if(all)all.onchange=event=>{items.forEach(item=>event.target.checked?selected.add(item.recipient_key):selected.delete(item.recipient_key));syncRecipientDropdowns();};root.querySelectorAll(".recipient-option[data-key] input").forEach(input=>input.onchange=()=>{const key=input.closest(".recipient-option").dataset.key;input.checked?selected.add(key):selected.delete(key);syncRecipientDropdowns();});}
function renderRecipients(items){const ownId=String(session?.propertyId||"");localRecipientItems=(items||[]).filter(item=>String(item.property_id||"")===ownId);remoteRecipientItems=(items||[]).filter(item=>String(item.property_id||"")!==ownId);recipientItems=[...localRecipientItems,...remoteRecipientItems];const valid=new Set(recipientItems.map(item=>item.recipient_key));for(const key of selected)if(!valid.has(key))selected.delete(key);renderRecipientDropdown("localRecipients",localRecipientItems,"받는 사람");renderRecipientDropdown("remoteRecipients",remoteRecipientItems,"타지점");syncRecipientDropdowns();}
function isApproval(item){return item.message_type==="attendance_approval"||item.message_type==="property_share_approval";}

function render(data){lastData=data;document.getElementById("unread").textContent=data.unread_count||0;renderRecipients(data.recipients);const announcementButton=document.querySelector('[data-kind="announcement"]');announcementButton.hidden=!data.can_manage;document.querySelector(".type-row").classList.toggle("three",!!data.can_manage);const approvalTab=document.querySelector('[data-mailbox="approvals"]');approvalTab.hidden=!data.can_manage;mailTabs.classList.toggle("three",!!data.can_manage);if(!data.can_manage&&activeMailbox==="approvals")activeMailbox="inbox";const mailboxItems=(data.messages||[]).filter(item=>activeMailbox==="sent"?item.is_sender:activeMailbox==="approvals"?!item.is_sender&&isApproval(item):!item.is_sender&&!isApproval(item)),query=messageSearchQuery.trim().toLocaleLowerCase("ko-KR"),items=query?mailboxItems.filter(item=>{const target=item.is_sender?`받는 사람 ${(item.recipient_labels||[]).join(" ")}`:item.sender_label;return`${target} ${clean(item.message)}`.toLocaleLowerCase("ko-KR").includes(query);}):mailboxItems;if(!items.length){const empty=query?"검색 결과가 없습니다.":{inbox:"받은 메세지가 없습니다.",sent:"보낸 메세지가 없습니다.",approvals:"결재할 메세지가 없습니다."}[activeMailbox];list.innerHTML=`<div class="empty">${empty}</div>`;}else{list.innerHTML=items.map(item=>{const urgent=item.priority==="urgent",announcement=item.message_type==="announcement",approval=isApproval(item),approved=item.approval_status==="approved",unread=!item.is_sender&&!item.read_at,kind=announcement?"announcement":urgent?"urgent":approval?"approval":"general",target=item.is_sender?`받는 사람 · ${(item.recipient_labels||[]).join(", ")}`:item.sender_label,status=approval?`<i class="status-pill ${approved?"done":""}">${approved?"결재완료":"미결재"}</i>`:"";return`<button class="message-card ${unread?"unread-card":""} ${item.is_sender?"sent":""}" data-id="${item.message_id}" type="button"><i class="dot ${unread?"show":""}" aria-hidden="true"></i>${categoryIcon(kind)}<span class="message-copy"><span class="message-mainline"><span class="sender">${esc(target)}</span>${status}</span><span class="preview">${esc(clean(item.message))}</span></span><span class="message-side"><span class="time">${fmt(item.created_at)}</span><span class="chevron" aria-hidden="true">›</span></span></button>`;}).join("");list.querySelectorAll(".message-card").forEach((button,index)=>button.onclick=()=>openDetail(items[index]));}if(requestedMessageId&&!requestedOpened){const requested=(data.messages||[]).find(item=>item.message_id===requestedMessageId);if(requested){requestedOpened=true;openDetail(requested);}}}
async function load(){if(!session)return;try{const data=await rpc("list_property_messages",{p_access_token:session.accessToken});render(data);errorNode.textContent="";}catch(error){errorNode.textContent=error.message;}}
async function pushMessage(messageId){const response=await fetch(PUSH_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:session.accessToken,message_id:messageId})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.message||"메세지 알림을 전송하지 못했습니다.");}
function setComposeOpen(open,focus=false,fromHistory=false){if(open){activateLayerHistory();searchPanel.hidden=true;}else if(!fromHistory&&layerHistoryActive){closeActiveLayer();return;}composeOverlay.hidden=!open;document.body.classList.toggle("modal-open",open||!document.getElementById("detail").hidden);const toggle=document.getElementById("composeToggle");toggle.setAttribute("aria-label",open?"작성 중":"새 메세지");toggle.classList.toggle("active",open);if(!open)closeRecipientDropdowns();if(open&&focus)messageText.focus();}
function openRequestedComposer(){if(!requestedRecipientId)return;const recipient=recipientItems.find(item=>item.employee_id===requestedRecipientId);if(!recipient)return;selected.add(recipient.recipient_key);syncRecipientDropdowns();setComposeOpen(true);history.replaceState(null,"","messages.html");}
function replyTo(item){selected.clear();const recipient=item.sender_type==="owner"?recipientItems.find(node=>(item.sender_owner_id&&node.owner_id===item.sender_owner_id)||node.recipient_key==="owner"):recipientItems.find(node=>(item.sender_employee_id&&node.employee_id===item.sender_employee_id)||node.display_name===item.sender_label);if(!recipient){errorNode.textContent="답장할 사람을 찾지 못했습니다. 새 메세지에서 수신자를 선택해주세요.";document.getElementById("detail").hidden=true;setComposeOpen(true);return;}selected.add(recipient.recipient_key);syncRecipientDropdowns();document.getElementById("detail").hidden=true;setComposeOpen(true);messageText.focus();}
async function openDetail(item){current=item;activateLayerHistory();const announcement=item.message_type==="announcement",attendanceApproval=item.message_type==="attendance_approval",shareApproval=item.message_type==="property_share_approval",approval=attendanceApproval||shareApproval,urgent=item.priority==="urgent",kind=announcement?"announcement":urgent?"urgent":approval?"approval":"general",recipientNames=(item.recipient_labels||[]).join(", "),displayName=item.is_sender?`받는 사람 · ${recipientNames}`:item.sender_label,avatarSource=item.is_sender?(item.recipient_labels||[])[0]:item.sender_label,profileImage=item.is_sender?(item.recipient_profile_images||[])[0]:item.sender_profile_image;document.getElementById("detailTitle").textContent=announcement?"공지사항":attendanceApproval?"출퇴근 수정 결재":shareApproval?"Property 공유 결재":urgent?"긴급 메세지":"메세지";document.getElementById("detailMeta").innerHTML=`${avatarMarkup(avatarSource,profileImage)}<span class="detail-who"><b>${esc(displayName)}</b><small>${fmt(item.created_at)}</small></span>${categoryIcon(kind)}`;document.getElementById("detailBody").textContent=clean(item.message);const attendance=document.getElementById("attendance");attendance.hidden=!attendanceApproval;if(attendanceApproval){document.getElementById("workDate").textContent=item.work_date||"-";document.getElementById("originalTime").textContent=`${hm(item.original_clock_in_at)} ~ ${hm(item.original_clock_out_at)}`;document.getElementById("requestedTime").textContent=`${hm(item.requested_clock_in_at)} ~ ${hm(item.requested_clock_out_at)}`;}const confirmBox=document.getElementById("announcementConfirm"),status=document.getElementById("ackStatus"),unconfirmed=announcement&&!item.is_sender&&!item.acknowledged_at;confirmBox.hidden=!unconfirmed;document.getElementById("understood").checked=false;document.getElementById("ackName").value="";document.getElementById("ackHint").textContent="";status.hidden=!(announcement&&item.is_sender);status.innerHTML=announcement&&item.is_sender?`<b>공지 확인 현황</b>${(item.announcement_acknowledgements||[]).map(x=>`<span>${esc(x.employee_name)} · ${x.acknowledged_at?`확인 ${fmt(x.acknowledged_at)}`:"미확인"}</span>`).join("")}`:"";const button=document.getElementById("ack"),approved=item.approval_status==="approved";button.hidden=item.is_sender;button.textContent=unconfirmed?"이해했음 확인":approval?(approved?"✓ 결재완료":"결재 승인"):"답장";button.classList.toggle("done",approval&&approved);button.disabled=approval&&approved;document.getElementById("close").hidden=unconfirmed;document.getElementById("detail").hidden=false;document.body.classList.add("modal-open");if(!item.is_sender&&!item.read_at&&!announcement&&(!approval||approved)){try{await rpc("mark_property_message_read",{p_access_token:session.accessToken,p_message_id:item.message_id});item.read_at=new Date().toISOString();await load();}catch(_){}}}
const mailTabs=document.createElement("div");mailTabs.className="mail-tabs";mailTabs.innerHTML='<button class="mail-tab on" data-mailbox="inbox" type="button">수신함</button><button class="mail-tab" data-mailbox="sent" type="button">발신함</button><button class="mail-tab" data-mailbox="approvals" type="button" hidden>결재함</button>';document.querySelector(".head").after(mailTabs);mailTabs.querySelectorAll(".mail-tab").forEach(button=>button.onclick=()=>{activeMailbox=button.dataset.mailbox;mailTabs.querySelectorAll(".mail-tab").forEach(x=>x.classList.toggle("on",x===button));if(lastData)render(lastData);});document.getElementById("composeToggle").onclick=()=>setComposeOpen(composeOverlay.hidden);document.getElementById("composeClose").onclick=()=>setComposeOpen(false);composeOverlay.onclick=event=>{if(event.target===composeOverlay)setComposeOpen(false);};document.getElementById("searchToggle").onclick=()=>{const opening=searchPanel.hidden;if(opening){activateLayerHistory();searchPanel.hidden=false;searchInput.focus();}else closeActiveLayer();};searchInput.oninput=()=>{messageSearchQuery=searchInput.value;if(lastData)render(lastData);};document.getElementById("searchClear").onclick=closeActiveLayer;document.getElementById("refresh").onclick=load;function closeDetail(){if(current?.message_type==="announcement"&&!current.is_sender&&!current.acknowledged_at)return;closeActiveLayer();}document.getElementById("close").onclick=closeDetail;document.getElementById("detail").onclick=e=>{if(e.target.id==="detail")closeDetail();};addEventListener("popstate",()=>{if(current?.message_type==="announcement"&&!current.is_sender&&!current.acknowledged_at&&!document.getElementById("detail").hidden){history.pushState({...history.state,omgMessageLayer:true},"",location.href);layerHistoryActive=true;return;}dismissLayers();});
document.querySelectorAll(".type-button").forEach(button=>button.onclick=()=>{messageKind=button.dataset.kind;document.querySelectorAll(".type-button").forEach(x=>x.classList.toggle("selected",x===button));if(messageKind==="announcement"){selected.clear();localRecipientItems.filter(x=>x.recipient_type==="staff").forEach(x=>selected.add(x.recipient_key));closeRecipientDropdowns();}syncRecipientDropdowns();const send=document.getElementById("send");send.classList.toggle("urgent",messageKind==="urgent");send.textContent=messageKind==="urgent"?"긴급 메세지 보내기":messageKind==="announcement"?"공지 보내기":"메세지 보내기";});messageText.oninput=()=>document.getElementById("charCount").textContent=`${messageText.value.length} / 2000`;
composer.onsubmit=async event=>{event.preventDefault();const value=messageText.value.trim(),chosen=recipientItems.filter(item=>selected.has(item.recipient_key)),employeeIds=chosen.map(item=>item.employee_id).filter(Boolean),ownerIds=chosen.map(item=>item.owner_id).filter(Boolean),button=document.getElementById("send");if(!selected.size){notice.textContent="받는 사람을 선택해주세요.";return;}if(!value){notice.textContent="메세지 내용을 입력해주세요.";return;}button.disabled=true;notice.textContent="";try{const data=await rpc("send_shared_property_message",{p_access_token:session.accessToken,p_recipient_employee_ids:employeeIds,p_recipient_owner_ids:ownerIds,p_message:value,p_priority:messageKind==="urgent"?"urgent":"normal",p_message_type:messageKind==="announcement"?"announcement":"general"});let pushError=null;try{await pushMessage(data.message_id);}catch(error){pushError=error;}messageText.value="";selected.clear();setComposeOpen(false,false);await load();errorNode.textContent=pushError?"메세지는 전송됐지만 상대방 알림 전송에 실패했습니다.":"";}catch(error){notice.textContent=error.message;}finally{button.disabled=false;}};
document.getElementById("ack").onclick=async()=>{if(!current)return;const announcement=current.message_type==="announcement",approval=current.message_type==="attendance_approval"||current.message_type==="property_share_approval";if(announcement&&!current.is_sender&&!current.acknowledged_at){const button=document.getElementById("ack"),understood=document.getElementById("understood").checked,name=document.getElementById("ackName").value.trim();button.disabled=true;try{await rpc("acknowledge_announcement",{p_access_token:session.accessToken,p_message_id:current.message_id,p_employee_name:name,p_understood:understood});current.acknowledged_at=new Date().toISOString();closeActiveLayer();await load();}catch(error){document.getElementById("ackHint").textContent=error.message;button.disabled=false;}return;}if(!approval){replyTo(current);return;}const button=document.getElementById("ack");button.disabled=true;try{if(current.message_type==="attendance_approval")await rpc("approve_attendance_adjustment",{p_access_token:session.accessToken,p_request_id:current.attendance_request_id});else await rpc("approve_property_share",{p_access_token:session.accessToken,p_request_id:current.property_share_request_id});closeActiveLayer();await load();}catch(error){errorNode.textContent=error.message;button.disabled=false;}};
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;await load();openRequestedComposer();timer=setInterval(load,10000);window.omgTransition.ready();})().catch(error=>{errorNode.textContent=error.message;window.omgTransition.ready();});addEventListener("pagehide",()=>clearInterval(timer));
