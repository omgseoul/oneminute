name: Apply alert settings polish bundle

on:
  push:
    branches:
      - codex/message-alert-cap-popup
    paths:
      - .github/workflows/apply-codex-alert-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/message-alert-cap-popup
          fetch-depth: 0
      - name: Apply prepared change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          base64 -d codex-alert-polish.bundle.b64 > codex-alert-polish.bundle
          git fetch ./codex-alert-polish.bundle HEAD:refs/remotes/codex/alert-polish-change
          git cherry-pick refs/remotes/codex/alert-polish-change
          rm codex-alert-polish.bundle
          git rm codex-alert-polish.bundle.b64 .github/workflows/apply-codex-alert-polish.yml
          git commit -m "Remove temporary alert polish bundle [skip ci]"
          git push --force-with-lease origin HEAD:codex/message-alert-cap-popup
