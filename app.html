<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Guesthouse Manager</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--red:#dc4242;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:0 3px 15px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--navy)}.logout{border:0;background:transparent;color:#8794a7;font-size:12px;padding:8px}.hero{position:relative;min-height:180px;padding:31px 145px 28px 23px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 9px 28px rgba(42,78,120,.08);overflow:hidden}.hero:after{content:"";position:absolute;right:-45px;bottom:-75px;width:180px;height:180px;border-radius:50%;background:#edf5ff}.hero h1{position:relative;z-index:2;margin:0;color:var(--navy);font-size:39px;line-height:1.02;letter-spacing:-.055em}.hero p{position:relative;z-index:2;margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.shiba{position:absolute;z-index:2;right:17px;bottom:19px;width:124px;height:124px;object-fit:contain}.section-title{margin:24px 3px 11px;color:var(--navy);font-size:17px;letter-spacing:-.03em}.menu{display:grid;gap:12px}.card{position:relative;display:flex;align-items:center;min-height:104px;padding:19px 53px 19px 19px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 5px 18px rgba(42,78,120,.055);transition:.14s}.card:active{transform:scale(.978)}.icon{display:grid;place-items:center;flex:0 0 48px;height:48px;margin-right:15px;border-radius:15px;background:#eaf3ff;font-size:23px}.copy b{display:block;margin-bottom:5px;color:var(--navy);font-size:17px}.copy span{color:var(--muted);font-size:12px}.arrow{position:absolute;right:20px;color:#86a4ca;font-size:27px}.urgent .icon{background:#fff0f0}.urgent .copy b{color:#bd3131}.mission .icon{background:#f0f2f6}.foot{margin:19px 3px 0;color:#98a3b2;font-size:10px;text-align:center}.owner-only-hide[data-role="owner"]{display:none}
</style></head><body><main class="shell">
<div class="top"><span class="eyebrow">GUESTHOUSE MANAGER</span><button class="logout" onclick="location.href='guesthouse://logout'">로그아웃</button></div>
<section class="hero"><h1>One<br>Minute</h1><p>게스트하우스 업무를<br>빠르고 정확하게</p><img class="shiba" src="shiba-worker-logo-v2.png?v=1" alt="원미닛 시바견 캐릭터"></section>
<h2 class="section-title">업무 메뉴</h2>
<nav class="menu">
<a class="card" href="guesthouse://attendance"><span class="icon">🕘</span><span class="copy"><b>출퇴근 보고</b><span>오전·오후 출근 및 퇴근 보고</span></span><i class="arrow">›</i></a>
<a id="emergency" class="card urgent" href="guesthouse://emergency"><span class="icon">🚨</span><span class="copy"><b>사장님께 긴급보고</b><span>시설/설비 고장, 숙박 불가 사고 등</span></span><i class="arrow">›</i></a>
<a class="card mission" href="guesthouse://mission"><span class="icon">✓</span><span class="copy"><b>미션</b><span>오늘의 업무와 전달사항 확인</span></span><i class="arrow">›</i></a>
</nav><p class="foot">ONE MINUTE · STAFF MANAGEMENT</p>
</main><script>if(new URLSearchParams(location.search).get("role")==="owner")document.getElementById("emergency").style.display="none";</script></body></html>
