<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>긴급보고</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script><style>
:root{--navy:#183153;--red:#c9363f;--muted:#708095;--line:#e0e8f3;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}.shell{width:min(100%,540px);margin:auto;padding:22px 16px calc(34px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.hero{margin-top:18px;padding:24px;border:1px solid #f0d9dc;border-radius:24px;background:linear-gradient(145deg,#fff,#fff7f7);box-shadow:0 9px 28px rgba(80,40,50,.07)}.icon{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:#ffe8ea;font-size:26px}.hero h1{margin:15px 0 7px;color:#a82630;font-size:29px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:white}.card label{display:block;margin-bottom:9px;font-weight:900}.card textarea{width:100%;min-height:190px;padding:15px;border:1px solid #ccd8e7;border-radius:15px;color:#17243a;font:15px/1.6 inherit;resize:vertical}.card textarea:focus{outline:3px solid rgba(201,54,63,.09);border-color:#d55b63}.count{margin-top:6px;color:#8a97a8;font-size:11px;text-align:right}.send{width:100%;height:56px;margin-top:14px;border:0;border-radius:15px;background:var(--red);color:white;font-size:17px;font-weight:900;box-shadow:0 8px 20px rgba(201,54,63,.22)}.send:disabled{opacity:.55}.message{min-height:21px;margin-top:10px;color:#bd3038;font-size:12px;text-align:center}.success{display:none;margin-top:18px;padding:34px 22px;border:1px solid #cfe8da;border-radius:24px;background:white;text-align:center}.success b{display:block;margin:12px 0 7px;color:#18744a;font-size:23px}.success p{margin:0;color:var(--muted);line-height:1.55}.success a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:12px;background:#2467bd;color:white;text-decoration:none;font-weight:900}
</style></head><body><main class="shell"><a class="back" href="app.html">‹ 메인으로</a><section id="formArea"><header class="hero"><div class="icon">🚨</div><h1>긴급보고</h1><p id="propertyName">시설·설비 고장이나 숙박 불가 사고 등 즉시 확인이 필요한 내용을 보내세요.</p></header><form id="messageForm" class="card"><label for="urgentText">긴급 내용</label><textarea id="urgentText" maxlength="2000" required placeholder="상황과 위치를 구체적으로 입력해주세요."></textarea><div id="charCount" class="count">0 / 2000</div><button id="sendButton" class="send" type="submit">긴급보고 보내기</button><div id="message" class="message" role="alert"></div></form></section><section id="success" class="success"><div style="font-size:46px">✓</div><b>긴급보고를 전송했습니다</b><p>사장님의 메세지에 저장되고 긴급 알림이 전송되었습니다.</p><a href="app.html">메인으로</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="notification-config.js"></script><script src="notification-client.js"></script><script src="work-config.js"></script><script>

const form=document.getElementById("messageForm"),text=document.getElementById("urgentText"),notice=document.getElementById("message");let session=null;
async function rpc(name,args){const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"긴급보고를 보내지 못했습니다.");return data;}
text.addEventListener("input",()=>document.getElementById("charCount").textContent=`${text.value.length} / 2000`);
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;if(session.sessionKind!=="staff"){location.replace("app.html");return;}const config=await window.omgWorkConfig.load(session.accessToken);document.getElementById("propertyName").textContent=`${config.property.name} · 시설·설비 고장이나 숙박 불가 사고 등 즉시 확인이 필요한 내용을 보내세요.`;window.omgTransition.ready();})().catch(error=>{notice.textContent=error.message;window.omgTransition.ready();});
form.addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("sendButton"),value=text.value.trim();if(!value){notice.textContent="긴급 내용을 입력해주세요.";return;}button.disabled=true;notice.textContent="";try{const sent=await rpc("send_urgent_message",{p_access_token:session.accessToken,p_message:value});await window.omgNotifications.send(session.accessToken,sent.message_id);document.getElementById("formArea").style.display="none";document.getElementById("success").style.display="block";}catch(error){notice.textContent=error.message;button.disabled=false;}});
</script></body></html>
