name: Build and verify OMS Android update
on:
  workflow_dispatch:
  pull_request:
    paths: ['guesthouse-manager-app/**', '.github/workflows/build-android-apk.yml']
  push:
    branches: [main]
    paths: ['guesthouse-manager-app/**', '.github/workflows/build-android-apk.yml']
permissions:
  contents: read
concurrency:
  group: oms-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Validate APK publication certificate parsing
        run: python3 guesthouse-manager-app/scripts/test-publish-apk.py
      - name: Firebase configuration
        env: {GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}'}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > guesthouse-manager-app/app/google-services.json
      - name: Compile Android changes
        run: |
          python3 scripts/prepare-chat-handoff-fixture.py
          OMS_CHAT_TEST_BUILD=debug gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
        working-directory: guesthouse-manager-app
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native staff chat with synthetic local data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install guesthouse-manager-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -t guesthouse-manager-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb shell am instrument -w -e phase chat-handoff com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-handoff.txt"
            adb logcat -d -b crash
            grep -q 'oms_handoff=ok' "$RUNNER_TEMP/oms-handoff.txt"
            adb shell am instrument -w -e phase chat com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-chat.txt"
            grep -q 'oms_chat=ok' "$RUNNER_TEMP/oms-chat.txt"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-probe.png > "$RUNNER_TEMP/oms-native-chat.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-keyboard.png > "$RUNNER_TEMP/oms-native-keyboard.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-profile.png > "$RUNNER_TEMP/oms-native-profile.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-worker-profile-host.png > "$RUNNER_TEMP/oms-native-approval-profile.png"
            adb shell wm size 720x1280
            adb shell wm density 360
            adb shell settings put system font_scale 1.3
            adb shell am instrument -w -e phase chat-layout com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-layout-small.txt"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-layout.png > "$RUNNER_TEMP/oms-native-small.png"
            grep -q 'oms_layout=ok' "$RUNNER_TEMP/oms-layout-small.txt"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-keyboard.png > "$RUNNER_TEMP/oms-native-small-keyboard.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-profile.png > "$RUNNER_TEMP/oms-native-small-profile.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-worker-profile-host.png > "$RUNNER_TEMP/oms-native-small-approval-profile.png"
            adb shell wm size 1080x2400
            adb shell wm density 480
            adb shell settings put system font_scale 1.0
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            adb shell am instrument -w -e phase chat-layout com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-layout-gesture.txt"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-layout.png > "$RUNNER_TEMP/oms-native-gesture.png"
            grep -q 'oms_layout=ok' "$RUNNER_TEMP/oms-layout-gesture.txt"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-keyboard.png > "$RUNNER_TEMP/oms-native-gesture-keyboard.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-chat-profile.png > "$RUNNER_TEMP/oms-native-gesture-profile.png"
            adb exec-out run-as com.oneminute.guesthousemanager cat files/native-worker-profile-host.png > "$RUNNER_TEMP/oms-native-gesture-approval-profile.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: OMS-native-chat-preview, path: '${{ runner.temp }}/oms-native-*.png'}
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: write, id-token: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Firebase configuration
        env: {GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}'}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > guesthouse-manager-app/app/google-services.json
      - name: Restore encrypted persistent signing key
        run: python3 guesthouse-manager-app/scripts/restore-signing.py
      - name: Build update predecessor and continuity probe
        working-directory: guesthouse-manager-app
        run: |
          OMS_VERSION_CODE=$((OMS_VERSION_CODE - 1)) gradle assembleRelease assembleReleaseAndroidTest --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/oms-predecessor.apk"
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk "$RUNNER_TEMP/oms-probe.apk"
      - name: Build signed production update
        working-directory: guesthouse-manager-app
        run: gradle assembleRelease --no-build-cache --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify replacement install preserves private app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/oms-predecessor.apk"
            adb install -t "$RUNNER_TEMP/oms-probe.apk"
            adb shell am instrument -w -e phase seed com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-seed.txt"
            grep -q 'oms_update=ok' "$RUNNER_TEMP/oms-seed.txt"
            adb install -r guesthouse-manager-app/app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e phase verify com.oneminute.guesthousemanager.test/com.oneminute.guesthousemanager.UpdateProbe | tee "$RUNNER_TEMP/oms-verify.txt"
            grep -q 'oms_update=ok' "$RUNNER_TEMP/oms-verify.txt"
      - name: Verify release identity and prepare download
        run: python3 guesthouse-manager-app/scripts/publish-apk.py guesthouse-manager-app/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with: {name: OMS-release, path: guesthouse-manager-app/app/build/outputs/apk/release/app-release.apk}
      - name: Publish verified APK and update manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/OMS-latest.apk downloads/oms-update.json
          git commit -m 'Publish verified OMS release APK [skip ci]'
          git pull --rebase origin main
          git push
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/oms-release.p12" guesthouse-manager-app/app/google-services.json
