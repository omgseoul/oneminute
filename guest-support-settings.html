<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR 현장 고객 대응</title><link rel="stylesheet" href="guest-support.css"></head><body><main><div class="top"><a class="back" href="owner-settings.html">‹ Property 설정</a><a class="btn subtle" href="messages.html?tab=guest">채팅방</a></div><div class="eyebrow">PROPERTY · GUEST SUPPORT</div><h1>QR 현장 고객 대응</h1><p class="help">안내부터 직원과의 대화까지, 하나의 QR로 연결하세요.</p><div id="status" class="status" role="status">설정을 불러오는 중입니다.</div><form id="settings" hidden><section class="card"><div class="row between"><h2 style="margin:0">현장 고객 안내</h2><label class="check"><input id="enabled" type="checkbox">활성화</label></div><p class="help">비활성화하면 새 접속과 메시지를 중지합니다. 기존 대화 기록은 유지됩니다.</p><div id="items"></div><button class="btn wide" id="add" type="button">＋ 안내 항목 추가</button><div class="row between" style="margin-top:24px"><div><b>직원과 채팅</b><p class="help" style="margin:5px 0">게스트가 사진과 메시지를 보낼 수 있습니다.</p></div><label class="check"><input id="chatEnabled" type="checkbox">사용</label></div><button id="save" class="btn primary wide" style="margin-top:20px" type="submit">안내 설정 저장</button></section><section class="card"><h2>게스트 접속 QR</h2><p class="help">설정을 변경해도 주소와 QR은 그대로 유지됩니다.</p><div id="qr" class="qr"></div><input id="url" class="input small" readonly aria-label="게스트 안내 주소"><div class="row" style="margin-top:12px;flex-wrap:wrap"><button type="button" id="copy" class="btn grow">주소 복사</button><button type="button" id="download" class="btn grow">QR 저장</button><a id="preview" class="btn grow" target="_blank" rel="noopener">미리보기</a></div></section></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="guest-support-client.js"></script><script src="vendor/qrcode.js"></script><script src="guest-support-settings.js"></script></body></html>
