<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>게하관리</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--red:#dc4242;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:0 3px 15px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--navy)}.logout{border:0;background:transparent;color:#8794a7;font-size:12px;padding:8px}.hero{position:relative;min-height:180px;padding:31px 145px 28px 23px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 9px 28px rgba(42,78,120,.08);overflow:hidden}.hero:after{content:"";position:absolute;right:-45px;bottom:-75px;width:180px;height:180px;border-radius:50%;background:#edf5ff}.hero h1{position:relative;z-index:2;margin:0;color:var(--navy);font-size:38px;line-height:1.05;letter-spacing:-.055em;overflow-wrap:anywhere}.hero p{position:relative;z-index:2;margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.shiba{position:absolute;z-index:2;right:7px;bottom:24px;width:145px;height:145px;object-fit:contain}.section-title{margin:24px 3px 11px;color:var(--navy);font-size:17px;letter-spacing:-.03em}.menu{display:grid;gap:12px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{min-height:150px;padding:18px 14px;display:block}.report-card .icon{margin:0 0 13px}.report-card .copy b{font-size:21px;line-height:1.1}.report-card .copy span{display:block;margin-top:8px;line-height:1.4}.card{position:relative;display:flex;align-items:center;min-height:104px;padding:19px 53px 19px 19px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 5px 18px rgba(42,78,120,.055);transition:.14s}.card:active{transform:scale(.978)}.icon{display:grid;place-items:center;flex:0 0 48px;height:48px;margin-right:15px;border-radius:15px;background:#eaf3ff;font-size:23px}.copy{min-width:0}.copy b{display:block;margin-bottom:5px;color:var(--navy);font-size:17px}.copy span{color:var(--muted);font-size:12px}.arrow{position:absolute;right:20px;color:#86a4ca;font-size:27px}.urgent .icon{background:#fff0f0}.urgent .copy b{color:#bd3131}.urgent .copy span{font-size:11px;letter-spacing:-.04em}.settings .icon{background:#eef0ff}.foot{margin:19px 3px 0;color:#98a3b2;font-size:10px;text-align:center}
</style></head><body><main class="shell">
<div class="top"><span id="workerStatus" class="eyebrow">GUESTHOUSE MANAGER</span><button class="logout" onclick="logoutWorkApp()">로그아웃</button></div>
<section class="hero"><h1 id="propertyTitle">One Minute</h1><p>게스트하우스 업무를<br>빠르고 정확하게</p><img class="shiba" src="shiba-worker-logo-v2.png?v=1" alt="시바견 캐릭터"></section>
<h2 class="section-title">업무 메뉴</h2>
<nav id="mainMenu" class="menu" inert>
<div id="reportMenu" class="report-grid"><a class="card report-card" href="report.html?type=clock_in"><span class="icon">🐕</span><span class="copy"><b>출근보고</b><span>근무 시작 보고</span></span></a><a class="card report-card" href="report.html?type=clock_out"><span class="icon">🐶</span><span class="copy"><b>퇴근보고</b><span>업무 마감 보고</span></span></a></div>
<a id="settings" class="card settings" href="owner-settings.html" style="display:none"><span class="icon">⚙</span><span class="copy"><b>Property 설정</b><span>숙소명·객실·직원별 보고 항목</span></span><i class="arrow">›</i></a>
<a id="emergency" class="card urgent" href="guesthouse://emergency"><span class="icon">🚨</span><span class="copy"><b>사장님께 긴급보고</b><span>시설/설비 고장, 숙박 불가 사고 등</span></span><i class="arrow">›</i></a>
<a id="owner-inbox" class="card" href="guesthouse://inbox" style="display:none"><span class="icon">✉</span><span class="copy"><b>온 메시지 확인함</b><span>직원 긴급보고 확인</span></span><i class="arrow">›</i></a>
<a id="missionMenu" class="card" href="mission.html"><span class="icon">✓</span><span class="copy"><b>미션</b><span id="missionCopy">오늘의 업무와 전달사항 확인</span></span><i class="arrow">›</i></a>
</nav><p class="foot">OMG WORKS · STAFF MANAGEMENT</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
(async () => {
  const session = await window.omgSession.require({ allowCompleted: true });
  if (!session) return;
  const config = await window.omgWorkConfig.load(session.accessToken);
  const isOwner = session.sessionKind === "owner" && config.can_manage;
  const state = isOwner ? "관리 모드" : session.status === "completed" ? "근무 종료 · 보고 전송 확인" : "근무 중";
  document.getElementById("workerStatus").textContent = `${session.employeeName} · ${state}`;
  document.getElementById("propertyTitle").textContent = config.property.name;
  document.title = `${config.property.name} · 게하관리`;
  document.getElementById("reportMenu").style.display = isOwner ? "none" : "";
  document.getElementById("settings").style.display = isOwner ? "" : "none";
  document.getElementById("owner-inbox").style.display = isOwner ? "" : "none";
  document.getElementById("emergency").style.display = isOwner ? "none" : "";
  document.getElementById("missionCopy").textContent = isOwner ? "미션 등록·진행 확인" : "오늘의 업무와 전달사항 확인";
  document.getElementById("mainMenu").inert = false;
})().catch(error => { document.getElementById("workerStatus").textContent = error.message; });
async function logoutWorkApp(){const owner=window.omgSession.get()?.sessionKind==="owner";await window.omgSession.logout();location.replace(owner?"owner-login.html":"login.html");}
</script></body></html>
