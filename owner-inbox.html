<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>받은 메시지함</title><style>
:root{--navy:#183153;--blue:#2467bd;--red:#c9363f;--muted:#708095;--line:#dfe8f4;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}button{font:inherit}.shell{width:min(100%,620px);margin:auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between}.back{color:#718198;text-decoration:none;font-size:13px}.refresh{border:0;border-radius:10px;background:#eaf3ff;color:var(--blue);padding:8px 11px;font-size:11px;font-weight:900}.head{margin:18px 2px}.head h1{margin:0;font-size:30px;letter-spacing:-.04em}.head p{margin:7px 0 0;color:var(--muted);font-size:12px}.unread{display:inline-flex;margin-left:7px;padding:4px 8px;border-radius:999px;background:#fff0f1;color:var(--red);font-size:11px;vertical-align:middle}.list{display:grid;gap:10px}.message-card{width:100%;padding:17px;border:1px solid var(--line);border-radius:18px;background:white;color:inherit;text-align:left;box-shadow:0 5px 17px rgba(42,78,120,.05)}.message-card.unread-card{border-color:#efb7bc;background:linear-gradient(145deg,#fff,#fff9f9)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.sender{font-size:15px;font-weight:900}.time{color:#8995a5;font-size:10px}.preview{margin:9px 0 0;overflow:hidden;color:#4f6179;font-size:13px;line-height:1.5;text-overflow:ellipsis;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--red)}.empty{padding:42px 18px;border:1px dashed #cad7e6;border-radius:20px;background:rgba(255,255,255,.5);color:var(--muted);text-align:center}.error{min-height:20px;margin-top:12px;color:var(--red);font-size:12px;text-align:center}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,34,56,.45)}.overlay[hidden]{display:none}.sheet{width:min(100%,620px);max-height:86vh;overflow:auto;padding:20px 19px calc(24px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:white}.sheet-top{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;color:var(--navy);font-size:22px}.close{width:38px;height:38px;border:0;border-radius:12px;background:#eff4fa;color:var(--navy);font-size:20px}.meta{margin-top:8px;color:#8290a2;font-size:11px}.body{margin-top:17px;padding:17px;border-radius:15px;background:#f6f8fc;color:#263a56;font-size:15px;line-height:1.65;white-space:pre-wrap}.ack{width:100%;height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--blue);color:white;font-weight:900}.ack.done{background:#eaf6f0;color:#23815a}
</style></head><body><main class="shell"><div class="top"><a class="back" href="app.html">‹ 메인으로</a><button id="refresh" class="refresh" type="button">새로고침</button></div><header class="head"><h1>받은 메시지함 <span id="unread" class="unread">0</span></h1><p>근무자가 보낸 긴급보고를 확인합니다.</p></header><div id="list" class="list"><div class="empty">메시지를 불러오는 중입니다.</div></div><div id="error" class="error"></div></main><div id="detail" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2>직원 긴급보고</h2><button id="close" class="close" type="button">×</button></div><div id="detailMeta" class="meta"></div><div id="detailBody" class="body"></div><button id="ack" class="ack" type="button">확인 완료</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
let session=null,current=null,timer=null;const list=document.getElementById("list"),errorNode=document.getElementById("error");
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function fmt(value){return new Date(value).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}
async function rpc(name,args){const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"메시지를 처리하지 못했습니다.");return data;}
function render(data){document.getElementById("unread").textContent=data.unread_count||0;const items=data.messages||[];if(!items.length){list.innerHTML='<div class="empty">받은 긴급보고가 없습니다.</div>';return;}list.innerHTML=items.map(item=>`<button class="message-card ${item.acknowledged_at?"":"unread-card"}" data-id="${item.message_id}" type="button"><div class="card-top"><span class="sender">${item.acknowledged_at?"":'<i class="dot"></i>'}${esc(item.employee_name)}</span><span class="time">${fmt(item.created_at)}</span></div><p class="preview">${esc(item.message)}</p></button>`).join("");list.querySelectorAll(".message-card").forEach((button,index)=>button.onclick=()=>openDetail(items[index]));}
async function load(){if(!session)return;try{render(await rpc("list_urgent_messages",{p_access_token:session.accessToken}));errorNode.textContent="";}catch(error){errorNode.textContent=error.message;}}
function openDetail(item){current=item;document.getElementById("detailMeta").textContent=`${item.employee_name} · ${fmt(item.created_at)}`;document.getElementById("detailBody").textContent=item.message;const button=document.getElementById("ack");button.textContent=item.acknowledged_at?"✓ 확인 완료":"확인 완료";button.classList.toggle("done",Boolean(item.acknowledged_at));button.disabled=Boolean(item.acknowledged_at);document.getElementById("detail").hidden=false;}
document.getElementById("close").onclick=()=>document.getElementById("detail").hidden=true;document.getElementById("refresh").onclick=load;document.getElementById("ack").onclick=async()=>{if(!current)return;const button=document.getElementById("ack");button.disabled=true;try{await rpc("acknowledge_urgent_message",{p_access_token:session.accessToken,p_message_id:current.message_id});document.getElementById("detail").hidden=true;await load();}catch(error){errorNode.textContent=error.message;button.disabled=false;}};
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;if(session.sessionKind!=="owner"){location.replace("app.html");return;}await load();timer=setInterval(load,10000);})().catch(error=>errorNode.textContent=error.message);addEventListener("pagehide",()=>clearInterval(timer));
</script></body></html>
