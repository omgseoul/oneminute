<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>게하관리</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--red:#dc4242;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin:0 3px 15px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--navy)}.logout{border:0;background:transparent;color:#8794a7;font-size:12px;padding:8px}.hero{position:relative;min-height:180px;padding:31px 145px 28px 23px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 9px 28px rgba(42,78,120,.08);overflow:hidden}.hero:after{content:"";position:absolute;right:-45px;bottom:-75px;width:180px;height:180px;border-radius:50%;background:#edf5ff}.hero h1{position:relative;z-index:2;margin:0;color:var(--navy);font-size:38px;line-height:1.05;letter-spacing:-.055em;overflow-wrap:anywhere}.hero p{position:relative;z-index:2;margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.shiba{position:absolute;z-index:2;right:7px;bottom:24px;width:145px;height:145px;object-fit:contain}.section-title{margin:24px 3px 11px;color:var(--navy);font-size:17px;letter-spacing:-.03em}.menu{display:grid;gap:12px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.report-card{display:flex;align-items:center;justify-content:center;min-height:88px;padding:16px 8px;text-align:center}.report-card .copy b{margin:0;font-size:20px;line-height:1.2;white-space:nowrap}.report-card .copy span{display:block;margin-top:6px;font-size:11px;line-height:1.3}.card{position:relative;display:flex;align-items:center;min-height:104px;padding:19px 53px 19px 19px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 5px 18px rgba(42,78,120,.055);transition:.14s}.card:active{transform:scale(.978)}.icon{display:grid;place-items:center;flex:0 0 48px;height:48px;margin-right:15px;border-radius:15px;background:#eaf3ff;font-size:23px}.copy{min-width:0}.copy b{display:block;margin-bottom:5px;color:var(--navy);font-size:17px}.copy span{color:var(--muted);font-size:12px}.arrow{position:absolute;right:20px;color:#86a4ca;font-size:27px}.urgent .icon{background:#fff0f0}.urgent .copy b{color:#bd3131}.urgent .copy span{font-size:11px;letter-spacing:-.04em}.settings .icon{background:#eef0ff}.secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-card{justify-content:space-between;min-height:88px;padding:12px 13px 12px 17px;text-align:left}.quick-card .copy b{margin:0;font-size:18px;line-height:1.18;white-space:normal}.quick-card.urgent .copy b{color:#bd3131;font-size:18px;letter-spacing:-.04em}.quick-card .copy span{display:none}.quick-card .arrow{display:none}.quick-visual{display:grid;place-items:center;flex:0 0 56px;width:56px;height:56px;margin-left:8px;border-radius:18px;background:#fff0f0;font-size:30px}.mission-counter{display:grid;place-items:center;align-content:center;flex:0 0 56px;width:56px;height:56px;margin-left:8px;border-radius:50%;background:#eaf3ff;color:var(--blue);line-height:1}.mission-counter strong{font-size:20px}.mission-counter small{margin-top:3px;font-size:8px;font-weight:900;white-space:nowrap}.secondary-grid.owner-mode{grid-template-columns:1fr}.notice-section{margin-top:23px;padding:0 3px}.notice-section .section-title{margin:0 0 9px;font-size:17px}.notice-line{display:flex;align-items:flex-start;gap:7px;margin:0;color:var(--muted);font-size:13px;line-height:1.65;white-space:pre-line}.notice-mark{color:var(--navy);font-weight:900}.notice-section.empty{display:none}@media(max-width:390px){.quick-card{padding:11px 11px 11px 14px}.quick-card .copy b,.quick-card.urgent .copy b{font-size:17px}.quick-visual,.mission-counter{width:52px;height:52px;flex-basis:52px;margin-left:5px}.quick-visual{font-size:28px}.mission-counter strong{font-size:18px}}.foot{margin:19px 3px 0;color:#98a3b2;font-size:10px;text-align:center}
.report-card{justify-content:space-between;padding:13px 12px 13px 16px;text-align:left}.report-card .report-dog{flex:0 0 64px;width:64px;height:64px;margin-left:4px;object-fit:contain}.report-card .copy b{font-size:18px}@media(max-width:390px){.report-card{padding-left:12px}.report-card .report-dog{flex-basis:55px;width:55px;height:55px}.report-card .copy b{font-size:17px}.report-card .copy span{font-size:10px}}
</style></head><body><main class="shell">
<div class="top"><span id="workerStatus" class="eyebrow">GUESTHOUSE MANAGER</span><button class="logout" onclick="logoutWorkApp()">로그아웃</button></div>
<section class="hero"><h1 id="propertyTitle">One Minute</h1><p>게스트하우스 업무를<br>빠르고 정확하게</p><img class="shiba" src="shiba-worker-logo-v2.png?v=1" alt="시바견 캐릭터"></section>
<h2 class="section-title">업무 메뉴</h2>
<nav id="mainMenu" class="menu" inert>
<div id="reportMenu" class="report-grid"><a class="card report-card" href="report.html?type=clock_in"><span class="copy"><b>출근보고</b><span>근무 시작 보고</span></span><img class="report-dog" src="shiba-face-morning-in.png" alt="밝은 강아지 얼굴"></a><a class="card report-card" href="report.html?type=clock_out"><span class="copy"><b>퇴근보고</b><span>업무 마감 보고</span></span><img class="report-dog" src="shiba-face-morning-out.png" alt="지친 강아지 얼굴"></a></div>
<a id="settings" class="card settings" href="owner-settings.html" style="display:none"><span class="icon">⚙</span><span class="copy"><b>Property 설정</b><span>숙소명·객실·직원별 보고 항목</span></span><i class="arrow">›</i></a>
<div id="secondaryMenu" class="secondary-grid"><a id="emergency" class="card quick-card urgent" href="emergency.html"><span class="copy"><b>사장님<br>긴급보고</b><span>긴급 상황 보고</span></span><span class="quick-visual" aria-hidden="true">🚨</span></a>
<a id="owner-inbox" class="card" href="owner-inbox.html" style="display:none"><span class="icon">✉</span><span class="copy"><b>받은 메시지함</b><span>직원 긴급보고 확인</span></span><i class="arrow">›</i></a>
<a id="missionMenu" class="card quick-card" href="mission.html"><span class="copy"><b>미션</b><span id="missionCopy">오늘의 업무와 전달사항 확인</span></span><span id="missionCounter" class="mission-counter"><strong id="todayMissionCount">0</strong><small>당일미션</small></span></a></div><section id="noticeCard" class="notice-section empty" aria-live="polite"><h2 class="section-title">공지사항</h2><p class="notice-line"><span class="notice-mark" aria-hidden="true">-</span><span id="noticeText"></span></p></section>
</nav><p class="foot">OMG WORKS · STAFF MANAGEMENT</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
(async () => {
  const session = await window.omgSession.require({ allowCompleted: true });
  if (!session) return;
  const config = await window.omgWorkConfig.load(session.accessToken);
  const isOwner = session.sessionKind === "owner" && config.can_manage;document.getElementById("secondaryMenu").classList.toggle("owner-mode",isOwner);
  const state = isOwner ? "관리 모드" : session.status === "completed" ? "근무 종료 · 보고 전송 확인" : "근무 중";
  document.getElementById("workerStatus").textContent = `${session.employeeName} · ${state}`;
  document.getElementById("propertyTitle").textContent = config.property.name;
  document.title = `${config.property.name} · 게하관리`;
  document.getElementById("reportMenu").style.display = isOwner ? "none" : "";
  document.getElementById("settings").style.display = isOwner ? "" : "none";
  document.getElementById("owner-inbox").style.display = isOwner ? "" : "none";
  document.getElementById("emergency").style.display = isOwner ? "none" : "";document.getElementById("missionCounter").style.display=isOwner?"none":"";const notice=String(config.property.notice||"").trim();const noticeCard=document.getElementById("noticeCard");document.getElementById("noticeText").textContent=notice||"등록된 공지사항이 없습니다.";noticeCard.classList.toggle("empty",isOwner);
  document.getElementById("missionCopy").textContent = isOwner ? "미션 등록·진행 확인" : "오늘의 업무와 전달사항 확인";
if(!isOwner){const{data}=await window.omgSupabase.rpc("list_missions",{p_access_token:session.accessToken});if(data?.ok){const todayCount=(data.missions||[]).filter(item=>item.timing==="today"&&(!item.target_employee_ids?.length||item.target_employee_ids.includes(session.employeeId))&&!(item.completion_employee_ids||[]).includes(session.employeeId)).length;document.getElementById("todayMissionCount").textContent=String(todayCount);}}  document.getElementById("mainMenu").inert = false;
})().catch(error => { document.getElementById("workerStatus").textContent = error.message; });
async function logoutWorkApp(){const owner=window.omgSession.get()?.sessionKind==="owner";await window.omgSession.logout();location.replace(owner?"owner-login.html":"login.html");}
</script></body></html>
