<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Property 설정</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff;--red:#b83838}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,720px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.help{margin:0 0 15px;color:var(--muted);font-size:11px;line-height:1.55}label.title{display:block;margin:15px 0 7px;color:var(--navy);font-size:13px;font-weight:900}input[type=text],input[type=password],textarea,select{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font:15px/1.5 inherit}textarea{min-height:90px;resize:vertical}.room-row{display:grid;grid-template-columns:135px 1fr auto;gap:9px;align-items:start;margin-top:10px}.account-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #edf1f6}.account-head{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;gap:8px}.account-label{color:#64748b;font-size:12px;font-weight:900}.delete-account{min-height:26px;padding:3px 8px;border:1px solid #efcaca;border-radius:8px;background:#fff7f7;color:var(--red);font-size:10px;font-weight:900}.employee-panel{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbfcfe}.report-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px;border-radius:13px;background:#eaf1fa}.report-tab{height:43px;border:0;border-radius:10px;background:transparent;color:#718198;font-weight:900}.report-tab.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(42,78,120,.1)}.group-title{margin:16px 0 8px;color:#586b84;font-size:12px;font-weight:900}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.check{position:relative}.check input{position:absolute;opacity:0}.check label{display:flex;align-items:center;justify-content:center;min-height:39px;padding:7px 5px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;color:#607087;font-size:11px;font-weight:800;text-align:center;cursor:pointer}.check input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy)}.reminder{margin-top:18px;padding-top:18px;border-top:2px solid #e8eef7}.card-editor{margin-top:9px;border:1px solid #dae5f2;border-radius:14px;background:#fff;overflow:hidden}.card-summary{display:flex;align-items:center;padding:8px 9px;background:#fff}.card-open{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;gap:7px;align-items:center;min-width:0;flex:1;padding:3px;border:0;background:#fff;color:var(--navy);text-align:left;font-weight:900}.card-summary-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.weekday-mini{display:flex;gap:2px}.weekday-mini i{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#edf1f6;color:#9aa5b4;font-size:9px;font-style:normal}.weekday-mini i.on{background:#dcecff;color:var(--blue)}.chevron{font-size:18px;transition:transform .18s}.card-editor.open .chevron{transform:rotate(180deg)}.card-detail{display:none;padding:0 12px 12px;border-top:1px solid #edf1f6}.card-editor.open .card-detail{display:block}.weekday-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:11px 0}.weekday-picker label{margin:0}.weekday-picker input{position:absolute;opacity:0}.weekday-picker span{display:grid;place-items:center;min-height:30px;border:1px solid #d5e0ed;border-radius:8px;color:#7b899b;font-size:10px;font-weight:900}.weekday-picker input:checked+span{border-color:var(--blue);background:var(--soft);color:var(--blue)}.card-row{display:grid;grid-template-columns:86px 1fr;gap:12px}.preview{width:86px;height:108px;object-fit:cover;border-radius:11px;background:#eef4fb}.editor-actions{display:flex;gap:8px;margin-top:9px}.small-btn{min-height:39px;padding:8px 11px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;color:var(--navy);font-weight:800}.remove{color:var(--red)}.add{width:100%;margin-top:12px}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:560px){.room-row{grid-template-columns:92px 1fr auto}.account-row{grid-template-columns:1fr 1fr}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}.check label{font-size:10px;padding:6px 3px}.card-row{grid-template-columns:72px 1fr}.preview{width:72px;height:96px}.weekday-mini i{width:17px;height:18px;font-size:8px}.card-summary{padding:8px 6px}.card-open{gap:4px}}
.property-grid{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:10px}.property-id-title{white-space:nowrap}.management-number{background:#f2f5f9!important;color:#596b82!important;font-weight:900;text-align:center}@media(max-width:420px){.property-grid{grid-template-columns:minmax(0,1fr) 105px}}
.business-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.business-type{position:relative}.business-type input{position:absolute;opacity:0}.business-type label{display:grid;place-items:center;gap:5px;min-height:92px;padding:10px 4px;border:1px solid #cbd8e8;border-radius:14px;background:#fff;color:#607087;font-size:11px;font-weight:900;text-align:center;cursor:pointer}.business-type svg{width:31px;height:31px;color:var(--navy)}.business-type input:checked+label{border:2px solid var(--blue);background:var(--soft);color:var(--navy);box-shadow:0 5px 14px rgba(36,103,189,.12)}[hidden]{display:none!important}.custom-field-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.custom-check{position:relative}.custom-delete{position:absolute;z-index:2;top:-5px;right:-5px;width:20px;height:20px;padding:0;border:1px solid #e3b8b8;border-radius:50%;background:#fff;color:var(--red);font-size:13px;line-height:18px;font-weight:900}.custom-check label{padding-right:17px}
</style></head><body><main class="shell">
<a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>Property 설정</h1><p>숙소, 객실 타입과 직원별 출퇴근 보고 항목을 관리합니다.</p></header>
<form id="settingsForm" inert>
<section class="card"><h2>Property 기본정보</h2><div class="property-grid"><div><label class="title" for="propertyName">Property명</label><input id="propertyName" type="text" maxlength="80" required></div><div><label class="title property-id-title" for="managementNumber">Property ID</label><input id="managementNumber" class="management-number" type="text" value="1" readonly aria-readonly="true"></div></div><div class="business-types" aria-label="사업장 유형"><span class="business-type"><input id="typeLodging" name="businessType" type="radio" value="lodging"><label for="typeLodging"><span>숙박업</span><svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5V21H3v-9.5Z M8 21v-7h8v7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></label></span><span class="business-type"><input id="typeGeneral" name="businessType" type="radio" value="general"><label for="typeGeneral"><span>일반사업장</span><svg viewBox="0 0 24 24" fill="none"><path d="M5 21V5h10v16M15 10h4v11M8 9h4M8 13h4M8 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></label></span><span class="business-type"><input id="typeOther" name="businessType" type="radio" value="other"><label for="typeOther"><span>기타</span><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M9.8 9a2.3 2.3 0 1 1 3.2 2.1c-.8.4-1 1-1 1.9M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></label></span></div><div id="lodgingFields" hidden><label class="title">객실 타입과 객실번호</label><p class="help">왼쪽에는 객실 타입명, 오른쪽에는 해당 객실번호를 쉼표로 구분해 입력하세요.</p><div id="roomTypes"></div><button id="addRoomType" class="small-btn add" type="button">+ 객실 타입 추가</button><p id="roomCount" class="help">총 0개 객실</p></div></section>
<section class="card"><h2>근무자별 보고 항목</h2><p class="help">근무자 한 명을 선택하면 그 직원의 설정만 아래에 표시됩니다.</p><label class="title" for="employeeSelect">근무자 선택</label><select id="employeeSelect"></select><div id="employeePanel" class="employee-panel"></div></section>
<button id="saveButton" class="save" type="submit">전체 설정 저장</button><div id="message" class="message" role="alert"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("settingsForm"),panel=document.getElementById("employeePanel"),select=document.getElementById("employeeSelect"),message=document.getElementById("message"),roomTypesNode=document.getElementById("roomTypes"),lodgingFields=document.getElementById("lodgingFields");let session=null,config=null,employeeConfigs={},activeReport="clock_in";
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function splitRooms(value){return[...new Set(String(value||"").split(/[\n,]+/).map(room=>room.trim()).filter(Boolean))];}
function parseRoomTypes(){return[...roomTypesNode.querySelectorAll(".room-row")].map((row,index)=>({name:row.querySelector(".type-name").value.trim()||`객실타입${index+1}`,rooms:splitRooms(row.querySelector(".room-numbers").value)})).filter(group=>group.rooms.length);}
function updateRoomCount(){document.getElementById("roomCount").textContent=`총 ${parseRoomTypes().flatMap(group=>group.rooms).length}개 객실`;}
function addRoomType(group={name:"",rooms:[]}){const row=document.createElement("div");row.className="room-row";row.innerHTML=`<input class="type-name" type="text" maxlength="40" placeholder="객실타입 이름" value="${esc(group.name)}"><input class="room-numbers" type="text" maxlength="800" placeholder="객실번호: 101, 102, 103" value="${esc((group.rooms||[]).join(", "))}"><button class="small-btn remove" type="button">삭제</button>`;row.querySelectorAll("input").forEach(input=>input.addEventListener("input",updateRoomCount));row.querySelector(".remove").onclick=()=>{row.remove();updateRoomCount();};roomTypesNode.append(row);updateRoomCount();}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("사진을 읽지 못했습니다."));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error("사진 형식을 확인해주세요."));image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78));};image.src=reader.result;};reader.readAsDataURL(file);});}
function syncCurrent(){const id=panel.dataset.employeeId;if(!id||!employeeConfigs[id])return;const current=employeeConfigs[id],rows=[...panel.querySelectorAll(".card-editor")],visibleIds=new Set(rows.map(row=>row.dataset.cardId));const fields=[...panel.querySelectorAll(`input[data-type="${activeReport}"]:checked`)].map(input=>input.value);const retained=(current.reminder_cards||[]).filter(card=>!visibleIds.has(card.id));const edited=rows.map(row=>{const old=(current.reminder_cards||[]).find(card=>card.id===row.dataset.cardId),reportTypes=(old?.report_types||[]).filter(type=>type!==activeReport),selectedDays=[...row.querySelectorAll('.weekday-picker input:checked')].map(input=>Number(input.value));if(selectedDays.length)reportTypes.push(activeReport);return{id:row.dataset.cardId,title:row.querySelector(".card-title").value.trim(),image:row.querySelector(".preview").getAttribute("src"),text:row.querySelector(".card-text").value.trim(),report_types:[...new Set(reportTypes)],report_weekdays:{...(old?.report_weekdays||{}),[activeReport]:selectedDays},weekdays:old?.weekdays||selectedDays};}).filter(card=>card.title&&card.image&&card.text);current.reminder_cards=[...retained,...edited];current[activeReport]=fields;if(edited.some(card=>card.report_types.includes(activeReport)))current[activeReport].push("reminder_cards");}
function makeCheck(type,field,selected){const id=`${select.value}-${type}-${field.key}`;return`<span class="check ${field.custom?"custom-check":""}">${field.custom?`<button class="custom-delete" type="button" data-custom-key="${esc(field.key)}" aria-label="${esc(field.label)} 삭제">×</button>`:""}<input id="${id}" type="checkbox" data-type="${type}" value="${esc(field.key)}" ${selected.includes(field.key)?"checked":""}><label for="${id}">${esc(field.label)}</label></span>`;}
function cardEditor(card,index){const days=["일","월","화","수","목","금","토"],savedDays=card.report_weekdays?.[activeReport],selected=new Set(Array.isArray(savedDays)?savedDays:(card.report_types||[]).includes(activeReport)?card.weekdays??[0,1,2,3,4,5,6]:[]);return`<div class="card-editor" data-card-id="${esc(card.id||`card-${Date.now()}-${index}`)}"><div class="card-summary"><button class="card-open" type="button"><span class="card-summary-title">카드 ${index+1} · ${esc(card.title||"새 리마인더")}</span><span class="weekday-mini">${days.map((day,value)=>`<i class="${selected.has(value)?"on":""}">${day}</i>`).join("")}</span><span class="chevron">⌄</span></button></div><div class="card-detail"><div class="weekday-picker">${days.map((day,value)=>`<label><input type="checkbox" value="${value}" ${selected.has(value)?"checked":""}><span>${day}</span></label>`).join("")}</div><div class="card-row"><img class="preview" src="${esc(card.image)}" alt="카드 사진"><div><input class="card-title" type="text" maxlength="50" value="${esc(card.title)}" placeholder="카드 제목"><label class="title">뒷면 안내문</label><textarea class="card-text" maxlength="1000" placeholder="사진 뒷면에 표시할 내용을 입력하세요.">${esc(card.text)}</textarea></div></div><div class="editor-actions"><label class="small-btn">사진 변경<input class="image-input" type="file" accept="image/*" hidden></label><button class="small-btn remove" type="button">요일 선택 해제</button></div></div></div>`;}
function bindImage(input){input.addEventListener("change",async()=>{if(!input.files[0])return;try{input.closest(".card-editor").querySelector(".preview").src=await fileToDataUrl(input.files[0]);}catch(error){alert(error.message);}input.value="";});}
function bindCardEditor(row){bindImage(row.querySelector(".image-input"));row.querySelector(".card-open").onclick=()=>row.classList.toggle("open");row.querySelector(".card-title").addEventListener("input",event=>{const index=[...row.parentNode.children].indexOf(row)+1;row.querySelector(".card-summary-title").textContent=`카드 ${index} · ${event.target.value.trim()||"새 리마인더"}`;});row.querySelectorAll(".weekday-picker input").forEach((input,index)=>input.addEventListener("change",()=>row.querySelectorAll(".weekday-mini i")[index].classList.toggle("on",input.checked)));row.querySelector(".remove").onclick=()=>{row.querySelectorAll(".weekday-picker input").forEach(input=>{input.checked=false;});row.querySelectorAll(".weekday-mini i").forEach(day=>day.classList.remove("on"));row.classList.remove("open");};}
function render(){const employee=config.employees.find(item=>item.employee_id===select.value);if(!employee){panel.innerHTML="";return;}const saved=employeeConfigs[employee.employee_id]||window.omgWorkConfig.normalizeReportConfig(employee.report_config,config.property),label=activeReport==="clock_in"?"출근보고":"퇴근보고",cards=saved.reminder_cards,fields=window.omgWorkConfig.fieldsFor(config.property);employeeConfigs[employee.employee_id]=saved;panel.dataset.employeeId=employee.employee_id;panel.innerHTML=`<div class="report-tabs" aria-label="보고 종류"><button class="report-tab ${activeReport==="clock_in"?"on":""}" type="button" data-report="clock_in">출근보고</button><button class="report-tab ${activeReport==="clock_out"?"on":""}" type="button" data-report="clock_out">퇴근보고</button></div><div class="group-title">보고 선택 항목</div><div class="custom-field-row"><input id="customFieldName" type="text" maxlength="40" placeholder="새 보고 항목 입력"><button id="addCustomField" class="small-btn" type="button">추가</button></div><div class="checks" style="margin-top:9px">${fields.map(field=>makeCheck(activeReport,field,saved[activeReport])).join("")||'<p class="help">직접 입력한 보고 항목이 없습니다.</p>'}</div><div class="reminder"><div class="group-title">${label} 리마인더</div><p class="help">표시할 요일을 선택하세요. 선택된 요일이 없으면 이 보고에는 카드가 표시되지 않습니다.</p><div id="cardEditors">${cards.map(cardEditor).join("")}</div><button id="addCard" class="small-btn add" type="button">+ ${label} 리마인더 추가</button></div>`;panel.querySelectorAll(".report-tab").forEach(button=>button.onclick=()=>{if(button.dataset.report===activeReport)return;syncCurrent();activeReport=button.dataset.report;render();});document.getElementById("addCustomField").onclick=addCustomField;document.getElementById("customFieldName").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();addCustomField();}});panel.querySelectorAll(".custom-delete").forEach(button=>button.onclick=()=>removeCustomField(button.dataset.customKey));panel.querySelectorAll(".card-editor").forEach(bindCardEditor);document.getElementById("addCard").onclick=()=>{if((saved.reminder_cards||[]).length>=12){alert("리마인더 카드는 최대 12개까지 만들 수 있습니다.");return;}const container=document.getElementById("cardEditors");container.insertAdjacentHTML("beforeend",cardEditor({id:`card-${Date.now()}`,title:"",image:"shiba-worker-logo-v2.png",text:"",report_types:[activeReport],report_weekdays:{[activeReport]:[0,1,2,3,4,5,6]},weekdays:[0,1,2,3,4,5,6]},container.children.length));const row=container.lastElementChild;row.classList.add("open");bindCardEditor(row);};}
function selectedBusinessType(){return document.querySelector('input[name="businessType"]:checked')?.value||null;}
function updateBusinessType(){lodgingFields.hidden=selectedBusinessType()!=="lodging";render();}
function removeCustomField(key){syncCurrent();config.property.custom_report_fields=(config.property.custom_report_fields||[]).filter(field=>field.key!==key);Object.values(employeeConfigs).forEach(item=>{item.clock_in=item.clock_in.filter(value=>value!==key);item.clock_out=item.clock_out.filter(value=>value!==key);});render();}
function addCustomField(){const input=document.getElementById("customFieldName"),label=input.value.trim();if(!label)return;if((config.property.custom_report_fields||[]).length>=20){alert("직접 만든 보고 항목은 최대 20개까지 추가할 수 있습니다.");return;}syncCurrent();const random=globalThis.crypto?.randomUUID?.().replaceAll("-","").slice(0,16)||`${Date.now()}${Math.random().toString(36).slice(2,7)}`;const field={key:`custom_${random.toLowerCase()}`,label};config.property.custom_report_fields=[...(config.property.custom_report_fields||[]),field];Object.values(employeeConfigs).forEach(item=>{if(!item[activeReport].includes(field.key))item[activeReport].push(field.key);});input.value="";render();}
function loadConfig(next){config=next;document.getElementById("propertyName").value=config.property.name;document.getElementById("managementNumber").value=config.property.management_number??"미지정";document.querySelectorAll('input[name="businessType"]').forEach(input=>input.checked=input.value===config.property.business_type);roomTypesNode.replaceChildren();(config.property.room_types||[]).forEach(addRoomType);if(!roomTypesNode.children.length)addRoomType();config.employees.forEach(employee=>{employeeConfigs[employee.employee_id]=employeeConfigs[employee.employee_id]||window.omgWorkConfig.normalizeReportConfig(employee.report_config,config.property);});const selected=select.value;select.replaceChildren();config.employees.forEach(employee=>select.add(new Option(employee.display_name,employee.employee_id)));if(config.employees.some(employee=>employee.employee_id===selected))select.value=selected;lodgingFields.hidden=config.property.business_type!=="lodging";render();}
document.getElementById("addRoomType").onclick=()=>addRoomType();document.querySelectorAll('input[name="businessType"]').forEach(input=>input.addEventListener("change",()=>{syncCurrent();config.property.business_type=selectedBusinessType();updateBusinessType();}));select.addEventListener("change",()=>{syncCurrent();activeReport="clock_in";render();});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;const loaded=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!loaded.can_manage){location.replace("app.html");return;}loadConfig(loaded);form.inert=false;window.omgTransition.ready();})().catch(error=>{message.className="message error";message.textContent=error.message;window.omgTransition.ready();});
form.addEventListener("submit",async event=>{event.preventDefault();syncCurrent();message.textContent="";const button=document.getElementById("saveButton");button.disabled=true;button.textContent="저장 중...";try{const businessType=selectedBusinessType(),roomTypes=businessType==="lodging"?parseRoomTypes():[];if(businessType==="lodging"&&!roomTypes.length)throw new Error("객실 타입과 객실번호를 한 개 이상 입력해주세요.");for(const item of Object.values(employeeConfigs)){for(const type of["clock_in","clock_out"]){const cards=item.reminder_cards.filter(card=>(card.report_types||[]).includes(type));if(item[type].includes("reminder_cards")&&!cards.length)throw new Error(`${type==="clock_in"?"출근":"퇴근"}보고 리마인더 카드를 한 개 이상 완성해주세요.`);}}config=await window.omgWorkConfig.save(session.accessToken,document.getElementById("propertyName").value.trim(),businessType,roomTypes,config.property.custom_report_fields,employeeConfigs);loadConfig(config);message.className="message ok";message.textContent="전체 설정이 저장되었습니다. 직원 화면에 바로 반영됩니다.";}catch(error){message.className="message error";message.textContent=error.message||"설정을 저장하지 못했습니다.";}finally{button.disabled=false;button.textContent="전체 설정 저장";}});
</script></body></html>
