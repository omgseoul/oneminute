<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>계정관리</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--red:#b83838}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.shell{width:min(100%,720px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.card h3{margin:17px 0 3px;color:var(--navy);font-size:15px}.help{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.55}.account-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid #edf1f6}.account-head{grid-column:1/-1;display:flex;align-items:center;gap:8px}.account-label{color:#64748b;font-size:12px;font-weight:900}.delete-account{min-height:26px;padding:3px 8px;border:1px solid #efcaca;border-radius:8px;background:#fff7f7;color:var(--red);font-size:10px;font-weight:900}.current{padding:3px 7px;border-radius:999px;background:#edf5ff;color:var(--blue);font-size:9px;font-weight:900}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font-size:14px}.schedule-row{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr .8fr;gap:7px}.time-field{display:grid;gap:4px}.time-field span{color:#7b889a;font-size:9px;font-weight:900}.scheduled-duration{display:grid;place-items:center;min-height:44px;margin-top:13px;border-radius:12px;background:#f1f6fc;color:var(--navy);font-size:12px;font-weight:900}.warning-list{display:grid;gap:10px;margin-top:12px}.warning-rule{padding:13px;border:1px solid #dce6f2;border-radius:16px;background:#f9fbfe}.warning-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.warning-head b{color:var(--navy);font-size:12px}.warning-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr .65fr;gap:6px}.warning-grid select,.warning-grid input{padding:10px 7px;font-size:12px}.warning-message{min-height:72px;margin-top:7px;resize:vertical}.small-btn{width:100%;min-height:41px;margin-top:12px;padding:8px 11px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:var(--navy);font-weight:900}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:430px){.account-row{grid-template-columns:1fr 1fr}.account-row input{padding:11px 9px;font-size:13px}.warning-grid{grid-template-columns:1fr 1fr}.schedule-row{gap:5px}}
</style></head><body><main class="shell"><a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>계정관리</h1><p>근무자와 관리자 계정을 만들고 이름과 PIN을 변경합니다.</p></header>
<form id="staffForm" inert>
<section class="card"><h2>근무자 계정</h2><p class="help">이름과 개인 PIN(숫자 6~8자리)을 입력합니다. 기존 PIN은 비워두면 유지됩니다.</p><div id="employeeAccounts"></div><button id="addEmployee" class="small-btn" type="button">+ 근무자 추가</button></section>
<section class="card"><h2>근태관리</h2><h3>근무시간 워닝</h3><p class="help">예정 출퇴근 시간보다 빠르거나 늦으면 해당 근무자에게 확인이 필요한 공지를 자동 발송합니다. 공지에는 {이름}, {예정시간}, {실제시간}, {차이분}을 사용할 수 있습니다.</p><div id="warningRules" class="warning-list"></div><button id="addWarning" class="small-btn" type="button">+ 워닝 조건 추가</button></section>
<section class="card"><h2>관리자 계정</h2><p class="help">관리자 로그인 화면에 표시할 계정명과 PIN(숫자 6~8자리)을 입력합니다.</p><div id="adminAccounts"></div><button id="addAdmin" class="small-btn" type="button">+ 관리자 추가</button></section>
<button id="saveButton" class="save" type="submit">계정 저장</button><div id="message" class="message" role="alert"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("staffForm"),employeesNode=document.getElementById("employeeAccounts"),adminsNode=document.getElementById("adminAccounts"),warningNode=document.getElementById("warningRules"),message=document.getElementById("message");let session=null,config=null,warningRules=[];
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function renumber(){[...employeesNode.children].forEach((row,index)=>row.querySelector(".account-label").textContent=`근무자 ${index+1}`);[...adminsNode.children].forEach((row,index)=>{const label=row.querySelector(".account-label");label.firstChild.textContent=`관리자 ${index+1} `;});}
function duration(row){const start=row.querySelector(".employee-clock-in").value,end=row.querySelector(".employee-clock-out").value,out=row.querySelector(".scheduled-duration");if(!start||!end){out.textContent="자동 -";return;}const[a,b]=start.split(":").map(Number),[c,d]=end.split(":").map(Number);let mins=c*60+d-(a*60+b);if(mins<=0)mins+=1440;out.textContent=`${Math.floor(mins/60)}시간 ${mins%60}분`;}
function employeeRow(employee=null){const row=document.createElement("div");row.className="account-row";row.dataset.employeeId=employee?.employee_id||"";row.innerHTML=`<div class="account-head"><span class="account-label">근무자</span><button class="delete-account" type="button">Delete</button></div><input class="account-name" type="text" maxlength="50" placeholder="근무자 이름" value="${esc(employee?.display_name||"")}"><input class="account-pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" placeholder="${employee?"PIN 변경 시 입력":"PIN 6~8자리"}"><div class="schedule-row"><label class="time-field"><span>출근시간</span><input class="employee-clock-in" type="time" value="${esc(employee?.scheduled_clock_in||"")}"></label><label class="time-field"><span>퇴근시간</span><input class="employee-clock-out" type="time" value="${esc(employee?.scheduled_clock_out||"")}"></label><span class="scheduled-duration">자동 -</span></div>`;row.querySelectorAll("input[type=time]").forEach(input=>input.oninput=()=>duration(row));duration(row);row.querySelector(".delete-account").onclick=async()=>{if(!employee){row.remove();renumber();return;}if(!confirm(`‘${employee.display_name}’ 근무자를 삭제할까요?`))return;try{config=await window.omgWorkConfig.deleteEmployee(session.accessToken,employee.employee_id);load(config);show("근무자가 삭제되었습니다.");}catch(error){show(error.message,false);}};employeesNode.append(row);renumber();}
function adminRow(admin=null){const row=document.createElement("div");row.className="account-row";row.dataset.ownerId=admin?.owner_id||"";row.innerHTML=`<div class="account-head"><span class="account-label">관리자 ${admin?.is_current?'<span class="current">현재 계정</span>':""}</span>${admin?.is_current?"":'<button class="delete-account" type="button">Delete</button>'}</div><input class="admin-name" type="text" maxlength="50" placeholder="관리자 계정명" value="${esc(admin?.login_id||admin?.display_name||"")}"><input class="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" maxlength="8" placeholder="${admin?"PIN 변경 시 입력":"PIN 6~8자리"}">`;row.querySelector(".delete-account")?.addEventListener("click",async()=>{if(!admin){row.remove();renumber();return;}if(!confirm(`‘${admin.display_name}’ 관리자 계정을 삭제할까요?`))return;try{config=await window.omgWorkConfig.deleteAdministrator(session.accessToken,admin.owner_id);load(config);show("관리자 계정이 삭제되었습니다.");}catch(error){show(error.message,false);}});adminsNode.append(row);renumber();}
function collect(node,type){return[...node.querySelectorAll(".account-row")].map(row=>type==="employee"?{employee_id:row.dataset.employeeId||null,display_name:row.querySelector(".account-name").value.trim(),pin:row.querySelector(".account-pin").value.trim(),scheduled_clock_in:row.querySelector(".employee-clock-in").value||null,scheduled_clock_out:row.querySelector(".employee-clock-out").value||null}:{owner_id:row.dataset.ownerId||null,display_name:row.querySelector(".admin-name").value.trim(),login_id:row.querySelector(".admin-name").value.trim(),pin:row.querySelector(".admin-pin").value.trim()}).filter(item=>item.display_name||item.pin);}
function validate(items,label,idKey){if(!items.length)throw new Error(`${label} 계정을 한 개 이상 등록해주세요.`);items.forEach(item=>{if(!item.display_name)throw new Error(`${label} 계정명을 입력해주세요.`);if(!item[idKey]&&!item.pin)throw new Error(`${item.display_name}의 PIN을 입력해주세요.`);if(item.pin&&!/^[0-9]{6,8}$/.test(item.pin))throw new Error(`${item.display_name}의 PIN은 숫자 6~8자리여야 합니다.`);});}
function warningRow(rule={}){const row=document.createElement("div");row.className="warning-rule";row.dataset.ruleId=rule.rule_id||"";const options=(config.employees||[]).map(e=>`<option value="${e.employee_id}" ${e.employee_id===rule.employee_id?"selected":""}>${esc(e.display_name)}</option>`).join("");row.innerHTML=`<div class="warning-head"><b>워닝 조건</b><button class="delete-account" type="button">삭제</button></div><div class="warning-grid"><select class="warning-employee"><option value="">근로자 선택</option>${options}</select><select class="warning-event"><option value="clock_in" ${rule.event_type!=="clock_out"?"selected":""}>출근시간</option><option value="clock_out" ${rule.event_type==="clock_out"?"selected":""}>퇴근시간</option></select><select class="warning-comparison"><option value="late" ${rule.comparison!=="early"?"selected":""}>늦으면</option><option value="early" ${rule.comparison==="early"?"selected":""}>빠르면</option></select><input class="warning-minutes" type="number" min="0" max="720" inputmode="numeric" value="${Number(rule.threshold_minutes??10)}" aria-label="분"><\/div><textarea class="warning-message" maxlength="1000" placeholder="발송할 공지 내용">${esc(rule.message||"{이름}님, 예정시간 {예정시간}보다 {차이분}분 차이가 있습니다. 확인해주세요.")}</textarea>`;row.querySelector(".delete-account").onclick=()=>row.remove();warningNode.append(row);}
function collectWarnings(){return[...warningNode.querySelectorAll(".warning-rule")].map(row=>({rule_id:row.dataset.ruleId||null,employee_id:row.querySelector(".warning-employee").value,event_type:row.querySelector(".warning-event").value,comparison:row.querySelector(".warning-comparison").value,threshold_minutes:Number(row.querySelector(".warning-minutes").value),message:row.querySelector(".warning-message").value.trim(),active:true}));}
function load(next){config=next;employeesNode.replaceChildren();adminsNode.replaceChildren();config.employees.forEach(employeeRow);(config.administrators||[]).forEach(adminRow);warningNode.replaceChildren();warningRules.forEach(warningRow);}
function show(text,ok=true){message.className=`message ${ok?"ok":"error"}`;message.textContent=text;}
document.getElementById("addEmployee").onclick=()=>employeeRow();document.getElementById("addAdmin").onclick=()=>adminRow();document.getElementById("addWarning").onclick=()=>warningRow();
form.addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveButton");button.disabled=true;message.textContent="";try{const employees=collect(employeesNode,"employee"),admins=collect(adminsNode,"admin");validate(employees,"근무자","employee_id");validate(admins,"관리자","owner_id");config=await window.omgWorkConfig.saveEmployees(session.accessToken,employees);config=await window.omgWorkConfig.saveAdministrators(session.accessToken,admins);const saved=await window.omgWorkConfig.saveAttendanceWarnings(session.accessToken,collectWarnings());warningRules=saved.rules||[];load(config);show("계정과 근태관리 설정이 저장되었습니다.");}catch(error){show(error.message||"계정을 저장하지 못했습니다.",false);}finally{button.disabled=false;}});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!config.can_manage){location.replace("app.html");return;}const warnings=await window.omgWorkConfig.loadAttendanceWarnings(session.accessToken);warningRules=warnings.rules||[];load(config);form.inert=false;window.omgTransition.ready();})().catch(error=>{show(error.message,false);window.omgTransition.ready();});
</script></body></html>
