<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이용권·용량 · OMS</title><link rel="stylesheet" href="service-access.css?v=20261012"><style>body{margin:0;background:#f4f7fc}a{color:#2467bd;text-decoration:none;font-size:11px}</style></head><body><main class="subscription-shell"><a href="app.html">← Home</a><h1>이용권·용량</h1><div id="subscriptionInfo"><p class="subscription-note">불러오는 중…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="service-access.js?v=20261012"></script><script>
(async()=>{const host=document.getElementById('subscriptionInfo'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const session=omgSession.get();if(!session&&!await omgAccount.require())return;const data=await OMSService.get(session?.accessToken);if(!data.can_manage){host.innerHTML='<p class="subscription-note">사업장 관리자에게 이용권을 문의해주세요.</p>';return;}const s=data.service,ends=s.ends_at?new Date(s.ends_at).toLocaleDateString('ko-KR'):'기한 없음';host.innerHTML=`<section class="subscription-card"><h2>${esc(s.property_name)}</h2><div class="subscription-row"><span>이용 상태</span><b>${s.exempt?'과금 면제':s.expired?'기간 종료':s.status==='trial'?'무료 체험':'정상 이용'}</b></div><div class="subscription-row"><span>종료일</span><b>${ends}</b></div><div class="subscription-row"><span>저장 사용량</span><b>${OMSService.formatBytes(s.used_bytes)} / ${OMSService.formatBytes(s.limit_bytes)}</b></div><p class="subscription-note">사진·메시지·보고·문서 기준 추정 사용량입니다.</p></section><section class="subscription-card"><h2>이용 가능한 요금제</h2>${data.plans.map(p=>`<div class="subscription-plan"><div><b>${esc(p.name)}</b><small>저장 용량 ${OMSService.formatBytes(p.storage_limit_bytes)}</small></div><span>${p.monthly_price==null?'요금 협의':Number(p.monthly_price).toLocaleString('ko-KR')+'원 / 월'}</span></div>`).join('')}<p class="subscription-note">자동결제 연동 전입니다. 구독·용량 변경은 문의 후 관리자가 이용권에 반영합니다.</p>${s.support_contact?`<p class="subscription-note">문의: ${esc(s.support_contact)}</p>`:''}</section>`;}catch(e){host.textContent=e.message;}})();
</script></body></html>
