<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>근무현황</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--green:#149461;--red:#ca4545}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body,button,input,select{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font-size:inherit}.shell{width:min(100%,820px);margin:auto;padding:22px 16px calc(42px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:17px 2px 19px}.head h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-.04em}.head p{margin:8px 0 0;color:var(--muted);font-size:13px}.toolbar,.panel{border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.toolbar{padding:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;border-radius:13px;background:#edf3fa}.tabs button{height:40px;border:0;border-radius:10px;background:transparent;color:#748399;font-weight:900}.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(42,78,120,.1)}.date-row{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;margin-top:12px}.date-row[hidden],.range-row[hidden]{display:none}.date-row button,.date-row input,.range-row input,select{height:42px;border:1px solid #cfdaea;border-radius:11px;background:#fff}.date-row button{color:var(--blue);font-size:22px;font-weight:900}.date-row input{min-width:0;padding:0 8px;text-align:center}.range-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin-top:12px}.range-row input{min-width:0;padding:0 7px;text-align:center}.range-row span{color:var(--muted);font-weight:900}.filter{display:grid;grid-template-columns:auto minmax(0,220px);align-items:center;justify-content:end;gap:9px;margin-top:11px}.filter[hidden]{display:none}.filter label{color:var(--muted);font-size:11px;font-weight:800}.filter select{width:100%;padding:0 10px}.period{margin:12px 2px 0;color:var(--muted);font-size:11px;text-align:center}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.metric{min-width:0;padding:14px 7px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:center}.metric strong{display:block;color:var(--navy);font-size:18px;line-height:1.15}.metric span{display:block;margin-top:6px;color:var(--muted);font-size:9px;font-weight:800}.panel{margin-top:14px;padding:18px}.panel h2{margin:0 0 15px;color:var(--navy);font-size:18px}.chart{display:grid;gap:13px}.bar-row{display:grid;grid-template-columns:72px 1fr 62px;align-items:center;gap:8px}.bar-name{overflow:hidden;color:#52637b;font-size:12px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:12px;border-radius:999px;background:#edf2f8;overflow:hidden}.bar{height:100%;min-width:0;border-radius:999px;background:linear-gradient(90deg,#66a8f0,var(--blue))}.bar-value{color:var(--navy);font-size:11px;font-weight:900;text-align:right}.empty{padding:30px 8px;color:#8b98a9;font-size:13px;text-align:center}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}.sheet{width:100%;min-width:650px;border-collapse:collapse}.sheet th,.sheet td{padding:11px 9px;border-right:1px solid #e9eef5;border-bottom:1px solid #e9eef5;font-size:11px;text-align:center;white-space:nowrap}.sheet th{background:#edf4fc;color:var(--navy);font-weight:900}.sheet tr:last-child td{border-bottom:0}.sheet th:last-child,.sheet td:last-child{border-right:0}.sheet td.name{font-weight:900}.sheet td.duration-cell{color:var(--navy);font-weight:900}.state{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f7;color:#68788d;font-size:9px;font-weight:900}.state.done{background:#e9f8f1;color:var(--green)}.state.open{background:#fff3e5;color:#a96000}.message{margin:18px 2px;color:var(--red);font-size:12px;text-align:center}.loading{opacity:.55;pointer-events:none}@media(max-width:520px){.summary{grid-template-columns:repeat(2,1fr)}.metric{padding:13px 6px}.bar-row{grid-template-columns:62px 1fr 58px}.panel{padding:16px 13px}.filter{grid-template-columns:auto 1fr}.head h1{font-size:29px}.range-row{gap:4px}.range-row input{font-size:12px}}
</style></head><body><main id="page" class="shell loading"><a class="back" href="app.html">‹ 메인으로</a><header class="head"><h1 id="pageTitle">근무현황</h1><p id="pageIntro">나의 출퇴근 기록과 실제 근무시간을 확인합니다.</p></header>
<section class="toolbar"><div class="tabs" aria-label="조회 단위"><button class="on" type="button" data-period="day">당일</button><button type="button" data-period="month">월간</button><button type="button" data-period="custom">기간</button></div><div id="dateRow" class="date-row"><button id="prev" type="button" aria-label="이전 기간">‹</button><input id="anchorDate" type="date"><button id="next" type="button" aria-label="다음 기간">›</button></div><div id="rangeRow" class="range-row" hidden><input id="rangeStart" type="date" aria-label="시작일"><span>~</span><input id="rangeEnd" type="date" aria-label="종료일"></div><div class="filter"><label for="employeeFilter">근무자</label><select id="employeeFilter"><option value="">All</option></select></div><p id="periodLabel" class="period"></p></section>
<section class="summary"><div class="metric"><strong id="totalTime">0분</strong><span>총 근무시간</span></div><div class="metric"><strong id="sessionCount">0회</strong><span>완료 근무</span></div><div class="metric"><strong id="averageTime">0분</strong><span>평균 근무시간</span></div><div class="metric"><strong id="openCount">0건</strong><span>진행·미기록</span></div></section>
<section class="panel"><h2>근무시간 현황</h2><div id="chart" class="chart"></div></section>
<section class="panel"><h2>출퇴근 기록표</h2><div class="table-wrap"><table class="sheet"><thead><tr><th>날짜</th><th>근무자</th><th>근무시간</th><th>출근</th><th>퇴근</th><th>상태</th></tr></thead><tbody id="sheetBody"></tbody></table></div></section><p id="message" class="message" role="alert"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const page=document.getElementById("page"),anchor=document.getElementById("anchorDate"),dateRow=document.getElementById("dateRow"),rangeRow=document.getElementById("rangeRow"),rangeStart=document.getElementById("rangeStart"),rangeEnd=document.getElementById("rangeEnd"),filter=document.getElementById("employeeFilter"),filterRow=filter.closest(".filter"),message=document.getElementById("message");let session=null,isOwner=false,period="day",payload={sessions:[],employees:[],timezone:"Asia/Seoul"};
function isoDate(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;}
function parseDate(value){const[y,m,d]=value.split("-").map(Number);return new Date(y,m-1,d);}
function range(){if(period==="custom"){const from=rangeStart.value,to=rangeEnd.value;return{from,to,start:parseDate(from),end:parseDate(to)};}const base=parseDate(anchor.value),start=new Date(base),end=new Date(base);if(period==="month"){start.setDate(1);end.setTime(start.getTime());end.setMonth(end.getMonth()+1,0);}return{from:isoDate(start),to:isoDate(end),start,end};}
function shortDate(value){const date=parseDate(value);return`${date.getMonth()+1}.${date.getDate()}`;}
function time(value){if(!value)return"-";return new Intl.DateTimeFormat("ko-KR",{timeZone:payload.timezone,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));}
function duration(minutes){if(minutes==null)return"-";const h=Math.floor(minutes/60),m=minutes%60;return h?`${h}시간${m?` ${m}분`:""}`:`${m}분`;}
function periodText(r){if(r.from===r.to)return r.from;return`${r.from} ~ ${r.to}`;}
function render(){const selected=filter.value,items=(payload.sessions||[]).filter(item=>!selected||item.employee_id===selected),completed=items.filter(item=>item.duration_minutes!=null),total=completed.reduce((sum,item)=>sum+Number(item.duration_minutes),0),open=items.length-completed.length;document.getElementById("totalTime").textContent=duration(total);document.getElementById("sessionCount").textContent=`${completed.length}회`;document.getElementById("averageTime").textContent=duration(completed.length?Math.round(total/completed.length):0);document.getElementById("openCount").textContent=`${open}건`;
const sums=new Map();completed.forEach(item=>sums.set(item.employee_name,(sums.get(item.employee_name)||0)+Number(item.duration_minutes)));const values=[...sums.entries()].sort((a,b)=>b[1]-a[1]),max=Math.max(1,...values.map(item=>item[1]));document.getElementById("chart").innerHTML=values.length?values.map(([name,value])=>`<div class="bar-row"><span class="bar-name">${escapeHtml(name)}</span><span class="bar-track"><span class="bar" style="display:block;width:${Math.max(3,value/max*100)}%"></span></span><span class="bar-value">${duration(value)}</span></div>`).join(""):'<div class="empty">선택한 기간의 완료된 근무가 없습니다.</div>';
document.getElementById("sheetBody").innerHTML=items.length?items.map(item=>`<tr><td>${shortDate(item.work_date)}</td><td class="name">${escapeHtml(item.employee_name)}</td><td class="duration-cell">${duration(item.duration_minutes)}</td><td>${time(item.clock_in_at)}</td><td>${time(item.clock_out_at)}</td><td><span class="state ${item.duration_minutes!=null?"done":"open"}">${item.duration_minutes!=null?"완료":item.status==="working"?"근무 중":"확인 필요"}</span></td></tr>`).join(""):'<tr><td colspan="6" class="empty">해당 기간의 출퇴근 기록이 없습니다.</td></tr>';}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
async function load(){page.classList.add("loading");message.textContent="";const r=range();document.getElementById("periodLabel").textContent=periodText(r);try{const{data,error}=await window.omgSupabase.rpc("list_attendance_statistics",{p_access_token:session.accessToken,p_from_date:r.from,p_to_date:r.to});if(error||!data?.ok)throw new Error(data?.message||"근무 기록을 불러오지 못했습니다.");payload=data;const selected=filter.value;filter.replaceChildren(new Option("All",""));(payload.employees||[]).forEach(employee=>filter.add(new Option(employee.display_name,employee.employee_id)));if([...filter.options].some(option=>option.value===selected))filter.value=selected;if(!isOwner)filter.value=session.employeeId||"";render();}catch(error){message.textContent=error.message;}finally{page.classList.remove("loading");}}
function updateDateControls(){const custom=period==="custom";dateRow.hidden=custom;rangeRow.hidden=!custom;if(period==="month"){const date=parseDate(anchor.value);date.setDate(1);anchor.value=isoDate(date);}if(custom){rangeStart.value=rangeStart.value||anchor.value;rangeEnd.value=rangeEnd.value||anchor.value;}}
document.querySelectorAll("[data-period]").forEach(button=>button.onclick=()=>{const next=button.dataset.period;if(next==="custom"&&period!=="custom")rangeStart.value=rangeEnd.value=anchor.value;period=next;document.querySelectorAll("[data-period]").forEach(item=>item.classList.toggle("on",item===button));updateDateControls();load();});anchor.onchange=()=>{if(period==="month"){const date=parseDate(anchor.value);date.setDate(1);anchor.value=isoDate(date);}load();};function loadRange(){if(!rangeStart.value||!rangeEnd.value)return;if(rangeStart.value>rangeEnd.value)rangeEnd.value=rangeStart.value;load();}rangeStart.onchange=loadRange;rangeEnd.onchange=()=>{if(rangeStart.value&&rangeEnd.value<rangeStart.value)rangeStart.value=rangeEnd.value;loadRange();};filter.onchange=render;function move(direction){const date=parseDate(anchor.value);if(period==="day")date.setDate(date.getDate()+direction);else{date.setDate(1);date.setMonth(date.getMonth()+direction);}anchor.value=isoDate(date);load();}document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;const config=await window.omgWorkConfig.load(session.accessToken);isOwner=session.sessionKind==="owner"&&config.can_manage;if(isOwner){document.getElementById("pageTitle").textContent="근무시간 관리";document.getElementById("pageIntro").textContent="직원별 출퇴근 기록과 실제 근무시간을 확인합니다.";document.title="근무시간 관리";}else{filterRow.hidden=true;document.title="근무현황";}anchor.value=rangeStart.value=rangeEnd.value=isoDate(new Date());updateDateControls();await load();})().catch(error=>{message.textContent=error.message;page.classList.remove("loading");});
</script></body></html>
