<!doctype html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Routine manager · OMS</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js?v=20260929-chat-taps"></script><script src="settings-layout.js"></script><link rel="stylesheet" href="action-dialog.css"><link rel="stylesheet" href="task-manager.css?v=20261026-routines"></head>
<body><main class="shell">
<div class="top"><a class="back" href="mission.html">‹ To do list</a><div id="branchFilter"></div></div>
<header><div><h1>Routine manager</h1><p>반복되는 업무를 루틴으로 관리하세요.</p></div><button id="addTask" class="add" aria-label="루틴 추가" disabled>＋</button></header>
<nav class="views" aria-label="루틴 보기"><button id="listView" aria-pressed="true">리스트형</button><button id="calendarView" aria-pressed="false">캘린더</button></nav>
<p id="status" role="status">루틴을 불러오는 중입니다.</p>
<section id="listPanel" aria-label="반복 루틴 목록"><div class="table-head"><span>제목</span><span>시작일</span><span>반복주기</span><span>대상</span><span>대상지점</span><span></span></div><div id="taskList"></div></section>
<section id="calendarPanel" hidden><div class="month-nav"><button id="prevMonth" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" aria-label="다음 달">›</button><button id="thisMonth">오늘</button></div><div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div><p class="help">등록한 반복 루틴만 표시됩니다. 날짜를 누르면 전체 내용을 볼 수 있습니다.</p></section>
</main>
<dialog id="editor"><form id="taskForm"><div class="sheet-top"><h2 id="editorTitle">루틴 추가</h2><button type="button" class="close" data-close="editor" aria-label="닫기">×</button></div>
<label for="taskTitle">제목</label><input id="taskTitle" maxlength="100" placeholder="예: 바퀴벌레약 교체하기" required>
<label for="taskDescription">상세 내용</label><div class="description-wrap"><textarea id="taskDescription" maxlength="2000" rows="3" placeholder="작업 방법이나 확인할 내용을 입력하세요."></textarea><button id="descriptionCamera" class="camera-button" type="button" aria-label="상세 내용 사진 첨부">📷</button><input id="descriptionPhotoInput" type="file" accept="image/*" hidden></div><div id="descriptionPhotoPreview" class="routine-photo-preview" hidden><img id="descriptionPhotoImage" alt="상세 내용 첨부 사진"><button id="removeDescriptionPhoto" class="photo-remove" type="button" aria-label="첨부 사진 삭제">×</button></div>
<div class="form-grid"><div><label>대상지점</label><div id="taskBranchPicker"></div></div><div><label for="targetMode">대상</label><select id="targetMode"><option value="all">지점 전체 근무자</option><option value="selected">근무자 선택</option><option value="working">근무중인 근무자(최초1회발송)</option></select></div></div>
<fieldset id="workerChoices" hidden><legend>해당 지점 근무자</legend><div id="workers"></div></fieldset><p id="targetHelp" class="help"></p>
<div class="execution-grid"><div><label for="startDate">실행 시작일</label><input type="date" id="startDate" required></div><div id="runTimeField"><label class="choice-label"><input type="checkbox" name="executionMode" value="time" checked>실행시간</label><input type="time" id="runTime" value="09:00" aria-label="실행시간" required></div><div><label class="choice-label"><input type="checkbox" name="executionMode" value="checkin">근무자 출근시</label><p class="execution-caption">출근보고 완료 기준</p></div></div>
<fieldset class="repeat-options"><legend>반복주기</legend><div class="repeat-choices"><label class="choice-label"><input type="checkbox" name="repeatMode" value="day" checked>일 (간격)</label><label class="choice-label"><input type="checkbox" name="repeatMode" value="week">요일 (매주)</label><label class="choice-label"><input type="checkbox" name="repeatMode" value="month">날짜 (매월)</label></div>
<div id="repeatDayPanel" class="repeat-panel"><div class="interval-control"><button type="button" id="intervalMinus" aria-label="일 간격 줄이기">−</button><input type="number" id="repeatEvery" min="1" max="365" value="1" required aria-label="반복 일 간격"><button type="button" id="intervalPlus" aria-label="일 간격 늘리기">+</button></div><span>일 마다</span></div>
<div id="repeatWeekPanel" class="repeat-panel" hidden><div id="repeatWeekdays" class="weekday-choices" aria-label="반복 요일"></div></div>
<div id="repeatMonthPanel" class="repeat-panel" hidden><span>매월</span><select id="repeatMonthDay" aria-label="반복 날짜"></select><span>반복</span></div>
<p id="repeatHint" class="help"></p><p id="repeatPreview" class="repeat-preview" aria-live="polite"></p></fieldset>
<label class="check"><input type="checkbox" id="photoRequired"> 완료 결과에 사진 필수</label><label class="check"><input type="checkbox" id="taskEnabled" checked> 반복 실행 사용</label>
<p class="help">실행 시 To do를 자동 생성합니다. 수정·중지·종료는 이후 실행에 적용되며, 이미 생성된 To do는 유지됩니다.</p>
<p id="formError" class="error" role="alert"></p><button id="saveTask" type="submit" class="primary">루틴 저장</button></form></dialog>
<dialog id="dayDialog"><div class="sheet-top"><h2 id="dayTitle"></h2><button class="close" data-close="dayDialog" aria-label="닫기">×</button></div><div id="dayTasks"></div></dialog>
<dialog id="confirmDialog" class="oms-action-dialog"><div class="oms-action-head"><h2 id="confirmTitle"></h2></div><p id="confirmText"></p><div class="oms-action-buttons"><button id="confirmNo">취소</button><button id="confirmYes" class="primary">확인</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="property-selector.js?v=20261005e"></script><script src="photo-codec.js?v=20261013-video-20mb"></script><script src="task-recurrence.js?v=20261026-routines"></script><script src="task-manager.js?v=20261026-routines"></script></body></html>
