<style>

</style></head><body><main id="page" class="shell loading"><a class="back" href="app.html">‹ 메인으로</a><header class="head"><h1 id="pageTitle">근무현황</h1><p id="pageIntro">나의 출퇴근 기록과 실제 근무시간을 확인합니다.</p></header>
<section class="toolbar"><div class="tabs" aria-label="조회 단위"><button class="on" type="button" data-period="day">당일</button><button type="button" data-period="month">월간</button><button type="button" data-period="custom">기간</button></div><div id="dateRow" class="date-row"><button id="prev" type="button" aria-label="이전 기간">‹</button><input id="anchorDate" type="date"><button id="next" type="button" aria-label="다음 기간">›</button></div><div id="rangeRow" class="range-row" hidden><input id="rangeStart" type="date" aria-label="시작일"><span>~</span><input id="rangeEnd" type="date" aria-label="종료일"></div><div class="filter"><label for="employeeFilter">근무자</label><select id="employeeFilter"><option value="">All</option></select></div><p id="periodLabel" class="period"></p></section>

<section class="panel"><h2>근무시간 현황</h2><div id="chart" class="chart"></div></section>

<div id="editOverlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="dialog-top"><h2 id="editTitle">출퇴근 시간 수정</h2><button id="closeEdit" class="close" type="button">×</button></div><p id="editMeta" class="edit-meta"></p><div class="time-grid"><label>근무 시작시간<input id="editStart" type="time" required></label><label>근무 종료시간<input id="editEnd" type="time" required></label></div><button id="submitEdit" class="submit-edit" type="button">수정완료</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script><script src="property-selector.js"></script>
<script>
const page=document.getElementById("page"),anchor=document.getElementById("anchorDate"),dateRow=document.getElementById("dateRow"),rangeRow=document.getElementById("rangeRow"),rangeStart=document.getElementById("rangeStart"),rangeEnd=document.getElementById("rangeEnd"),filter=document.getElementById("employeeFilter"),filterRow=filter.closest(".filter"),message=document.getElementById("message"),editOverlay=document.getElementById("editOverlay");let session=null,isOwner=false,ownPropertyId=null,period="month",missingOnly=false,editingItem=null,selectedPropertyIds=null,payload={sessions:[],employees:[],timezone:"Asia/Seoul"};
document.querySelectorAll("[data-period]").forEach(item=>item.classList.toggle("on",item.dataset.period==="month"));
function isoDate(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;}
function parseDate(value){const[y,m,d]=value.split("-").map(Number);return new Date(y,m-1,d);}
function range(){if(period==="custom"){const from=rangeStart.value,to=rangeEnd.value;return{from,to,start:parseDate(from),end:parseDate(to)};}const base=parseDate(anchor.value),start=new Date(base),end=new Date(base);if(period==="month"){start.setDate(1);end.setTime(start.getTime());end.setMonth(end.getMonth()+1,0);}return{from:isoDate(start),to:isoDate(end),start,end};}

function duration(minutes){if(minutes==null)return"-";const h=Math.floor(minutes/60),m=minutes%60;return h?`${h}시간${m?` ${m}분`:""}`:`${m}분`;}
function periodText(r){if(r.from===r.to)return r.from;return`${r.from} ~ ${r.to}`;}

function timeValue(value){if(!value)return"";return new Intl.DateTimeFormat("en-GB",{timeZone:payload.timezone,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));}
async function pushApprovalMessage(messageId){if(!messageId)return;try{await fetch("https://asia-northeast3-guesthouse-manager-ajh.cloudfunctions.net/appUrgent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:session.accessToken,message_id:messageId})});}catch(_){}}
function editState(item){if(isOwner)return{label:"수정",disabled:false};if(item.adjustment_status==="pending")return{label:"결재중",disabled:true};if(item.adjustment_status==="approved")return{label:"수정완료",disabled:true};return{label:"수정",disabled:false};}
function canEditAttendance(item){return !isOwner||!item.property_id||item.property_id===ownPropertyId;}
function render(){const selected=filter.value,allItems=(payload.sessions||[]).filter(item=>!selected||item.employee_id===selected),missing=allItems.filter(isMissing),items=missingOnly?missing:allItems,completed=allItems.filter(item=>item.duration_minutes!=null),total=completed.reduce((sum,item)=>sum+Number(item.duration_minutes),0);document.getElementById("totalTime").textContent=duration(total);document.getElementById("sessionCount").textContent=`${completed.length}회`;document.getElementById("averageTime").textContent=duration(completed.length?Math.round(total/completed.length):0);document.getElementById("openCount").textContent=`${missing.length}건`;document.getElementById("missingMetric").disabled=!missing.length;document.getElementById("recordTitle").textContent=missingOnly?"미기록 출퇴근 내역":isOwner?"출퇴근 기록표":"근무내역";
const sums=new Map();completed.forEach(item=>{const key=item.employee_id||item.employee_name,entry=sums.get(key)||{employeeId:item.employee_id,name:item.employee_name,value:0};entry.value+=Number(item.duration_minutes);sums.set(key,entry);});const values=[...sums.values()].sort((a,b)=>b.value-a.value),max=Math.max(1,...values.map(item=>item.value));document.getElementById("chart").innerHTML=values.length?values.map(item=>`<div class="bar-row"><button class="bar-name ${isOwner?"":"static"}" type="button" data-employee-id="${escapeHtml(item.employeeId||"")}" ${isOwner&&item.employeeId?"":"disabled"} aria-label="${escapeHtml(item.name)} 근무내역 보기">${escapeHtml(item.name)}</button><span class="bar-track"><span class="bar" style="display:block;width:${Math.max(3,item.value/max*100)}%"></span></span><span class="bar-value">${duration(item.value)}</span></div>`).join(""):'<div class="empty">선택한 기간의 완료된 근무가 없습니다.</div>';
document.getElementById("sheetBody").innerHTML=items.length?items.map(item=>{const edit=editState(item),state=item.duration_minutes!=null?"완료":isMissing(item)?"미기록":"근무 중",editable=canEditAttendance(item);return`<tr><td>${shortDate(item.work_date)}</td><td class="name">${escapeHtml(item.employee_name)}</td><td class="duration-cell">${duration(item.duration_minutes)}</td><td>${time(item.clock_in_at)}</td><td>${time(item.clock_out_at)}</td><td><span class="state ${item.duration_minutes!=null?"done":"open"}">${state}</span></td><td>${editable?`<button class="edit-btn" data-session-id="${item.session_id}" type="button" ${edit.disabled?"disabled":""}>${edit.label}</button>`:"-"}</td></tr>`;}).join(""):'<tr><td colspan="7" class="empty">해당 기간의 출퇴근 기록이 없습니다.</td></tr>';document.querySelectorAll(".bar-name:not(:disabled)").forEach(button=>button.onclick=()=>{filter.value=filter.value===button.dataset.employeeId?"":button.dataset.employeeId;missingOnly=false;render();document.getElementById("recordTitle").scrollIntoView({behavior:"smooth",block:"start"});});document.querySelectorAll(".edit-btn:not(:disabled)").forEach(button=>button.onclick=()=>openEdit(allItems.find(item=>item.session_id===button.dataset.sessionId)));}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
async function load(){page.classList.add("loading");message.textContent="";const r=range();document.getElementById("periodLabel").textContent=periodText(r);try{const name=isOwner?"list_shared_attendance_statistics":"list_attendance_statistics",args={p_access_token:session.accessToken,p_from_date:r.from,p_to_date:r.to};if(isOwner)args.p_property_ids=selectedPropertyIds;const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"근무 기록을 불러오지 못했습니다.");payload=data;const many=new Set((payload.sessions||[]).map(x=>x.property_id).filter(Boolean)).size>1;(payload.sessions||[]).forEach(item=>{if(many&&item.property_name)item.employee_name=`${item.employee_name} · ${item.property_name}`;});const selected=filter.value;filter.replaceChildren(new Option("All",""));(payload.employees||[]).forEach(employee=>filter.add(new Option(many&&employee.property_name?`${employee.display_name} · ${employee.property_name}`:employee.display_name,employee.employee_id)));if([...filter.options].some(option=>option.value===selected))filter.value=selected;if(!isOwner)filter.value=session.employeeId||"";render();}catch(error){message.textContent=error.message;}finally{page.classList.remove("loading");}}
function updateDateControls(){const custom=period==="custom";dateRow.hidden=custom;rangeRow.hidden=!custom;if(period==="month"){const date=parseDate(anchor.value);date.setDate(1);anchor.value=isoDate(date);}if(custom){rangeStart.value=rangeStart.value||anchor.value;rangeEnd.value=rangeEnd.value||anchor.value;}}
document.querySelectorAll("[data-period]").forEach(button=>button.onclick=()=>{const next=button.dataset.period;if(next==="custom"&&period!=="custom")rangeStart.value=rangeEnd.value=anchor.value;period=next;missingOnly=false;document.querySelectorAll("[data-period]").forEach(item=>item.classList.toggle("on",item===button));updateDateControls();load();});anchor.onchange=()=>{if(period==="month"){const date=parseDate(anchor.value);date.setDate(1);anchor.value=isoDate(date);}missingOnly=false;load();};function loadRange(){if(!rangeStart.value||!rangeEnd.value)return;if(rangeStart.value>rangeEnd.value)rangeEnd.value=rangeStart.value;missingOnly=false;load();}rangeStart.onchange=loadRange;rangeEnd.onchange=()=>{if(rangeStart.value&&rangeEnd.value<rangeStart.value)rangeStart.value=rangeEnd.value;loadRange();};filter.onchange=()=>{missingOnly=false;render();};function move(direction){const date=parseDate(anchor.value);if(period==="day")date.setDate(date.getDate()+direction);else{date.setDate(1);date.setMonth(date.getMonth()+direction);}anchor.value=isoDate(date);missingOnly=false;load();}document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);
document.getElementById("missingMetric").onclick=()=>{missingOnly=!missingOnly;render();document.getElementById("recordTitle").scrollIntoView({behavior:"smooth",block:"start"});};
function openEdit(item){if(!item)return;editingItem=item;document.getElementById("editMeta").textContent=`${item.work_date} · ${item.employee_name}`;document.getElementById("editStart").value=timeValue(item.clock_in_at);document.getElementById("editEnd").value=timeValue(item.clock_out_at);editOverlay.hidden=false;}
function closeEdit(){editOverlay.hidden=true;editingItem=null;}document.getElementById("closeEdit").onclick=closeEdit;editOverlay.onclick=event=>{if(event.target===editOverlay)closeEdit();};
document.getElementById("submitEdit").onclick=async()=>{if(!editingItem)return;const start=document.getElementById("editStart").value,end=document.getElementById("editEnd").value,button=document.getElementById("submitEdit");if(!start||!end){message.textContent="근무 시작시간과 종료시간을 모두 입력해주세요.";return;}button.disabled=true;try{const rpcName=isOwner?"owner_update_attendance":"request_attendance_adjustment",args={p_access_token:session.accessToken,p_work_session_id:editingItem.session_id,p_clock_in_time:start,p_clock_out_time:end};const{data,error}=await window.omgSupabase.rpc(rpcName,args);if(error||!data?.ok)throw new Error(data?.message||(isOwner?"근무시간을 수정하지 못했습니다.":"수정 요청을 보내지 못했습니다."));if(!isOwner)pushApprovalMessage(data.message_id);closeEdit();message.textContent=isOwner?"근무시간을 수정했습니다.":"수정 요청을 보냈습니다.";await load();}catch(error){message.textContent=error.message;}finally{button.disabled=false;}};
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;const config=await window.omgWorkConfig.load(session.accessToken);isOwner=session.sessionKind==="owner"&&config.can_manage;ownPropertyId=config.property.property_id;const today=new Date();anchor.value=rangeEnd.value=isoDate(today);document.querySelectorAll("[data-period]").forEach(item=>item.classList.toggle("on",item.dataset.period==="month"));if(isOwner){document.getElementById("pageTitle").textContent="근무시간 관리";document.getElementById("pageIntro").textContent="직원별 출퇴근 기록과 실제 근무시간을 확인합니다.";document.title="근무시간 관리";rangeStart.value=anchor.value;await window.omgPropertySelector.mount({accessToken:session.accessToken,permission:"attendance",host:document.querySelector(".head"),onChange:async ids=>{selectedPropertyIds=ids;await load();}}).then(control=>{selectedPropertyIds=control.selectedIds();});}else{filterRow.hidden=true;document.title="근무현황";rangeStart.value=anchor.value;}updateDateControls();await load();window.omgTransition.ready();})().catch(error=>{message.textContent=error.message;page.classList.remove("loading");window.omgTransition.ready();});
</script></body></html>
