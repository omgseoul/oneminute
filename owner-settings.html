<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Property 설정</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,680px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-.045em}.head p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}.card h2{margin:0 0 6px;color:var(--navy);font-size:19px}.help{margin:0 0 15px;color:var(--muted);font-size:11px;line-height:1.55}label.title{display:block;margin:15px 0 7px;color:var(--navy);font-size:13px;font-weight:900}input[type=text],textarea,select{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:13px;background:#fff;color:var(--ink);font:15px/1.5 inherit}textarea{min-height:130px;resize:vertical}.employee-panel{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fbfcfe}.employee-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.employee-name{color:var(--navy);font-size:17px;font-weight:900}.role{padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:900}.group-title{margin:16px 0 8px;color:#586b84;font-size:12px;font-weight:900}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{position:relative}.check input{position:absolute;opacity:0}.check label{display:flex;align-items:center;min-height:45px;padding:10px 11px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:#607087;font-size:12px;font-weight:800;cursor:pointer}.check input:checked+label{border-color:var(--blue);background:var(--soft);color:var(--navy)}.reminder{margin-top:18px;padding-top:18px;border-top:2px solid #e8eef7}.reminder-switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card-editor{margin-top:12px;padding:13px;border:1px solid #dae5f2;border-radius:14px;background:#fff}.card-row{display:grid;grid-template-columns:86px 1fr;gap:12px}.preview{width:86px;height:108px;object-fit:cover;border-radius:11px;background:#eef4fb}.editor-actions{display:flex;gap:8px;margin-top:9px}.small-btn{min-height:38px;padding:8px 11px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;color:var(--navy);font-weight:800}.remove{color:#b83838}.add{width:100%;margin-top:12px}.save{width:100%;height:57px;margin-top:18px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.save:disabled{opacity:.55}.message{min-height:22px;margin-top:12px;font-size:12px;text-align:center}.message.ok{color:#16834b}.message.error{color:#c33}@media(max-width:430px){.checks{grid-template-columns:1fr}.card-row{grid-template-columns:72px 1fr}.preview{width:72px;height:96px}}
</style></head><body><main class="shell">
<a class="back" href="app.html">‹ 메인으로</a>
<header class="head"><h1>Property 설정</h1><p>숙소명과 객실을 등록하고, 선택한 근무자의 출근·퇴근 보고 항목을 설정합니다.</p></header>
<form id="settingsForm" inert>
<section class="card"><h2>숙소 기본정보</h2><p class="help">숙소명은 직원 메인화면의 제목으로 표시됩니다.</p><label class="title" for="propertyName">숙소명</label><input id="propertyName" type="text" maxlength="80" required><label class="title" for="rooms">객실명</label><textarea id="rooms" placeholder="객실명을 한 줄에 하나씩 입력하세요.&#10;예:&#10;101&#10;102&#10;103" required></textarea><p id="roomCount" class="help">총 0개 객실</p></section>
<section class="card"><h2>근무자별 보고 항목</h2><p class="help">근무자 한 명을 선택하면 그 직원의 설정만 아래에 표시됩니다.</p><label class="title" for="employeeSelect">근무자 선택</label><select id="employeeSelect"></select><div id="employeePanel" class="employee-panel"></div></section>
<button id="saveButton" class="save" type="submit">설정 저장</button><div id="message" class="message" role="alert"></div>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script>
<script>
const form=document.getElementById("settingsForm"),panel=document.getElementById("employeePanel"),select=document.getElementById("employeeSelect"),message=document.getElementById("message");let session=null,config=null,employeeConfigs={};
function parseRooms(){return[...new Set(document.getElementById("rooms").value.split(/[\n,]+/).map(room=>room.trim()).filter(Boolean))];}function updateRoomCount(){document.getElementById("roomCount").textContent=`총 ${parseRooms().length}개 객실`;}function roleName(role){return role==="manager"?"매니저":"직원";}function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("사진을 읽지 못했습니다."));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error("사진 형식을 확인해주세요."));image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78));};image.src=reader.result;};reader.readAsDataURL(file);});}
function syncCurrent(){const id=panel.dataset.employeeId;if(!id||!employeeConfigs[id])return;const current=employeeConfigs[id];current.clock_in=[...panel.querySelectorAll('input[data-type="clock_in"]:checked')].map(i=>i.value);current.clock_out=[...panel.querySelectorAll('input[data-type="clock_out"]:checked')].map(i=>i.value);current.reminder_cards=[...panel.querySelectorAll(".card-editor")].map(row=>({id:row.dataset.cardId,title:row.querySelector(".card-title").value.trim(),image:row.querySelector(".preview").getAttribute("src"),text:row.querySelector(".card-text").value.trim()})).filter(card=>card.title&&card.image&&card.text);}
function makeCheck(type,key,label,selected){const id=`${select.value}-${type}-${key}`;return`<span class="check"><input id="${id}" type="checkbox" data-type="${type}" value="${key}" ${selected.includes(key)?"checked":""}><label for="${id}">${label}</label></span>`;}
function cardEditor(card,index){return`<div class="card-editor" data-card-id="${esc(card.id||`card-${Date.now()}-${index}`)}"><div class="card-row"><img class="preview" src="${esc(card.image)}" alt="카드 사진"><div><input class="card-title" type="text" maxlength="50" value="${esc(card.title)}" placeholder="카드 제목"><label class="title">뒷면 안내문</label><textarea class="card-text" maxlength="1000" placeholder="사진 뒷면에 표시할 내용을 입력하세요.">${esc(card.text)}</textarea></div></div><div class="editor-actions"><label class="small-btn">사진 변경<input class="image-input" type="file" accept="image/*" hidden></label><button class="small-btn remove" type="button">카드 삭제</button></div></div>`;}
function render(){syncCurrent();const employee=config.employees.find(item=>item.employee_id===select.value);if(!employee){panel.innerHTML="";return;}const saved=employeeConfigs[employee.employee_id];panel.dataset.employeeId=employee.employee_id;panel.innerHTML=`<div class="employee-head"><span class="employee-name">${esc(employee.display_name)}</span><span class="role">${roleName(employee.role)}</span></div>`;for(const type of["clock_in","clock_out"]){panel.insertAdjacentHTML("beforeend",`<div class="group-title">${type==="clock_in"?"출근보고":"퇴근보고"}</div><div class="checks">${window.omgWorkConfig.fieldGroups[type].map(field=>makeCheck(type,field.key,field.label,saved[type])).join("")}</div>`);}panel.insertAdjacentHTML("beforeend",`<div class="reminder"><div class="group-title">리마인더 카드</div><p class="help">사진을 누르면 안내문이 뒤집혀 보입니다. 보고 제출 전 직원이 “이해했음”을 눌러야 합니다.</p><div class="reminder-switches">${makeCheck("clock_in","reminder_cards","출근보고에 표시",saved.clock_in)}${makeCheck("clock_out","reminder_cards","퇴근보고에 표시",saved.clock_out)}</div><div id="cardEditors">${saved.reminder_cards.map(cardEditor).join("")}</div><button id="addCard" class="small-btn add" type="button">+ 리마인더 카드 추가</button></div>`);panel.querySelectorAll(".image-input").forEach(bindImage);panel.querySelectorAll(".remove").forEach(button=>button.addEventListener("click",()=>{button.closest(".card-editor").remove();syncCurrent();}));document.getElementById("addCard").addEventListener("click",()=>{if(panel.querySelectorAll(".card-editor").length>=6){alert("리마인더 카드는 최대 6개까지 만들 수 있습니다.");return;}document.getElementById("cardEditors").insertAdjacentHTML("beforeend",cardEditor({id:`card-${Date.now()}`,title:"",image:"shiba-worker-logo-v2.png",text:""},Date.now()));const row=document.getElementById("cardEditors").lastElementChild;bindImage(row.querySelector(".image-input"));row.querySelector(".remove").addEventListener("click",()=>row.remove());});}
function bindImage(input){input.addEventListener("change",async()=>{if(!input.files[0])return;try{input.closest(".card-editor").querySelector(".preview").src=await fileToDataUrl(input.files[0]);}catch(error){alert(error.message);}input.value="";});}
document.getElementById("rooms").addEventListener("input",updateRoomCount);select.addEventListener("change",render);
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);if(session.sessionKind!=="owner"||!config.can_manage){location.replace("app.html");return;}document.getElementById("propertyName").value=config.property.name;document.getElementById("rooms").value=(config.property.rooms||[]).join("\n");updateRoomCount();config.employees.forEach(employee=>{employeeConfigs[employee.employee_id]=window.omgWorkConfig.normalizeReportConfig(employee.report_config);select.add(new Option(employee.display_name,employee.employee_id));});render();form.inert=false;})().catch(error=>{message.className="message error";message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();syncCurrent();message.textContent="";const button=document.getElementById("saveButton");button.disabled=true;button.textContent="저장 중...";try{const rooms=parseRooms();if(!rooms.length)throw new Error("객실명을 한 개 이상 입력해주세요.");for(const item of Object.values(employeeConfigs)){if((item.clock_in.includes("reminder_cards")||item.clock_out.includes("reminder_cards"))&&!item.reminder_cards.length)throw new Error("표시할 리마인더 카드를 한 개 이상 완성해주세요.");}config=await window.omgWorkConfig.save(session.accessToken,document.getElementById("propertyName").value.trim(),rooms,employeeConfigs);message.className="message ok";message.textContent="설정이 저장되었습니다. 직원 화면에 바로 반영됩니다.";}catch(error){message.className="message error";message.textContent=error.message||"설정을 저장하지 못했습니다.";}finally{button.disabled=false;button.textContent="설정 저장";}});
</script></body></html>
