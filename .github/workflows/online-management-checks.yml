name: Verify online reservation management
on:
  pull_request:
    paths: ['supabase/setup/web_checkin_reference_first.sql', 'supabase/migrations/*web_checkin_reference_first.sql', 'guest-qr-settings.css', 'supabase/setup/web_checkin_overnight_choice.sql', 'supabase/migrations/*web_checkin_overnight_choice.sql', 'web-checkin*', 'guest.html', 'guest-portal.js', 'guest-support-settings.*', 'supabase/setup/guest_web_checkin.sql', 'supabase/migrations/*guest_web_checkin.sql', 'employee-settings.js', 'employee-profile-warning.js', 'employee-cards.css', 'account-chat-preferences.*', 'report-session.js', 'report.html', 'tests/checkin-report/**', 'supabase/setup/staff_alert_fields.sql', 'supabase/setup/employee_profile_warning.sql', 'supabase/migrations/*staff_alert_fields_and_profile_warning.sql', 'home-cleaning.*', 'employee-cleaning-settings.js', 'staff-management.html', 'supabase/setup/home_cleaning.sql', 'supabase/migrations/*home_cleaning*.sql', 'owner-settings.html', 'property-room-import.js', 'mission.html', 'home-message-queue.js', 'guest-messages.html', 'guest-inbox.*', 'home-eight-menu.css', 'home-guest-count.js', 'notification-bot.js', 'guest-message-card.*', 'messages.html', 'assets/booking-channels/**', 'property-selector.js', 'select-picker.js', 'online.*', 'translation-languages.js', 'app.html', 'supabase/functions/beds24/**', 'supabase/functions/online-room-import/**', 'supabase/functions/online-arrivals/**', 'supabase/setup/beds24*.sql', 'supabase/setup/translation*.sql', 'platform-translation.js', 'platform-admin.html', 'operations-center.js', 'subscription.html', 'service-access.js', 'tests/online/**', 'supabase/functions/dispatch-notification/**', '.github/workflows/online-management-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tests/attendance-nfc
      - run: cd tests/attendance-nfc && npx playwright install --with-deps chromium
      - name: Verify tenancy, credential storage, approvals and delivery
        env: {NODE_PATH: '${{ github.workspace }}/tests/attendance-nfc/node_modules'}
        run: |
          node --check online.js
          node tests/online/employee-cleaning-settings.cjs
          node tests/online/staff-settings-ui.cjs
          node tests/checkin-report/database.cjs
          node tests/checkin-report/web.cjs
          node tests/settings-room-types.cjs
          node tests/mission-empty.cjs
          node tests/online/database.cjs
          node tests/online/edge.mjs
          node tests/online/web-checkin-edge.mjs
          node tests/online/web-checkin-ui.cjs
          node tests/online/web-checkin-choice-ui.cjs
          node supabase/tests/guest-qr-ui.test.cjs
          node tests/online/booking-price-edge.mjs
          node tests/online/arrival-edge.mjs
          node tests/online/room-import-edge.mjs
          node tests/online/message-alert-transport.mjs
          node tests/online/guest-popup-ui.cjs
          node tests/online/bot-cards-ui.cjs
          node tests/online/unified-ui.cjs
          node tests/online/menu-badge.cjs
          node tests/online/unified-browser.cjs
          node tests/message-popup-queue/web.cjs
          node tests/online/ui.cjs
          node tests/online/booking-data-ui.cjs
          node tests/online/followup-ui.cjs
          node tests/online/filter-memory-ui.cjs
          node tests/online/checkin-list-ui.cjs
          node tests/online/cleaning-ui.cjs
          node tests/online/translation-ui.cjs
          node tests/online/translation-edge.mjs
          node tests/online/auto-translation-edge.mjs
          node tests/online/auto-translation-ui.cjs
          node tests/online/settings-accordion-ui.cjs
          node tests/operations-center-ui.cjs
          node tests/online/layout.cjs
          node tests/online/branches.cjs
          node tests/online/navigation.cjs
          node tests/select-picker-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMS-online-compact-multi-preview
          path: /tmp/online-*.png
