<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#edf6ff"><title>숙소 안내 · 게스트 채팅</title><link rel="stylesheet" href="guest-support.css"><link rel="stylesheet" href="guest-portal.css"></head><body class="guest-portal"><main id="portal"><header class="property-brand" id="propertyName">숙소 안내</header><section class="welcome-hero"><div class="welcome-copy"><div class="eyebrow">WELCOME TO YOUR STAY</div><h1>반가워요,<br>환영합니다.</h1><p>편안한 숙박을 도와드릴게요.</p><span class="welcome-line"></span></div></section><section class="menu-panel"><div id="guides" class="portal-menus"></div><div id="status" class="status" role="status">안내를 불러오는 중입니다.</div></section></main><dialog id="entry" class="guest-entry"><div class="entry-hero"><div class="top"><span class="entry-property"></span><button class="icon-btn" id="closeEntry" aria-label="닫기" type="button">×</button></div><h2>무엇을<br>도와드릴까요?</h2><p>간단한 정보를 입력하고<br>직원과 대화를 시작하세요.</p></div><form id="entryForm"><label class="field">이름<input name="name" placeholder="예약에 사용한 이름" autocomplete="name" maxlength="60" required></label><div class="grid2"><label class="field">체크인<input name="check_in" type="date" required></label><label class="field">체크아웃<input name="check_out" type="date" required></label></div><label class="field">객실명/호수<input id="roomNumber" name="room_number" maxlength="40" placeholder="예: 201호" required></label><label class="check room-unknown"><input id="roomUnknown" name="room_unknown" type="checkbox">아직 모릅니다.</label><label class="field">이메일<input name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="example@email.com" required></label><p class="privacy-note">입력한 정보는 숙소 고객 응대에 사용됩니다.</p><div id="entryStatus" class="status" role="status"></div><button class="btn primary wide" type="submit">채팅 시작 <span aria-hidden="true">→</span></button></form></dialog><script src="supabase-config.js"></script><script src="guest-support-client.js"></script><script src="guest-icons.js"></script><script src="guest-portal.js"></script></body></html>
