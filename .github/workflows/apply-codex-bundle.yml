name: Apply Codex message alert bundle

on:
  push:
    branches:
      - codex/message-alert-cap-popup
    paths:
      - .github/workflows/apply-codex-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/message-alert-cap-popup
          fetch-depth: 0
      - name: Apply prepared change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base64 -d codex-message-alert.bundle.b64 > codex-message-alert.bundle
          git fetch ./codex-message-alert.bundle HEAD:refs/remotes/codex/message-alert-change
          git cherry-pick refs/remotes/codex/message-alert-change
          rm codex-message-alert.bundle
          git rm codex-message-alert.bundle.b64 .github/workflows/apply-codex-bundle.yml
          git commit -m "Remove temporary deployment bundle [skip ci]"
          git push origin HEAD:codex/message-alert-cap-popup
