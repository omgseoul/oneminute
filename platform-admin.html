<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>OMG WORKS 운영자 센터</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script>
<style>
:root{--navy:#183153;--blue:#2f70cd;--ink:#17243a;--muted:#718097;--line:#e1e9f4;--bg:#f4f7fc;--green:#198754;--orange:#d57917;--red:#bd3a3a;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.shell{visibility:hidden;opacity:0;width:min(100%,1120px);min-height:100vh;margin:auto;padding:22px 18px 70px}.shell.ready{visibility:visible;opacity:1;transition:opacity .12s}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:48px;height:48px;object-fit:contain}.brand small{display:block;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.12em}.brand strong{display:block;color:var(--navy);font-size:20px;letter-spacing:-.04em}.back{display:grid;place-items:center;width:43px;height:43px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--navy);text-decoration:none;font-size:21px;box-shadow:0 5px 15px rgba(42,78,120,.07)}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:27px 28px;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:0 10px 30px rgba(42,78,120,.08)}.hero h1{margin:0 0 7px;color:var(--navy);font-size:32px;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.refresh{height:42px;padding:0 16px;border:0;border-radius:13px;background:#eaf3ff;color:var(--blue);font-weight:900}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:16px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 5px 18px rgba(42,78,120,.05)}.metric strong{display:block;color:var(--navy);font-size:25px}.metric span{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:800}.panel{margin-top:16px;padding:21px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 7px 24px rgba(42,78,120,.06)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:16px}.panel h2{margin:0;color:var(--navy);font-size:21px;letter-spacing:-.04em}.tools{display:flex;gap:8px}.tools input,.tools select{height:42px;border:1px solid #cfdaea;border-radius:12px;background:#fbfdff;padding:0 12px;color:var(--ink);outline:none}.tools input{width:220px}.tools select{min-width:110px}.property-list{display:grid;gap:10px}.property{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fbfdff}.property-main{display:grid;grid-template-columns:72px minmax(160px,1.4fr) minmax(150px,1fr) repeat(4,minmax(72px,.55fr)) 38px;align-items:center;gap:10px;padding:15px}.number{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#eaf3ff;color:var(--blue);font-weight:900}.identity{min-width:0}.identity strong{display:block;color:var(--navy);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity span{display:block;margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;align-items:center;justify-content:center;width:max-content;min-width:64px;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.status.active{background:#e3f5eb;color:var(--green)}.status.trial{background:#fff1dd;color:var(--orange)}.status.suspended,.status.cancelled{background:#fee8e8;color:var(--red)}.cell{text-align:center}.cell strong{display:block;color:var(--navy);font-size:15px}.cell span{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:800}.toggle{width:34px;height:34px;border:0;border-radius:10px;background:#edf3fa;color:var(--navy);font-weight:900}.details{display:none;padding:0 15px 15px}.property.open .details{display:block}.detail-grid{display:grid;grid-template-columns:1fr 170px 150px;gap:10px;padding:14px;border-top:1px solid var(--line)}.note{width:100%;min-height:74px;resize:vertical;border:1px solid #cfdaea;border-radius:12px;padding:10px;background:#fff;color:var(--ink)}.select-wrap label,.note-wrap label{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:900}.select-wrap select{width:100%;height:44px;border:1px solid #cfdaea;border-radius:12px;padding:0 9px;background:#fff}.actions{display:grid;gap:8px;align-content:end}.primary,.secondary{height:44px;border-radius:12px;font-weight:900}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid #efbaba;background:#fff;color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted)}.audit-list{display:grid;gap:8px}.audit{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid #edf1f6}.audit:last-child{border:0}.audit strong{font-size:12px;color:var(--navy)}.audit span{font-size:11px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:rgba(15,29,50,.45)}.modal[hidden]{display:none}.dialog{width:min(100%,390px);padding:25px;border-radius:23px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.22);text-align:center}.dialog-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 14px;border-radius:18px;background:#eaf3ff;color:var(--blue);font-size:27px}.dialog h3{margin:0 0 9px;color:var(--navy);font-size:21px}.dialog p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;white-space:pre-line}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.dialog-actions button{height:46px;border-radius:13px;font-weight:900}.cancel{border:1px solid var(--line);background:#fff;color:var(--muted)}.confirm{border:0;background:var(--blue);color:#fff}.message{position:fixed;left:50%;bottom:26px;z-index:30;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 17px;border-radius:13px;background:var(--navy);color:#fff;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(20,45,80,.25)}.message[hidden]{display:none}@media(max-width:820px){.summary{grid-template-columns:repeat(2,1fr)}.summary .metric:last-child{grid-column:1/-1}.property-main{grid-template-columns:58px minmax(0,1fr) 78px 34px}.property-main>.cell:nth-of-type(n+2){display:none}.property-main>.identity+div{display:block}.detail-grid{grid-template-columns:1fr}.tools input{width:100%}.panel-head{align-items:stretch;flex-direction:column}.tools{display:grid;grid-template-columns:1fr 110px}}@media(max-width:520px){.shell{padding:15px 13px 55px}.hero{padding:22px 19px;align-items:flex-start;flex-direction:column}.hero h1{font-size:27px}.refresh{width:100%}.metric{padding:15px}.panel{padding:16px 12px}.property-main{padding:12px 10px;gap:7px}.identity strong{font-size:14px}.identity span{font-size:10px}.status{min-width:57px;padding:6px 7px}.audit{flex-direction:column;gap:4px}}
</style></head><body><main id="operatorShell" class="shell">
<header class="top"><div class="brand"><img src="shiba-worker-logo-v2.png" alt="OMG WORKS"><div><small>OMG WORKS</small><strong>운영자 센터</strong></div></div><a class="back" href="app.html" aria-label="메인으로">‹</a></header>
<section class="hero"><div><h1>전체 숙소 관리</h1><p>가입 숙소의 이용 현황과 계정 상태를 관리합니다.<br>비밀번호와 기존 PIN은 운영자에게 표시되지 않습니다.</p></div><button id="refreshButton" class="refresh" type="button">새로고침</button></section>
<section class="summary"><article class="metric"><strong id="totalCount">0</strong><span>전체 숙소</span></article><article class="metric"><strong id="activeCount">0</strong><span>정상 이용</span></article><article class="metric"><strong id="trialCount">0</strong><span>체험 중</span></article><article class="metric"><strong id="suspendedCount">0</strong><span>이용 정지</span></article><article class="metric"><strong id="workingCount">0</strong><span>현재 근무 중</span></article></section>
<section class="panel"><div class="panel-head"><h2>숙소 목록</h2><div class="tools"><input id="searchInput" type="search" placeholder="숙소명·이메일·번호 검색"><select id="statusFilter"><option value="">전체 상태</option><option value="active">정상</option><option value="trial">체험</option><option value="suspended">정지</option><option value="cancelled">탈퇴</option></select></div></div><div id="propertyList" class="property-list"></div></section>
<section class="panel"><div class="panel-head"><h2>최근 운영 기록</h2></div><div id="auditList" class="audit-list"></div></section>
</main>
<div id="confirmModal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-icon">!</div><h3 id="dialogTitle">확인</h3><p id="dialogText"></p><div class="dialog-actions"><button id="dialogCancel" class="cancel" type="button">취소</button><button id="dialogConfirm" class="confirm" type="button">확인</button></div></section></div><div id="message" class="message" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script>
<script>
const labels={active:"정상",trial:"체험",suspended:"정지",cancelled:"탈퇴"};let dashboard={properties:[],recent_actions:[]};let pendingConfirm=null;
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const dateText=value=>value?new Intl.DateTimeFormat("ko-KR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(value)):"기록 없음";
function toast(text){const el=document.getElementById("message");el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2800);}
function ask(title,text,confirmText="확인"){document.getElementById("dialogTitle").textContent=title;document.getElementById("dialogText").textContent=text;document.getElementById("dialogConfirm").textContent=confirmText;document.getElementById("confirmModal").hidden=false;return new Promise(resolve=>pendingConfirm=resolve);}
function closeAsk(answer){document.getElementById("confirmModal").hidden=true;const resolve=pendingConfirm;pendingConfirm=null;resolve?.(answer);}
document.getElementById("dialogCancel").onclick=()=>closeAsk(false);document.getElementById("dialogConfirm").onclick=()=>closeAsk(true);
function render(){const s=dashboard.summary||{};document.getElementById("totalCount").textContent=s.total||0;document.getElementById("activeCount").textContent=s.active||0;document.getElementById("trialCount").textContent=s.trial||0;document.getElementById("suspendedCount").textContent=s.suspended||0;document.getElementById("workingCount").textContent=s.working_now||0;const query=document.getElementById("searchInput").value.trim().toLowerCase(),status=document.getElementById("statusFilter").value;const items=(dashboard.properties||[]).filter(item=>(!status||item.service_status===status)&&(!query||`${item.property_name} ${item.email} ${item.management_number}`.toLowerCase().includes(query)));const list=document.getElementById("propertyList");list.innerHTML=items.length?items.map(item=>`<article class="property" data-id="${item.property_id}"><div class="property-main"><div class="number">${item.management_number??"-"}</div><div class="identity"><strong>${escapeHtml(item.property_name)}</strong><span>${escapeHtml(item.email||"연결 이메일 없음")}</span></div><div><span class="status ${item.service_status}">${labels[item.service_status]||item.service_status}</span></div><div class="cell"><strong>${item.employee_count}</strong><span>근무자</span></div><div class="cell"><strong>${item.working_count}</strong><span>근무 중</span></div><div class="cell"><strong>${item.reports_7d}</strong><span>7일 보고</span></div><div class="cell"><strong>${item.mission_count}</strong><span>미션</span></div><button class="toggle" type="button" aria-label="상세 열기">⌄</button></div><div class="details"><div class="detail-grid"><div class="note-wrap"><label>운영 메모 · 최근 활동 ${escapeHtml(dateText(item.last_activity))}</label><textarea class="note" maxlength="1000" placeholder="운영자만 보는 메모">${escapeHtml(item.operator_note)}</textarea></div><div class="select-wrap"><label>이용 상태</label><select class="status-select"><option value="active" ${item.service_status==="active"?"selected":""}>정상 이용</option><option value="trial" ${item.service_status==="trial"?"selected":""}>체험 중</option><option value="suspended" ${item.service_status==="suspended"?"selected":""}>이용 정지</option><option value="cancelled" ${item.service_status==="cancelled"?"selected":""}>탈퇴 처리</option></select></div><div class="actions"><button class="primary save-property" type="button">변경 저장</button><button class="secondary reset-pin" type="button">관리자 PIN 초기화</button></div></div></div></article>`).join(""):"<p class='empty'>조건에 맞는 숙소가 없습니다.</p>";list.querySelectorAll(".toggle").forEach(button=>button.onclick=()=>button.closest(".property").classList.toggle("open"));list.querySelectorAll(".save-property").forEach(button=>button.onclick=()=>saveProperty(button.closest(".property")));list.querySelectorAll(".reset-pin").forEach(button=>button.onclick=()=>resetPin(button.closest(".property")));const audits=document.getElementById("auditList");audits.innerHTML=(dashboard.recent_actions||[]).length?(dashboard.recent_actions||[]).map(item=>`<div class="audit"><strong>${escapeHtml(item.property_name||"숙소")} · ${item.action==="administrator_pin_reset"?"관리자 PIN 초기화":"이용 상태 변경"}</strong><span>${escapeHtml(dateText(item.created_at))}</span></div>`).join(""):"<p class='empty'>운영 기록이 없습니다.</p>";}
async function load(){document.getElementById("refreshButton").disabled=true;try{const account=await window.omgAccount.require();if(!account)return;const{data,error}=await window.omgSupabase.rpc("get_platform_dashboard");if(error||!data?.ok){if(data?.code==="platform_admin_required")location.replace("app.html");else throw new Error(data?.message||"운영 현황을 불러오지 못했습니다.");return;}dashboard=data;render();document.getElementById("operatorShell").classList.add("ready");window.omgTransition.ready();}catch(error){toast(error.message||"운영 현황을 불러오지 못했습니다.");document.getElementById("operatorShell").classList.add("ready");window.omgTransition.ready();}finally{document.getElementById("refreshButton").disabled=false;}}
async function saveProperty(card){const item=dashboard.properties.find(value=>value.property_id===card.dataset.id),next=card.querySelector(".status-select").value,note=card.querySelector(".note").value;if(!item)return;if((next==="suspended"||next==="cancelled")&&next!==item.service_status&&!await ask("숙소 이용 상태 변경",`${item.property_name}을(를) ${labels[next]} 상태로 변경하면 현재 로그인도 종료됩니다.`,"변경"))return;const{data,error}=await window.omgSupabase.rpc("update_platform_property",{p_property_id:item.property_id,p_service_status:next,p_operator_note:note});if(error||!data?.ok){toast(data?.message||"저장하지 못했습니다.");return;}toast("숙소 상태를 저장했습니다.");await load();}
async function resetPin(card){const item=dashboard.properties.find(value=>value.property_id===card.dataset.id);if(!item||!await ask("관리자 PIN 초기화",`${item.property_name}의 기본 관리자 PIN을 1234로 재설정합니다.\n현재 관리자 로그인은 종료됩니다.`,"초기화"))return;const{data,error}=await window.omgSupabase.rpc("reset_platform_property_admin_pin",{p_property_id:item.property_id});if(error||!data?.ok){toast(data?.message||"PIN을 초기화하지 못했습니다.");return;}await ask("PIN 초기화 완료","임시 관리자 PIN은 1234입니다.\n숙소 관리자에게 로그인 후 변경하도록 안내해주세요.","확인");await load();}
document.getElementById("searchInput").oninput=render;document.getElementById("statusFilter").onchange=render;document.getElementById("refreshButton").onclick=load;load();
</script></body></html>
