<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>원미닛 출근·퇴근 보고</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--blue-soft:#dceafe;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.shell{width:min(100%,520px);min-height:100vh;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 18px}.brand{font-size:12px;font-weight:900;letter-spacing:.09em;color:var(--navy)}.today{font-size:12px;color:var(--muted)}
.hero{min-height:130px;padding:27px 22px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:0 8px 26px rgba(42,78,120,.07)}.hero h1{margin:0 0 9px;color:var(--navy);font-size:31px;line-height:1.1;letter-spacing:-.05em}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.group{margin-top:22px}.group-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 11px}.group h2{margin:0;color:var(--navy);font-size:17px;letter-spacing:-.03em}.group small{color:var(--muted);font-size:11px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu-card{min-height:112px;padding:17px 15px;border:1px solid var(--line);border-radius:19px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 5px 18px rgba(42,78,120,.055);display:flex;align-items:center;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}.menu-card:active{transform:scale(.975);border-color:#8eb4e8;box-shadow:0 3px 10px rgba(42,78,120,.09)}.menu-card>div{width:100%}.menu-card b{display:block;margin-bottom:7px;color:var(--navy);font-size:16px;letter-spacing:-.02em}.menu-card span{color:var(--muted);font-size:11px}.arrow{float:right;color:#7a9bc6;font-weight:900}.notice{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:14px;border:1px solid #d9e7f8;border-radius:16px;background:#f0f6fd}.notice-icon{font-size:17px}.notice b{display:block;margin-bottom:3px;color:#294d79;font-size:12px}.notice span{color:#607895;font-size:11px;line-height:1.45}@media(min-width:600px){.shell{padding-top:34px}.hero{min-height:168px;padding-top:27px}.shiba{width:108px;height:108px}.menu-card{min-height:120px}}
</style></head><body><main class="shell">
<section class="hero"><h1>One Minute</h1><p>직원 출퇴근 보고</p></section>
<section class="group"><div class="group-head"><h2>오전 직원</h2><small>Morning shift</small></div><div class="menu"><a class="menu-card" href="morning1.html"><div><b>출근보고 <i class="arrow">›</i></b><span>오늘 근무를 시작해요</span></div></a><a class="menu-card" href="morning2.html"><div><b>퇴근보고 <i class="arrow">›</i></b><span>객실과 사진을 확인해요</span></div></a></div></section>
<section class="group"><div class="group-head"><h2>오후 직원</h2><small>Afternoon shift</small></div><div class="menu"><a class="menu-card" href="afternoon1.html"><div><b>출근보고 <i class="arrow">›</i></b><span>오후 근무를 시작해요</span></div></a><a class="menu-card" href="afternoon2.html"><div><b>퇴근보고 <i class="arrow">›</i></b><span>오늘 업무를 마무리해요</span></div></a></div></section>
<aside class="notice"><span class="notice-icon">ⓘ</span><div><b>보고 전 확인해주세요</b><span>퇴근보고에는 객실 상태와 필수 사진 첨부가 포함됩니다.</span></div></aside>
</main></body></html>
