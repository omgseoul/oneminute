<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>OMG WORKS 계정 로그인</title>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc;--red:#bd3131}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.shell{visibility:hidden;opacity:0;width:min(100%,480px);min-height:100vh;margin:auto;padding:34px 18px calc(34px + env(safe-area-inset-bottom));display:flex;align-items:center}.shell.ready{visibility:visible;opacity:1}.card{width:100%;padding:28px 22px;border:1px solid var(--line);border-radius:27px;background:#fff;box-shadow:0 12px 34px rgba(42,78,120,.1)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:25px}.brand img{width:76px;height:76px;object-fit:contain}.brand small{display:block;margin-bottom:5px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.11em}.brand h1{margin:0;color:var(--navy);font-size:30px;letter-spacing:-.05em}.intro{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#eef3f9}.tabs button{height:42px;border:0;border-radius:11px;background:transparent;color:#7c899b;font-size:14px;font-weight:900}.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(42,78,120,.09)}label{display:block;margin:15px 2px 7px;color:var(--navy);font-size:13px;font-weight:900}input{width:100%;height:52px;padding:0 14px;border:1px solid #cfdaea;border-radius:13px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus{border-color:#6a9ddd;box-shadow:0 0 0 3px rgba(36,103,189,.1)}.primary{width:100%;height:54px;margin-top:22px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.primary:disabled{opacity:.55}.message{min-height:20px;margin:12px 2px 0;color:var(--red);font-size:12px;line-height:1.5;text-align:center}.message.ok{color:#17814d}.foot{margin:20px 0 0;color:#9aa5b4;font-size:10px;text-align:center}
</style></head><body><main id="accountShell" class="shell"><section class="card">
<div class="brand"><img src="shiba-worker-logo-v2.png" alt="OMG WORKS 시바견"><div><small>OMG WORKS</small><h1>계정 로그인</h1></div></div>
<p class="intro">먼저 이메일 계정으로 로그인하세요.<br>로그인 후 근무자 또는 관리자 PIN을 입력합니다.</p>
<div class="tabs"><button id="loginTab" class="on" type="button">로그인</button><button id="signupTab" type="button">가입</button></div>
<form id="accountForm">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.com">
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6자리 이상">
<div id="confirmBox" hidden><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="비밀번호를 다시 입력"></div>
<button id="submitButton" class="primary" type="submit">계정 로그인</button><div id="message" class="message" role="alert"></div>
</form><p class="foot">SECURE ACCOUNT · THEN PIN LOGIN</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script>
<script>
let mode="login";const form=document.getElementById("accountForm"),message=document.getElementById("message"),submit=document.getElementById("submitButton"),confirmBox=document.getElementById("confirmBox");
function setMode(next){mode=next;document.getElementById("loginTab").classList.toggle("on",mode==="login");document.getElementById("signupTab").classList.toggle("on",mode==="signup");confirmBox.hidden=mode!=="signup";document.getElementById("confirmPassword").required=mode==="signup";submit.textContent=mode==="login"?"계정 로그인":"가입하기";message.textContent="";message.className="message";}
document.getElementById("loginTab").onclick=()=>setMode("login");document.getElementById("signupTab").onclick=()=>setMode("signup");
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";message.className="message";submit.disabled=true;const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;try{if(mode==="signup"){if(password!==document.getElementById("confirmPassword").value)throw new Error("비밀번호가 서로 다릅니다.");const{data,error}=await window.omgSupabase.auth.signUp({email,password});if(error)throw error;if(!data.session){message.className="message ok";message.textContent="가입 확인 메일을 보냈습니다. 이메일 확인 후 로그인해주세요.";setMode("login");return;}}else{const{error}=await window.omgSupabase.auth.signInWithPassword({email,password});if(error)throw error;}location.replace("login.html");}catch(error){message.textContent=error.message==="Invalid login credentials"?"이메일 또는 비밀번호를 확인해주세요.":error.message||"계정 처리를 완료하지 못했습니다.";}finally{submit.disabled=false;submit.textContent=mode==="login"?"계정 로그인":"가입하기";}});
(async()=>{if(await window.omgAccount.get()){location.replace("login.html");return;}document.getElementById("accountShell").classList.add("ready");})().catch(()=>document.getElementById("accountShell").classList.add("ready"));
</script></body></html>
