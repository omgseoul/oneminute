<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>메세지</title>
  <link rel="stylesheet" href="guest-support.css?v=20261001-compact">
  <link rel="stylesheet" href="staff-chat.css?v=20261018-shared-profile">
  <link rel="stylesheet" href="home-link.css?v=20261001">
  <link rel="stylesheet" href="top-layout.css?v=20261005b">
<style>.chat-video{position:relative;width:min(220px,62vw);height:132px;margin:3px 0 6px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#243d5c,#7793b1)}.chat-video .video-poster,.chat-video video{position:absolute;inset:0;display:block;width:100%;height:100%;border-radius:0;background:#111}.chat-video .video-poster{object-fit:cover}.chat-video video{object-fit:contain}.chat-video img[hidden],.chat-video video[hidden],.chat-video button[hidden]{display:none!important}.chat-video button{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;padding:0;border:0;border-radius:0;background:linear-gradient(180deg,#0001,#0005);color:#fff;cursor:pointer}.chat-video .video-play{display:grid;place-items:center;width:46px;height:46px;padding-left:3px;border-radius:50%;background:#f4f9ff;color:#2467bd;font-size:22px;box-shadow:0 2px 12px #0003}.chat-video .video-label{font-size:12px;font-weight:850;text-shadow:0 1px 4px #0008}.staff-contract-link{display:block;margin-top:12px;padding:10px 12px;border:1px solid #c5d8f0;border-radius:10px;background:#fff;color:#2467bd;text-decoration:none;font-weight:750}</style><link rel="stylesheet" href="photo-viewer-zoom.css?v=20261018-media"></head>
<body>
  <div class="chat-page">
    <header class="chat-head">
      <div class="top"><a class="back" href="messages.html?tab=staff">‹ 목록</a><button id="chatSearchToggle" class="chat-search-toggle" type="button" aria-label="대화 검색" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg></button></div>
      <div id="chatSearchPanel" class="chat-search-panel" hidden><input id="chatSearchInput" type="search" placeholder="대화 내용 검색" aria-label="대화 내용 검색"><button id="chatSearchRun" type="button">검색</button><button id="chatSearchClose" type="button" aria-label="검색 닫기">×</button><div class="chat-search-navigation"><span id="chatSearchStatus" role="status"></span><button id="chatSearchPrev" type="button" aria-label="이전 검색 결과">↑</button><button id="chatSearchNext" type="button" aria-label="다음 검색 결과">↓</button></div></div><button id="peerIdentity" class="staff-identity" type="button" aria-label="근무자 프로필 보기">
        <span id="peerAvatar"></span><h1 id="roomTitle">대화 불러오는 중</h1>
      </button>
    </header>
    <div id="timeline" class="timeline chat-loading" aria-live="polite" aria-relevant="additions">
      <button id="older" class="btn subtle" type="button" hidden>이전 대화 더 보기</button><div id="bubbles"></div>
    </div>
    <form id="composer" class="composer">
      <div id="photoPending" class="photo-pending" hidden></div>
      <div class="row">
        <button id="priority" type="button" aria-label="일반·긴급 선택" aria-pressed="false">일반⌄</button>
        <label class="photo-button" for="photoInput" aria-label="사진 또는 동영상 첨부"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg></label>
        <input id="photoInput" type="file" accept="image/*,video/*" aria-label="사진 또는 동영상 첨부" hidden>
        <div class="staff-input-wrap"><textarea id="body" placeholder="메세지 입력" maxlength="2000" rows="1" aria-label="메세지 내용"></textarea><button id="emojiToggle" type="button" aria-label="이모지 선택" aria-expanded="false" aria-controls="emojiPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14.5c1.8 2.4 6.2 2.4 8 0"/><path d="M8.5 8.5h.01M15.5 8.5h.01" stroke-width="2.8"/></svg></button></div>
        <button class="btn primary" id="send" type="submit" disabled aria-label="보내기">➤</button>
      </div>
      <div id="emojiPanel" class="staff-emoji-panel" aria-label="기본 이모지" hidden></div>
      <div id="status" class="status" role="status"></div>
    </form>
  </div>

  <dialog id="peerProfileDialog" class="peer-profile-dialog" aria-labelledby="peerProfileTitle">
    <div class="profile-sheet-head"><h2 id="peerProfileTitle">근무자 정보</h2><button id="peerProfileClose" type="button" aria-label="근무자 정보 닫기">×</button></div>
    <div class="profile-hero"><span id="peerProfileAvatar"></span><strong id="peerProfileName"></strong></div>
    <dl class="profile-fields">
      <div><dt>이름</dt><dd id="peerProfileDisplayName">-</dd></div>
      <div><dt>직무</dt><dd id="peerProfileJobTitle">-</dd></div>
      <div><dt>지점</dt><dd id="peerProfileProperty">-</dd></div>
      <div><dt>연락처</dt><dd id="peerProfilePhone">-</dd></div>
    </dl>
  </dialog>

  <section id="photoViewer" class="photo-viewer" hidden aria-modal="true" role="dialog" aria-label="사진·동영상 전체화면">
    <header class="photo-viewer-head">
      <button id="photoViewerClose" class="viewer-icon" type="button" aria-label="미디어 닫기">‹</button>
      <div class="photo-viewer-title"><strong id="photoViewerName">사진</strong><span id="photoViewerDate"></span></div>
      <button id="photoGalleryOpen" class="viewer-icon grid-icon" type="button" aria-label="사진·동영상 모아보기"><i></i><i></i><i></i><i></i></button>
    </header>
    <div id="photoStage" class="photo-stage">
      <button id="photoPrevious" class="photo-arrow previous" type="button" aria-label="이전 사진 또는 동영상">‹</button>
      <img id="photoViewerImage" alt="대화 첨부 사진"><video id="photoViewerVideo" controls playsinline preload="metadata" hidden></video><p id="videoViewerStatus" class="video-viewer-status" role="status" hidden></p><button id="videoViewerRetry" class="video-viewer-retry" type="button" hidden>다시 불러오기</button><button id="videoFullscreen" class="video-fullscreen" type="button" aria-label="동영상 화면 확대" aria-pressed="false" hidden>⛶</button>
      <button id="photoNext" class="photo-arrow next" type="button" aria-label="다음 사진 또는 동영상">›</button>
    </div>
    <footer class="photo-viewer-foot"><div id="photoThumbs" class="photo-thumbs"></div><strong id="photoCount"></strong></footer>
  </section>

  <section id="photoGallery" class="photo-gallery" hidden aria-modal="true" role="dialog" aria-label="사진·동영상 모아보기">
    <header><button id="photoGalleryClose" type="button" aria-label="사진첩 닫기">‹</button><h2>사진 · 동영상</h2><span id="galleryCount"></span></header>
    <div id="galleryStatus" class="gallery-status" role="status"></div><div id="photoGrid" class="photo-grid"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script>
  <script src="notification-config.js"></script><script src="notification-client.js"></script>
  <script src="photo-codec.js?v=20261014-100mb"></script><script src="guest-support-client.js?v=20261001-ui"></script>
  <script src="staff-chat-client.js?v=20261018-native-handoff"></script><script src="photo-viewer-zoom.js?v=20261018-media"></script><script src="chat-video-preview.js?v=20261018"></script><script src="staff-chat.js?v=20261018-send-state"></script>
<script src="staff-chat-emoji.js?v=20261018"></script>
</body>
</html>
