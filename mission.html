<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>미션</title><style>
:root{--navy:#183153;--blue:#2467bd;--red:#cf3e49;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc;--soft:#edf5ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{width:min(100%,680px);margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px}.head h1{margin:0;color:var(--navy);font-size:32px}.head p{margin:8px 0;color:var(--muted);font-size:13px}.card{margin-top:13px;padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 6px 20px rgba(42,78,120,.06)}.card h2{margin:0 0 12px;color:var(--navy);font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:11px 0 6px;color:var(--navy);font-size:12px;font-weight:900}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;font:14px/1.45 inherit}textarea{min-height:86px;resize:vertical}.checkline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px}.checkline input{width:auto}.primary{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:16px;font-weight:900}.mission{position:relative}.mission.overdue{border-color:#f0b3b8}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.badge{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:900}.badge.urgent,.badge.overdue{background:#fff0f1;color:var(--red)}.mission h3{margin:0;color:var(--navy);font-size:18px}.mission p{white-space:pre-line;color:#53647a;font-size:13px;line-height:1.55}.meta{color:#7b899a;font-size:11px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;min-height:42px;border:1px solid #cbd8e8;border-radius:11px;background:#fff;color:var(--navy);font-weight:800}.actions .done{border:0;background:var(--blue);color:#fff}.actions .archive{color:#ae3b45}.complete-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.photo-preview{display:none;width:100%;max-height:230px;margin-top:8px;object-fit:contain;border-radius:11px;background:#eef4fb}.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}.message{min-height:20px;margin-top:10px;color:#bd3131;font-size:12px;text-align:center}.section-title{margin:24px 2px 8px;color:var(--navy);font-size:18px}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="top"><a class="back" href="app.html">‹ 메인으로</a><span id="property" class="meta"></span></div><header class="head"><h1>미션</h1><p id="intro">업무와 전달사항을 확인합니다.</p></header><section id="ownerForm" class="card" hidden><h2>새 미션 등록</h2><form id="missionForm"><label for="title">미션 제목</label><input id="title" maxlength="100" required><label for="description">상세 내용</label><textarea id="description" maxlength="2000"></textarea><div class="grid"><div><label for="timing">구분</label><select id="timing"><option value="today">당일</option><option value="this_week">이번 주</option><option value="anytime">아무 때나</option></select></div><div><label for="priority">중요도</label><select id="priority"><option value="normal">보통</option><option value="important">중요</option><option value="urgent">긴급</option></select></div><div><label for="target">담당 근무자</label><select id="target"><option value="">전체 직원</option></select></div><div><label for="minutes">예상 소요시간(분)</label><input id="minutes" type="number" min="1" max="1440" value="30"></div><div><label for="dueAt">마감일시 (선택)</label><input id="dueAt" type="datetime-local"></div></div><label class="checkline"><input id="photoRequired" type="checkbox"> 완료 사진 필수</label><button class="primary" type="submit">미션 등록</button><div id="ownerMessage" class="message"></div></form></section><h2 class="section-title">진행 중 미션</h2><div id="missions"><div class="empty">불러오는 중...</div></div><div id="message" class="message"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script><script>
let session=null,config=null,isOwner=false;const missionsNode=document.getElementById("missions"),message=document.getElementById("message");function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}function timingName(value){return({today:"당일",this_week:"이번 주",anytime:"아무 때나"})[value]||value;}function priorityName(value){return({normal:"보통",important:"중요",urgent:"긴급"})[value]||value;}async function rpc(name,args){const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"미션을 처리하지 못했습니다.");return data;}function fileToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.75));};image.src=reader.result;};reader.readAsDataURL(file);});}
function renderMission(item){const overdue=!item.completed_at&&item.due_at&&new Date(item.due_at)<new Date(),targets=item.target_names?.length?item.target_names.join(", "):"전체 직원",progress=isOwner?` · 완료 ${item.completed_count||0}/${item.target_count||0}명`:"";const card=document.createElement("article");card.className=`card mission${overdue?" overdue":""}`;card.innerHTML=`<div class="badges"><span class="badge ${item.priority}">${priorityName(item.priority)}</span><span class="badge">${timingName(item.timing)}</span>${overdue?'<span class="badge overdue">기한 초과</span>':""}${item.completed_at?'<span class="badge">완료</span>':""}</div><h3>${esc(item.title)}</h3><p>${esc(item.description||"")}</p><div class="meta">담당: ${esc(targets)} · 예상 ${item.estimated_minutes||0}분${item.due_at?` · 마감 ${new Date(item.due_at).toLocaleString("ko-KR")}`:""}${progress}</div>`;const actions=document.createElement("div");actions.className="actions";if(isOwner){actions.innerHTML='<button class="archive" type="button">미션 종료</button>';actions.firstElementChild.addEventListener("click",async()=>{if(!confirm("이 미션을 진행 목록에서 종료할까요?"))return;await rpc("archive_mission",{p_access_token:session.accessToken,p_mission_id:item.id});await loadMissions();});}else if(!item.completed_at){actions.innerHTML='<button class="done" type="button">완료하기</button>';actions.firstElementChild.addEventListener("click",()=>showComplete(card,item));}card.append(actions);return card;}
function showComplete(card,item){if(card.querySelector(".complete-box"))return;const box=document.createElement("div");box.className="complete-box";box.innerHTML=`<label>완료 메모 (선택)</label><textarea class="complete-note" maxlength="1000"></textarea>${item.photo_required?'<label>완료 사진 (필수)</label><input class="complete-photo" type="file" accept="image/*" capture="environment"><img class="photo-preview" alt="완료 사진 미리보기">':""}<button class="primary submit-complete" type="button">완료 제출</button>`;card.append(box);let photo="";const input=box.querySelector(".complete-photo");if(input)input.addEventListener("change",async()=>{if(!input.files[0])return;photo=await fileToData(input.files[0]);const preview=box.querySelector(".photo-preview");preview.src=photo;preview.style.display="block";});box.querySelector(".submit-complete").addEventListener("click",async event=>{if(item.photo_required&&!photo){alert("완료 사진을 올려주세요.");return;}event.currentTarget.disabled=true;try{await rpc("complete_mission",{p_access_token:session.accessToken,p_mission_id:item.id,p_note:box.querySelector(".complete-note").value.trim(),p_photo_data_url:photo});await loadMissions();}catch(error){message.textContent=error.message;event.currentTarget.disabled=false;}});}
async function loadMissions(){const data=await rpc("list_missions",{p_access_token:session.accessToken});missionsNode.replaceChildren();if(!data.missions.length){missionsNode.innerHTML='<div class="card empty">진행 중인 미션이 없습니다.</div>';return;}data.missions.forEach(item=>missionsNode.append(renderMission(item)));}
document.getElementById("missionForm").addEventListener("submit",async event=>{event.preventDefault();const button=event.submitter,ownerMessage=document.getElementById("ownerMessage");button.disabled=true;ownerMessage.textContent="";try{const target=document.getElementById("target").value;await rpc("save_mission",{p_access_token:session.accessToken,p_mission:{title:document.getElementById("title").value.trim(),description:document.getElementById("description").value.trim(),timing:document.getElementById("timing").value,priority:document.getElementById("priority").value,target_employee_ids:target?[target]:[],photo_required:document.getElementById("photoRequired").checked,estimated_minutes:Number(document.getElementById("minutes").value)||30,due_at:document.getElementById("dueAt").value?new Date(document.getElementById("dueAt").value).toISOString():null}});event.target.reset();document.getElementById("minutes").value=30;ownerMessage.style.color="#16834b";ownerMessage.textContent="미션이 등록되었습니다.";await loadMissions();}catch(error){ownerMessage.textContent=error.message;}finally{button.disabled=false;}});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);isOwner=session.sessionKind==="owner"&&config.can_manage;document.getElementById("property").textContent=config.property.name;document.title=`${config.property.name} · 미션`;if(isOwner){document.getElementById("ownerForm").hidden=false;document.getElementById("intro").textContent="근무자에게 전달할 업무를 등록하고 완료 현황을 확인합니다.";config.employees.forEach(employee=>document.getElementById("target").add(new Option(employee.display_name,employee.employee_id)));}await loadMissions();})().catch(error=>{message.textContent=error.message;});
</script></body></html>
