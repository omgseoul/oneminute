name: Verify online reservation management
on:
  pull_request:
    paths: ['assets/booking-channels/**', 'property-selector.js', 'select-picker.js', 'online.*', 'app.html', 'supabase/functions/beds24/**', 'supabase/setup/beds24*.sql', 'supabase/setup/translation*.sql', 'platform-translation.js', 'platform-admin.html', 'operations-center.js', 'subscription.html', 'service-access.js', 'tests/online/**', 'supabase/functions/dispatch-notification/**', '.github/workflows/online-management-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tests/attendance-nfc
      - run: cd tests/attendance-nfc && npx playwright install --with-deps chromium
      - name: Verify tenancy, credential storage, approvals and delivery
        env: {NODE_PATH: '${{ github.workspace }}/tests/attendance-nfc/node_modules'}
        run: |
          node --check online.js
          node tests/online/database.cjs
          node tests/online/edge.mjs
          node tests/online/ui.cjs
          node tests/online/followup-ui.cjs
          node tests/online/translation-ui.cjs
          node tests/online/translation-edge.mjs
          node tests/operations-center-ui.cjs
          node tests/online/layout.cjs
          node tests/online/branches.cjs
          node tests/online/navigation.cjs
          node tests/select-picker-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMS-online-compact-multi-preview
          path: /tmp/online-*.png
