plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.omgworks.calendar'
    compileSdk 35
    defaultConfig {
        applicationId 'com.omgworks.calendar'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        release {
            if (System.getenv('OMS_KEYSTORE_FILE')) {
                storeFile file(System.getenv('OMS_KEYSTORE_FILE'))
                storePassword System.getenv('OMS_STORE_PASSWORD')
                keyAlias System.getenv('OMS_KEY_ALIAS')
                keyPassword System.getenv('OMS_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('OMS_KEYSTORE_FILE')) signingConfig signingConfigs.release } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.withType(Test).configureEach { testLogging { exceptionFormat = 'full' } }
