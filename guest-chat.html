<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>게스트 채팅</title>
  <link rel="stylesheet" href="guest-support.css?v=20261007-email">
  <link rel="stylesheet" href="guest-portal.css">
  <link rel="stylesheet" href="chat-media.css?v=20261007">
  <link rel="stylesheet" href="top-layout.css?v=20261005b">
</head>
<body>
  <div class="chat-page">
    <header class="chat-head">
      <div class="top"><a id="back" class="back" href="messages.html?tab=guest" aria-label="뒤로가기">‹ 목록</a><span class="badge online" id="assignment">연결 중</span></div>
      <h1 id="roomTitle" style="margin-top:14px">게스트 채팅</h1><p id="roomInfo" class="help"></p><div class="chat-controls" id="controls" hidden></div>
    </header>
    <div id="timeline" class="timeline chat-loading" aria-live="polite" aria-relevant="additions"><div class="empty" id="loading">대화를 불러오는 중입니다.</div></div>
    <form id="composer" class="composer"><div id="photoPending" class="photo-pending" hidden></div><div class="row"><label class="photo-button" aria-label="사진 첨부" for="photoInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg></label><input id="photoInput" type="file" accept="image/*" hidden><textarea id="body" placeholder="메시지를 입력하세요" maxlength="4000" rows="1" aria-label="메시지 내용"></textarea><button class="btn primary" id="send" type="submit" aria-label="보내기">➤</button></div><div class="status" id="status" role="status"></div></form>
  </div>
  <section id="photoViewer" class="photo-viewer" hidden aria-modal="true" role="dialog" aria-label="사진 전체화면">
    <header class="photo-viewer-head"><button id="photoViewerClose" class="viewer-icon" type="button" aria-label="사진 닫기">‹</button><div class="photo-viewer-title"><strong id="photoViewerName">사진</strong><span id="photoViewerDate"></span></div><button id="photoGalleryOpen" class="viewer-icon grid-icon" type="button" aria-label="대화 사진첩 보기"><i></i><i></i><i></i><i></i></button></header>
    <div id="photoStage" class="photo-stage"><button id="photoPrevious" class="photo-arrow previous" type="button" aria-label="이전 사진">‹</button><img id="photoViewerImage" alt="대화 첨부 사진"><button id="photoNext" class="photo-arrow next" type="button" aria-label="다음 사진">›</button></div>
    <footer class="photo-viewer-foot"><div id="photoThumbs" class="photo-thumbs"></div><strong id="photoCount"></strong></footer>
  </section>
  <section id="photoGallery" class="photo-gallery" hidden aria-modal="true" role="dialog" aria-label="대화 사진첩"><header><button id="photoGalleryClose" type="button" aria-label="사진첩 닫기">‹</button><h2>대화 사진</h2><span id="galleryCount"></span></header><div id="galleryStatus" class="gallery-status" role="status"></div><div id="photoGrid" class="photo-grid"></div></section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script>
  <script src="photo-codec.js?v=20261007-1920"></script><script src="guest-support-client.js?v=20261001-ui"></script><script src="guest-email-link.js?v=20260930-email-link"></script><script src="guest-reply-status.js?v=20261001"></script><script src="guest-chat.js?v=20261007-gallery"></script>
</body>
</html>
