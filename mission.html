:root{--navy:#153252;--blue:#276cc4;--red:#d64049;--gold:#f5a623;--green:#2c9b69;--ink:#17243a;--muted:#708095;--line:#dce6f2;--bg:#f4f7fc;--soft:#eaf3ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.shell{width:min(100%,720px);margin:auto;padding:22px 16px 70px}.top{display:flex;align-items:center}.back{color:#6f8096;text-decoration:none;font-weight:800}.add{display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:14px;background:var(--blue);color:white;font-size:27px;font-weight:500;line-height:1;box-shadow:0 5px 14px rgba(39,108,196,.22)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 2px 13px}.head-copy{min-width:0}.head h1{margin:0;color:var(--navy);font-size:31px;letter-spacing:-1.5px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.summary-head strong{color:var(--navy);font-size:13px}.worker-filter{width:auto;max-width:190px;padding:8px 32px 8px 11px;border:1px solid #c8d6e7;border-radius:10px;background-color:white;color:var(--navy);font-size:11px;font-weight:900;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.summary button{min-width:0;padding:8px 3px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--navy);box-shadow:0 3px 10px rgba(35,70,112,.04)}.summary strong{display:block;font-size:17px}.summary span{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:900}.summary .danger strong{color:var(--red)}.summary .done strong{color:var(--green)}.section{margin-top:20px;scroll-margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}.section-head h2{margin:0;color:var(--navy);font-size:19px}.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;margin-left:6px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:11px}.toggle{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:900}.mission{position:relative;margin-top:9px;padding:15px;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 6px 18px rgba(35,70,112,.055)}.mission.overdue{border:1.5px solid #efadb2}.mission.completed{opacity:.88;cursor:pointer}.mission-top{display:flex;gap:8px;align-items:flex-start}.mission-body{min-width:0;flex:1}.star{flex:0 0 auto;color:var(--gold);font-size:22px;line-height:1;letter-spacing:-3px}.star.urgent{color:var(--red)}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.badge{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:10px;font-weight:900}.badge.overdue{background:#fff0f1;color:var(--red)}.badge.completed{background:#eaf8f1;color:var(--green)}.mission h3{margin:0;color:var(--navy);font-size:18px;line-height:1.35}.mission p{margin:8px 0;white-space:pre-line;color:#52657d;font-size:13px;line-height:1.55}.meta{display:flex;flex-wrap:wrap;gap:5px 12px;color:#8190a2;font-size:11px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;min-height:42px;border:1px solid #cad8e9;border-radius:12px;background:white;color:var(--navy);font-weight:900}.actions .done{border:0;background:var(--blue);color:white}.actions .delete{color:var(--red)}.empty{padding:26px 16px;border:1px dashed #cbd8e8;border-radius:18px;background:rgba(255,255,255,.55);color:var(--muted);text-align:center;font-size:13px}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:30px;background:rgba(17,34,56,.42)}.overlay[hidden]{display:none}.sheet{width:min(100%,720px);max-height:93vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:white;box-shadow:0 -15px 50px rgba(17,34,56,.18)}.sheet-top{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;color:var(--navy);font-size:23px}.close{width:38px;height:38px;border:0;border-radius:12px;background:#eff4fa;color:var(--navy);font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:13px 0 6px;color:var(--navy);font-size:12px;font-weight:900}input,select,textarea{width:100%;padding:12px;border:1px solid #c8d6e7;border-radius:12px;background:white;color:var(--ink)}textarea{min-height:96px;resize:vertical}.description-wrap{position:relative}.description-wrap textarea{padding-right:52px}.camera-button{position:absolute;right:9px;bottom:10px;display:grid;place-items:center;width:38px;height:38px;border:1px solid #c8d6e7;border-radius:11px;background:#f7faff;color:var(--blue);font-size:19px}.mission-photo-preview{display:block;width:100%;max-height:220px;margin-top:9px;object-fit:contain;border-radius:12px;background:#edf3f9}.mission-photo-preview[hidden]{display:none}.mission-photo{width:100%;max-height:260px;margin:10px 0 2px;object-fit:contain;border-radius:12px;background:#edf3f9}.check{display:flex;align-items:center;gap:8px;margin-top:14px}.check input{width:auto}.primary{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:14px;background:var(--blue);color:white;font-size:16px;font-weight:900}.message{min-height:20px;margin-top:10px;color:#bf3440;font-size:12px;text-align:center}.photo-preview{display:none;width:100%;max-height:260px;margin-top:9px;object-fit:contain;border-radius:12px;background:#edf3f9}.completion-list{display:grid;gap:10px;margin-top:14px}.completion-item{padding:13px;border-radius:14px;background:#f5f8fc}.completion-item strong{display:block;color:var(--navy)}.completion-item p{margin:7px 0;color:#52657d;white-space:pre-line}.completion-item img{width:100%;max-height:300px;object-fit:contain;border-radius:10px}.celebrate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(17,34,56,.52)}.celebrate[hidden]{display:none}.celebrate-card{width:min(100%,380px);padding:24px;border-radius:28px;background:white;text-align:center;box-shadow:0 25px 70px rgba(17,34,56,.28);animation:pop .3s ease-out}.celebrate img{width:220px;max-width:82%;border-radius:24px}.celebrate h2{margin:14px 0 4px;color:var(--navy);font-size:27px;white-space:pre-line}.celebrate p{margin:0;color:var(--muted)}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:510px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid label{font-size:11px}.grid input,.grid select{padding:11px 8px}.head h1{font-size:29px}.worker-filter{max-width:158px}.summary{gap:4px}}.mission{padding:13px 14px;cursor:pointer}.mission-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}.mission-title{display:flex;align-items:center;min-width:0;gap:5px}.mission-title h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.mission-chip{padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:9px;font-weight:900;white-space:nowrap}.mission-chip.target{max-width:82px;overflow:hidden;text-overflow:ellipsis;color:#64748b;background:#f1f4f8}.mission-preview-row{display:flex;align-items:center;gap:8px;margin-top:7px}.mission-preview-row p{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#617187;font-size:11px}.photo-indicator{color:var(--blue);font-size:15px}.mission-status{margin-top:6px;color:#8b98aa;font-size:9px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.creator-display{background:#f2f5f9!important;color:#617187!important}.full-field{display:block}.option-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.option-row .check{margin:0}.priority-inline{display:flex;align-items:center;gap:5px;padding:3px 5px;border:0;background:transparent;color:var(--navy);font-size:12px;font-weight:900}.priority-inline .star-toggle{color:#aab4c1;font-size:28px;line-height:1}.detail-summary{padding:14px;border-radius:15px;background:#f6f9fd}.detail-summary p{white-space:pre-line;color:#52657d;line-height:1.55}.detail-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:#7b899b;font-size:11px}.detail-actions{display:flex;gap:8px;margin-top:13px}.detail-actions button{flex:1;min-height:43px;border:1px solid #cad8e9;border-radius:12px;background:#fff;color:var(--navy);font-weight:900}.detail-actions .done{border:0;background:var(--blue);color:#fff}.detail-actions .delete{color:var(--red)}

</style></head><body><main class="shell"><div class="top"><a class="back" href="app.html">‹ 메인으로</a></div><header class="head"><div class="head-copy"><h1 id="title">미션</h1><p id="intro">오늘의 업무와 전달사항을 확인합니다.</p></div><button id="newMission" class="add" type="button" aria-label="미션 추가" title="미션 추가" hidden>＋</button></header><div class="summary-head"><strong>미션 현황</strong><select id="workerFilter" class="worker-filter" aria-label="근무자 선택"></select></div><nav class="summary" aria-label="미션 현황"><button class="danger" data-jump="overdue"><strong id="sumOverdue">0</strong><span>지연</span></button><button data-jump="today"><strong id="sumToday">0</strong><span>당일</span></button><button data-jump="this_week"><strong id="sumWeek">0</strong><span>금주</span></button><button data-jump="anytime"><strong id="sumAny">0</strong><span>아무때나</span></button><button class="done" data-jump="completed"><strong id="sumDone">0</strong><span>완료</span></button></nav><div id="sections"></div><div id="message" class="message"></div></main>

<div id="editorOverlay" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2 id="editorHeading">새 미션</h2><button class="close" data-close="editorOverlay" type="button">×</button></div><form id="missionForm"><input id="missionId" type="hidden"><input id="priority" type="hidden" value="normal"><label for="missionTitle">미션 제목</label><input id="missionTitle" maxlength="100" required><label for="description">상세 업무</label><div class="description-wrap"><textarea id="description" maxlength="2000" placeholder="해야 할 일을 구체적으로 적어주세요."></textarea><button id="descriptionCamera" class="camera-button" type="button" aria-label="상세 업무 사진 추가" title="사진 추가">📷</button><input id="descriptionPhotoInput" type="file" accept="image/*" capture="environment" hidden></div><img id="descriptionPhotoPreview" class="mission-photo-preview" alt="상세 업무 사진 미리보기" hidden><div id="targetBox"><label for="target">담당 근무자</label><select id="target"><option value="">전체 직원</option></select></div><div class="editor-grid"><div><label for="timing">기한 구분</label><select id="timing"><option value="today">당일</option><option value="this_week">금주</option><option value="anytime">아무때나</option></select></div><div><label for="creatorDisplay">생성자</label><input id="creatorDisplay" class="creator-display" readonly></div></div><label class="full-field" for="dueAt">마감일</label><input id="dueAt" type="date"><div class="option-row"><label class="check"><input id="photoRequired" type="checkbox"> 완료 사진 필수</label><button id="priorityStar" class="priority-inline" type="button" aria-pressed="false" aria-label="중요 미션 표시"><span class="star-toggle">☆</span><span>중요</span></button></div><button id="saveMission" class="primary" type="submit">미션 저장</button><div id="editorMessage" class="message"></div></form></section></div>

<div id="completeOverlay" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2 id="completeHeading">미션 완료</h2><button class="close" data-close="completeOverlay" type="button">×</button></div><form id="completeForm"><label for="completeNote">내 작업내용</label><textarea id="completeNote" maxlength="1000" required placeholder="어떻게 처리했는지 입력해주세요."></textarea><div id="photoBox" hidden><label for="completePhoto">완료 사진 <span id="photoMark"></span></label><input id="completePhoto" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photo-preview" alt="완료 사진 미리보기"></div><button id="submitComplete" class="primary" type="submit">완료 제출</button><div id="completeMessage" class="message"></div></form></section></div>
<div id="detailOverlay" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2 id="detailHeading">완료 내역</h2><button class="close" data-close="detailOverlay" type="button">×</button></div><div id="detailBody" class="completion-list"></div></section></div>
<div id="celebrate" class="celebrate" hidden><div class="celebrate-card"><img id="celebrateDog" alt="박수치는 시바견"><h2>미션 클리어<br>수고하셨습니다. 👏</h2><p>완료 현황에 반영했어요.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="work-config.js"></script><script src="happy-clapping-shiba.js"></script><script>
let session=null,config=null,isOwner=false,missions=[],completionTarget=null,completionPhoto="",descriptionPhoto="";const sectionsNode=document.getElementById("sections"),message=document.getElementById("message"),workerFilter=document.getElementById("workerFilter");const sectionInfo=[{key:"overdue",label:"지연된 미션"},{key:"today",label:"당일"},{key:"this_week",label:"금주"},{key:"anytime",label:"아무때나"},{key:"completed",label:"완료"}];const expanded={};
function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);}
function fmt(value){return value?new Date(value).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";}
function toLocalDate(value){if(!value)return"";const date=new Date(value),offset=date.getTimezoneOffset();return new Date(date.getTime()-offset*60000).toISOString().slice(0,10);}
function fmtDueDate(value){return value?new Date(value).toLocaleDateString("ko-KR",{year:"numeric",month:"numeric",day:"numeric"}):"";}
function isComplete(item){const selected=workerFilter.value;if(selected)return(item.completion_employee_ids||item.completions?.map(entry=>entry.employee_id)||[]).includes(selected);return Number(item.target_count)>0&&Number(item.completed_count)>=Number(item.target_count);}
function sectionKey(item){if(isComplete(item))return"completed";if(item.due_at&&new Date(item.due_at)<new Date())return"overdue";return item.timing;}
function priorityName(value){return({normal:"보통",important:"중요",urgent:"긴급"})[value]||"보통";}
async function rpc(name,args){const{data,error}=await window.omgSupabase.rpc(name,args);if(error||!data?.ok)throw new Error(data?.message||"미션을 처리하지 못했습니다.");return data;}
function fileToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,1100/Math.max(image.width,image.height)),canvas=document.createElement("canvas");canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.76));};image.src=reader.result;};reader.readAsDataURL(file);});}
function openDetails(item){const targets=item.target_names?.length?item.target_names.join(", "):"전체 직원",completions=Array.isArray(item.completions)&&item.completions.length?item.completions:(item.completed_at?[{employee_name:session.employeeName,note:item.completion_note,photo:item.completion_photo,completed_at:item.completed_at}]:[]);document.getElementById("detailHeading").textContent=item.title;const body=document.getElementById("detailBody");body.innerHTML=`<div class="detail-summary"><div class="detail-meta"><span>${({today:"당일",this_week:"금주",anytime:"아무때나"})[item.timing]}</span><span>담당 ${esc(targets)}</span><span>생성자 ${esc(item.creator_name||"관리자")}</span>${item.due_at?`<span>마감 ${fmtDueDate(item.due_at)}</span>`:""}${item.priority!=="normal"?"<span>★ 중요</span>":""}</div><p>${esc(item.description||"상세 업무가 없습니다.")}</p>${item.description_photo?`<img class="mission-photo" src="${esc(item.description_photo)}" alt="상세 업무 참고 사진">`:""}</div><div id="detailActions" class="detail-actions"></div><h3>완료 내역</h3><div id="completionDetails"></div>`;const actions=body.querySelector("#detailActions");if(isOwner){actions.innerHTML='<button class="edit" type="button">수정</button><button class="delete" type="button">종료</button>';actions.children[0].onclick=()=>{closeOverlay("detailOverlay");openEditor(item);};actions.children[1].onclick=async()=>{if(!confirm(`‘${item.title}’ 미션을 목록에서 종료할까요?`))return;await rpc("archive_mission",{p_access_token:session.accessToken,p_mission_id:item.id});closeOverlay("detailOverlay");await loadMissions();};}else if(!isComplete(item)&&canComplete(item)&&(!workerFilter.value||workerFilter.value===session.employeeId)){actions.innerHTML='<button class="done" type="button">완료하기</button>';actions.firstElementChild.onclick=()=>{closeOverlay("detailOverlay");openComplete(item);};}else actions.remove();const list=body.querySelector("#completionDetails");if(!completions.length)list.innerHTML='<div class="empty">표시할 완료 내역이 없습니다.</div>';else completions.forEach(entry=>{const node=document.createElement("article");node.className="completion-item";node.innerHTML=`<strong>${esc(entry.employee_name||"근무자")}</strong><span class="meta">${fmt(entry.completed_at)}</span><p>${esc(entry.note||"완료 메모 없음")}</p>${entry.photo?`<img src="${esc(entry.photo)}" alt="완료 사진">`:""}`;list.append(node);});showOverlay("detailOverlay");}
function canComplete(item){return !isOwner&&(!item.target_employee_ids?.length||item.target_employee_ids.includes(session.employeeId));}
function missionCard(item){const complete=isComplete(item),overdue=sectionKey(item)==="overdue",targets=item.target_names?.length?item.target_names.join(", "):"전체 직원",timing=({today:"당일",this_week:"금주",anytime:"아무때나"})[item.timing];const article=document.createElement("article");article.className=`mission${overdue?" overdue":""}${complete?" completed":""}`;article.innerHTML=`<div class="mission-row"><div class="mission-title">${item.priority!=="normal"?'<span class="star" aria-label="중요">★</span>':""}<h3>${esc(item.title)}</h3></div><span class="mission-chip">${overdue?"지연":complete?"완료":timing}</span><span class="mission-chip target">${esc(targets)}</span></div><div class="mission-preview-row"><p>${esc((item.description||"상세 업무 없음").split(/\n/)[0])}</p>${item.description_photo?'<span class="photo-indicator" aria-label="사진 있음">📷</span>':""}</div><div class="mission-status">생성자 ${esc(item.creator_name||"관리자")} · 완료 ${Number(item.completed_count)||0}/${Number(item.target_count)||0}</div>`;article.onclick=()=>openDetails(item);return article;}
function filteredMissions(){const employeeId=workerFilter.value;if(!employeeId)return missions;return missions.filter(item=>!item.target_employee_ids?.length||item.target_employee_ids.includes(employeeId));}
function render(){sectionsNode.replaceChildren();const groups=Object.fromEntries(sectionInfo.map(section=>[section.key,[]]));filteredMissions().forEach(item=>groups[sectionKey(item)].push(item));document.getElementById("sumOverdue").textContent=groups.overdue.length;document.getElementById("sumToday").textContent=groups.today.length;document.getElementById("sumWeek").textContent=groups.this_week.length;document.getElementById("sumAny").textContent=groups.anytime.length;document.getElementById("sumDone").textContent=groups.completed.length;sectionInfo.forEach(info=>{const wrap=document.createElement("section");wrap.className="section";wrap.id=`section-${info.key}`;const items=groups[info.key],limit=expanded[info.key]?items.length:2;wrap.innerHTML=`<div class="section-head"><h2>${info.label}<span class="count">${items.length}</span></h2>${items.length>2?`<button class="toggle" type="button">${expanded[info.key]?"접기":"모두 보기"}</button>`:""}</div>`;if(!items.length){wrap.insertAdjacentHTML("beforeend",`<div class="empty">${info.label}이 없습니다.</div>`);}else items.slice(0,limit).forEach(item=>wrap.append(missionCard(item)));if(items.length>2){const button=wrap.querySelector(".toggle");button.onclick=()=>{expanded[info.key]=!expanded[info.key];render();document.getElementById(`section-${info.key}`).scrollIntoView({behavior:"smooth",block:"start"});};}sectionsNode.append(wrap);});}
function fillWorkerFilter(employees){const selected=workerFilter.options.length?workerFilter.value:(session.employeeId||"");workerFilter.replaceChildren(new Option("All",""));(employees||[]).forEach(employee=>workerFilter.add(new Option(employee.display_name,employee.employee_id)));if([...workerFilter.options].some(option=>option.value===selected))workerFilter.value=selected;}
async function loadMissions(){message.textContent="";const data=await rpc("list_missions",{p_access_token:session.accessToken});missions=data.missions||[];fillWorkerFilter(data.employees||config.employees||[]);render();}
function closeOverlay(id){document.getElementById(id).hidden=true;document.body.style.overflow="";}function showOverlay(id){document.getElementById(id).hidden=false;document.body.style.overflow="hidden";}
function setPriorityStar(selected){const priority=document.getElementById("priority"),button=document.getElementById("priorityStar"),star=button.querySelector(".star-toggle");priority.value=selected?"important":"normal";star.textContent=selected?"★":"☆";button.setAttribute("aria-pressed",String(selected));star.style.color=selected?"#f5a623":"#aab4c1";}
function openEditor(item=null){document.getElementById("missionForm").reset();document.getElementById("missionId").value=item?.id||"";document.getElementById("editorHeading").textContent=item?"미션 수정":"새 미션";document.getElementById("missionTitle").value=item?.title||"";document.getElementById("description").value=item?.description||"";descriptionPhoto=item?.description_photo||"";const missionPreview=document.getElementById("descriptionPhotoPreview");missionPreview.src=descriptionPhoto;missionPreview.hidden=!descriptionPhoto;document.getElementById("timing").value=item?.timing||"today";document.getElementById("creatorDisplay").value=item?.creator_name||(isOwner?"관리자":session.employeeName);setPriorityStar(Boolean(item&&item.priority!=="normal"));document.getElementById("target").value=isOwner&&item?.target_employee_ids?.length===1?item.target_employee_ids[0]:isOwner?"":session.employeeId;document.getElementById("dueAt").value=toLocalDate(item?.due_at);document.getElementById("photoRequired").checked=Boolean(item?.photo_required);document.getElementById("editorMessage").textContent="";showOverlay("editorOverlay");}
function openComplete(item){completionTarget=item;completionPhoto="";document.getElementById("completeForm").reset();document.getElementById("completeHeading").textContent=item.title;document.getElementById("photoBox").hidden=!item.photo_required;document.getElementById("photoMark").textContent=item.photo_required?"(필수)":"";document.getElementById("photoPreview").style.display="none";document.getElementById("completeMessage").textContent="";showOverlay("completeOverlay");}
document.querySelectorAll("[data-close]").forEach(button=>button.onclick=()=>closeOverlay(button.dataset.close));document.querySelectorAll(".overlay").forEach(overlay=>overlay.addEventListener("click",event=>{if(event.target===overlay)closeOverlay(overlay.id);}));document.querySelectorAll("[data-jump]").forEach(button=>button.onclick=()=>document.getElementById(`section-${button.dataset.jump}`).scrollIntoView({behavior:"smooth"}));document.getElementById("newMission").onclick=()=>openEditor();document.getElementById("priorityStar").onclick=()=>setPriorityStar(document.getElementById("priority").value==="normal");document.getElementById("descriptionCamera").onclick=()=>document.getElementById("descriptionPhotoInput").click();document.getElementById("descriptionPhotoInput").addEventListener("change",async event=>{if(!event.target.files[0])return;try{descriptionPhoto=await fileToData(event.target.files[0]);const preview=document.getElementById("descriptionPhotoPreview");preview.src=descriptionPhoto;preview.hidden=false;}catch{document.getElementById("editorMessage").textContent="사진을 읽지 못했습니다.";}event.target.value="";});
document.getElementById("missionForm").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveMission"),notice=document.getElementById("editorMessage"),target=isOwner?document.getElementById("target").value:session.employeeId,dueDate=document.getElementById("dueAt").value;button.disabled=true;notice.textContent="";try{await rpc("save_mission",{p_access_token:session.accessToken,p_mission:{id:document.getElementById("missionId").value||null,title:document.getElementById("missionTitle").value.trim(),description:document.getElementById("description").value.trim(),description_photo:descriptionPhoto,timing:document.getElementById("timing").value,priority:document.getElementById("priority").value,target_employee_ids:target?[target]:[],photo_required:document.getElementById("photoRequired").checked,due_at:dueDate?new Date(`${dueDate}T23:59:59`).toISOString():null}});closeOverlay("editorOverlay");await loadMissions();}catch(error){notice.textContent=error.message;}finally{button.disabled=false;}});
document.getElementById("completePhoto").addEventListener("change",async event=>{if(!event.target.files[0])return;try{completionPhoto=await fileToData(event.target.files[0]);const preview=document.getElementById("photoPreview");preview.src=completionPhoto;preview.style.display="block";}catch{document.getElementById("completeMessage").textContent="사진을 읽지 못했습니다.";}});
document.getElementById("completeForm").addEventListener("submit",async event=>{event.preventDefault();const note=document.getElementById("completeNote").value.trim(),button=document.getElementById("submitComplete"),notice=document.getElementById("completeMessage");if(!note){notice.textContent="내 작업내용을 입력해주세요.";return;}if(completionTarget.photo_required&&!completionPhoto){notice.textContent="완료 사진을 올려주세요.";return;}button.disabled=true;notice.textContent="";try{await rpc("complete_mission",{p_access_token:session.accessToken,p_mission_id:completionTarget.id,p_note:note,p_photo_data_url:completionPhoto});closeOverlay("completeOverlay");const popup=document.getElementById("celebrate");popup.hidden=false;setTimeout(()=>{popup.hidden=true;loadMissions().catch(error=>message.textContent=error.message);},2000);}catch(error){notice.textContent=error.message;button.disabled=false;}});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;config=await window.omgWorkConfig.load(session.accessToken);isOwner=session.sessionKind==="owner"&&config.can_manage;document.getElementById("title").textContent=isOwner?"미션 관리":"미션";document.getElementById("intro").textContent=isOwner?`${config.property.name} 업무를 만들고 완료 현황을 관리합니다.`:`${config.property.name} · 오늘의 업무와 전달사항`;document.getElementById("celebrateDog").src=window.OMG_HAPPY_SHIBA||"shiba-worker-logo-v2.png";document.getElementById("newMission").hidden=false;if(isOwner){config.employees.forEach(employee=>document.getElementById("target").add(new Option(employee.display_name,employee.employee_id)));}else{const target=document.getElementById("target");target.replaceChildren(new Option(session.employeeName,session.employeeId));target.value=session.employeeId;target.disabled=true;}workerFilter.addEventListener("change",render);await loadMissions();})().catch(error=>{message.textContent=error.message;});
</script></body></html>
