<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>내 정보</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js?v=20260929-chat-taps"></script>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#dfe8f4;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.shell{visibility:hidden;opacity:0;width:min(100%,600px);margin:auto;padding:22px 16px calc(38px + env(safe-area-inset-bottom))}.shell.ready{visibility:visible;opacity:1}.back{color:#718198;text-decoration:none;font-size:13px}.head{margin:18px 2px 22px}.head h1{margin:0;color:var(--navy);font-size:31px}.head p{margin:9px 0 0;color:var(--muted);font-size:13px}.card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 9px;padding:19px;border:1px solid var(--line);border-radius:21px;background:#fff;box-shadow:0 7px 22px rgba(42,78,120,.055)}label{display:grid;gap:5px;min-width:0;color:#7b899a;font-size:11px;font-weight:900}input,.duration{width:100%;height:46px;min-width:0;padding:10px 11px;border:1px solid #cbd8e8;border-radius:12px;background:#fff;color:var(--ink);font-size:13px;outline:none}input:focus{border-color:#6a9ddd;box-shadow:0 0 0 3px rgba(36,103,189,.1)}.duration{display:flex;align-items:center;background:#f5f8fc;color:var(--navy);font-weight:800}.save{grid-column:1/-1;height:54px;margin-top:8px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:900}.save:disabled{opacity:.55}.message{grid-column:1/-1;min-height:20px;color:#c33;font-size:12px;text-align:center}.message.ok{color:#16834b}@media(max-width:360px){.card{padding:16px;gap:9px 7px}input,.duration{padding:9px 8px;font-size:12px}}
</style></head><body><main id="shell" class="shell"><a class="back" href="app.html">← Home</a><header class="head"><h1>내 정보</h1><p>내 근무자 정보를 확인하고 수정합니다.</p></header><form id="profileForm" class="card" inert>
<label>이름<input id="displayName" type="text" maxlength="50" required placeholder="이름"></label><label>직무<input id="jobTitle" type="text" maxlength="60" placeholder="직무 입력"></label>
<label>연락처<input id="contactPhone" type="tel" maxlength="40" placeholder="연락처 입력"></label><label>계좌번호<input id="bankAccount" type="text" maxlength="120" placeholder="은행명·계좌번호"></label>
<label>출근<input id="clockIn" type="time"></label><label>퇴근<input id="clockOut" type="time"></label>
<label>근무시간<span id="duration" class="duration">-</span></label><label>지각 기준(분)<input id="lateness" type="number" min="0" max="720" inputmode="numeric" placeholder="0"></label>
<button id="saveButton" class="save" type="submit">내 정보 저장</button><div id="message" class="message" role="alert"></div>
</form><a href="contracts.html" style="display:block;margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--navy);font-weight:800;text-decoration:none">내 문서 · 근로계약서 <span style="float:right">›</span></a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
const form=document.getElementById("profileForm"),message=document.getElementById("message"),clockIn=document.getElementById("clockIn"),clockOut=document.getElementById("clockOut");let session=null;
function duration(){if(!clockIn.value||!clockOut.value){document.getElementById("duration").textContent="-";return;}const[a,b]=clockIn.value.split(":").map(Number),[c,d]=clockOut.value.split(":").map(Number);let minutes=c*60+d-(a*60+b);if(minutes<=0)minutes+=1440;document.getElementById("duration").textContent=`${Math.floor(minutes/60)}시간${minutes%60?` ${minutes%60}분`:""}`;}
function fill(profile){document.getElementById("displayName").value=profile.display_name||"";document.getElementById("jobTitle").value=profile.job_title||"";document.getElementById("contactPhone").value=profile.contact_phone||"";document.getElementById("bankAccount").value=profile.bank_account||"";clockIn.value=profile.scheduled_clock_in||"";clockOut.value=profile.scheduled_clock_out||"";document.getElementById("lateness").value=profile.lateness_threshold_minutes??"";duration();}
clockIn.oninput=clockOut.oninput=duration;
form.addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("saveButton");button.disabled=true;message.textContent="";message.className="message";try{const profile={display_name:document.getElementById("displayName").value.trim(),job_title:document.getElementById("jobTitle").value.trim(),contact_phone:document.getElementById("contactPhone").value.trim(),bank_account:document.getElementById("bankAccount").value.trim(),scheduled_clock_in:clockIn.value||null,scheduled_clock_out:clockOut.value||null,lateness_threshold_minutes:document.getElementById("lateness").value===""?null:Number(document.getElementById("lateness").value)};const{data,error}=await window.omgSupabase.rpc("employee_self_profile",{p_access_token:session.accessToken,p_action:"save",p_profile:profile});if(error||!data?.ok)throw new Error(data?.message||"내 정보를 저장하지 못했습니다.");fill(data);message.className="message ok";message.textContent="내 정보가 저장되었습니다.";}catch(error){message.textContent=error.message||"내 정보를 저장하지 못했습니다.";}finally{button.disabled=false;}});
(async()=>{session=await window.omgSession.require({allowCompleted:true});if(!session)return;if(session.sessionKind!=="staff"){location.replace("app.html");return;}const{data,error}=await window.omgSupabase.rpc("employee_self_profile",{p_access_token:session.accessToken,p_action:"get",p_profile:null});if(error||!data?.ok)throw new Error(data?.message||"내 정보를 불러오지 못했습니다.");fill(data);form.inert=false;document.getElementById("shell").classList.add("ready");window.omgTransition.ready();})().catch(error=>{message.textContent=error.message;document.getElementById("shell").classList.add("ready");window.omgTransition.ready();});
</script></body></html>
