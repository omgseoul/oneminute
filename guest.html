<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>숙소 안내 · 게스트 채팅</title><link rel="stylesheet" href="guest-support.css"></head><body><main id="portal"><div class="hero"><div class="eyebrow">WELCOME TO YOUR STAY</div><h1 id="propertyName">숙소 안내</h1><p>편안한 숙박을 도와드릴게요.</p></div><div id="guides"></div><div id="status" class="status" role="status">안내를 불러오는 중입니다.</div><p class="help">QR 현장 고객 대응</p></main><dialog id="entry"><div class="top"><h2>무엇을 도와드릴까요?</h2><button class="icon-btn" aria-label="닫기" type="button" onclick="this.closest('dialog').close()">×</button></div><p class="help">예약 정보를 입력하면 숙소 직원과 대화를 시작할 수 있어요.</p><form id="entryForm"><label class="field">예약자 이름<input name="name" placeholder="예약에 사용한 이름" autocomplete="name" maxlength="60" required></label><div class="grid2"><label class="field">체크인<input name="check_in" type="date" required></label><label class="field">체크아웃<input name="check_out" type="date" required></label></div><label class="field">객실번호 <span class="muted">선택 · 아직 모르면 비워두세요</span><input name="room_number" maxlength="40" placeholder="아직 모르겠어요"></label><p class="help">입력한 정보와 대화는 숙소 직원이 고객 응대에 사용합니다. 이 입력은 예약 확인 절차를 대신하지 않습니다.</p><div id="entryStatus" class="status" role="status"></div><button class="btn primary wide" type="submit">채팅 시작</button></form></dialog><script src="supabase-config.js"></script><script src="guest-support-client.js"></script><script>
const G=GuestSupport,slug=new URLSearchParams(location.search).get('p'),key='omg_guest_'+slug;let portal;
(async()=>{portal=await G.call('portal',{slug});document.getElementById('propertyName').textContent=portal.name;const list=document.getElementById('guides');portal.items.forEach(item=>{const b=document.createElement('button');b.className='guide';b.innerHTML='<span class="symbol">▧</span><b>'+G.esc(item.title)+'</b><span class="arrow">›</span>';b.onclick=async()=>{try{const fresh=await G.call('portal',{slug});G.viewer(fresh.assets.find(a=>a.id===item.asset_id),item.title);}catch(e){G.message(e.message,true);}};list.append(b);});if(portal.chat_enabled){const b=document.createElement('button');b.className='guide';b.innerHTML='<span class="symbol">✉</span><div><b>직원과 채팅</b><div class="help" style="margin:4px 0 0">궁금한 점을 편하게 물어보세요</div></div><span class="arrow">›</span>';b.onclick=()=>{const previous=JSON.parse(localStorage.getItem(key)||'null');if(previous?.room_id&&previous.expires>Date.now()){location.href='guest-chat.html?p='+encodeURIComponent(slug);return;}document.getElementById('entry').showModal();};list.append(b);}G.message(portal.items.length||portal.chat_enabled?'':'등록된 안내가 없습니다.');})().catch(e=>G.message(e.message,true));
document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button[type=submit]'),status=document.getElementById('entryStatus');btn.disabled=true;status.textContent='대화를 준비하고 있습니다…';try{let pending=JSON.parse(sessionStorage.getItem(key+'_pending')||'null');if(!pending)pending={new_token:crypto.randomUUID()};sessionStorage.setItem(key+'_pending',JSON.stringify(pending));const data={...Object.fromEntries(new FormData(form)),slug,...pending};const result=await G.call('start',data);localStorage.setItem(key,JSON.stringify({guest_token:pending.new_token,room_id:result.room_id,expires:Math.min(Date.parse(data.check_out)+2*86400000,Date.now()+60*86400000)}));sessionStorage.removeItem(key+'_pending');location.href='guest-chat.html?p='+encodeURIComponent(slug);}catch(err){status.textContent=err.message;status.className='status error';btn.disabled=false;}};
</script></body></html>
