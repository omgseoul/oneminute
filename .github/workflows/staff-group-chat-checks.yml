name: Verify staff group conversations
on:
  pull_request:
    paths: ['home-summary-state.js', 'home-guest-count.js', 'tests/home-summary/**', 'central-notices.css', 'attendance-warning-response.js', 'attendance.html', 'attendance-export.js', 'dialog-cards.js', 'supabase/migrations/*central_attendance_responses.sql', 'supabase/migrations/*chat_attachment_decode_once.sql', 'supabase/migrations/*staff_chat_chunked_upload.sql', 'supabase/migrations/*staff_chat_upload_authorization.sql', 'tests/central-notices/**', 'supabase/functions/dispatch-notification/**', 'supabase/tests/push-handler.test.mjs', 'supabase/migrations/*notification_worker_auth.sql', 'home-message-queue.js', 'report.html', 'oms-dog-*-plain.webp', 'app.html', 'apk-download.js', 'message-profiles.js', 'tests/home-version/**', 'tests/attendance-nfc/home-bootstrap.cjs', 'staff-chat*', 'message-hub.js', 'assets/staff-group-avatar.svg', 'messages.html', 'reminder-settings.js', 'login.html', 'supabase/migrations/*staff_group_conversations.sql', 'supabase/migrations/*group_member_profiles.sql', 'tests/staff-group-chat/**', '.github/workflows/staff-group-chat-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tests/attendance-nfc
      - run: npm install --no-save --prefix tests/attendance-nfc fake-indexeddb@6.0.0
      - run: tests/attendance-nfc/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify group authorization and existing direct conversations
        env: {NODE_PATH: '${{ github.workspace }}/tests/attendance-nfc/node_modules'}
        run: |
          node --test supabase/tests/push-handler.test.mjs
          node tests/staff-group-chat/database.cjs
          node tests/staff-group-chat/browser.cjs
          node tests/staff-chat-receipts.cjs
          node tests/chat-realtime/outbox.cjs
          node tests/chat-realtime/queue-isolation.cjs
          node tests/chat-realtime/transfer-controls.cjs
          node tests/chat-realtime/transfer-layout.cjs
          node tests/media-viewer/client.cjs
          node tests/media-viewer/browser.cjs
          node tests/staff-chat-send-state.cjs
          node tests/staff-chat-native-navigation.cjs
          node tests/notification-checkout/database.cjs
          node tests/notice-responses-owner-completion.cjs
          node tests/central-notices/browser.cjs
          node tests/central-notices/video-client.cjs
          node tests/attendance-ui.cjs
          node tests/notification-checkout/web.cjs
          node tests/notification-checkout/browser.cjs
          node tests/notification-checkout/report-flow.cjs
          node tests/home-version/browser.cjs
          node tests/attendance-nfc/home-bootstrap.cjs
          node tests/home-summary/state.cjs
          node tests/home-summary/browser.cjs
          node tests/mission-summary.cjs
          node tests/mission-consistency.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMS-group-chat-preview
          path: |
            /tmp/oms-group-*.png
            /tmp/oms-transfer-*.png
            /tmp/oms-media-*.png
            /tmp/oms-home-summary-*.png
