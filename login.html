<!DOCTYPE html>
<html lang="ko" class="omg-booting" data-omg-ready="manual"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>PIN 로그인</title><link rel="stylesheet" href="page-transition.css"><script src="page-transition.js"></script>
<style>
:root{--navy:#183153;--blue:#2467bd;--ink:#17243a;--muted:#6d7b90;--line:#e4ebf5;--bg:#f4f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}.shell{visibility:hidden;opacity:0;width:min(100%,480px);min-height:100vh;margin:auto;padding:34px 18px calc(32px + env(safe-area-inset-bottom));display:flex;align-items:center}.shell.ready{visibility:visible;opacity:1}.card{width:100%;padding:28px 22px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 12px 34px rgba(42,78,120,.1)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:23px}.brand img{width:76px;height:76px;object-fit:contain}.brand small{display:block;margin-bottom:4px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em}.brand h1{margin:0;color:var(--navy);font-size:29px;letter-spacing:-.05em}.brand h1.loading{width:148px;height:34px;border-radius:9px;background:linear-gradient(90deg,#edf2f8 25%,#f7f9fc 50%,#edf2f8 75%);background-size:200% 100%;animation:title-loading 1.2s infinite;color:transparent}.intro{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.55}.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:14px;background:#edf3fa}.role-tabs button{height:43px;border:0;border-radius:11px;background:transparent;color:#748399;font-size:14px;font-weight:900}.role-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 3px 10px rgba(42,78,120,.1)}label{display:block;margin:16px 2px 7px;color:var(--navy);font-size:13px;font-weight:900}select,input{width:100%;height:52px;padding:0 14px;border:1px solid #cfdaea;border-radius:13px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus,select:focus{border-color:#6a9ddd;box-shadow:0 0 0 3px rgba(36,103,189,.1)}.primary{width:100%;height:54px;margin-top:23px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:900}.primary:disabled{opacity:.55}.message{min-height:20px;margin:13px 2px 0;color:#c33;font-size:12px;text-align:center}.account-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;color:#8b97a7;font-size:11px}.account-row button{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:900}.foot{margin:20px 0 0;color:#9aa5b4;font-size:10px;text-align:center}@keyframes title-loading{to{background-position:-200% 0}}
.welcome[hidden]{display:none}.welcome{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(18,34,56,.56);backdrop-filter:blur(5px)}.welcome-card{width:min(100%,390px);padding:27px 22px 22px;border-radius:25px;background:#fff;box-shadow:0 24px 70px rgba(13,35,64,.28);text-align:center}.welcome-icon{display:grid;width:58px;height:58px;margin:0 auto 15px;place-items:center;border-radius:18px;background:#eaf3ff;color:var(--blue);font-size:27px}.welcome h2{margin:0;color:var(--navy);font-size:23px}.welcome p{margin:13px 0;color:var(--muted);font-size:13px;line-height:1.65}.temp-pin{display:flex;align-items:center;justify-content:space-between;margin:17px 0;padding:14px 16px;border:1px solid #cfe0f5;border-radius:14px;background:#f4f8fe;color:var(--navy);font-size:12px;font-weight:800}.temp-pin strong{color:var(--blue);font-size:25px;letter-spacing:.12em}.welcome button{width:100%;height:50px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900}
</style></head><body><main id="loginShell" class="shell"><section class="card">
<div class="brand"><img src="shiba-worker-logo-v2.png" alt="OMG WORKS 시바견"><div><small>OMG WORKS</small><h1 id="propertyTitle" class="loading" aria-busy="true"></h1></div></div>
<p class="intro">유형을 선택하고 계정과 개인 PIN을 입력하세요.<br>근무자 로그인 시간은 오늘의 출근시간으로 기록됩니다.</p>
<div class="role-tabs"><button id="staffTab" class="on" type="button">근무자</button><button id="adminTab" type="button">관리자</button></div>
<form id="loginForm">
<label id="accountLabel" for="accountSelect">근무자</label><select id="accountSelect" required><option value="">불러오는 중...</option></select>
<label for="pin">개인 PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="off" placeholder="6~8자리 숫자" required>
<button id="loginButton" class="primary" type="submit" disabled>로그인</button><div id="message" class="message" role="alert"></div>
</form>
<div class="account-row"><span id="accountEmail"></span><button type="button" onclick="window.omgAccount.logout()">계정 로그아웃</button></div>
<p class="foot">LOGIN TIME = CLOCK-IN TIME</p>
</section></main><section id="welcomeModal" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden><div class="welcome-card"><div class="welcome-icon">✓</div><h2 id="welcomeTitle">가입을 환영합니다</h2><p>가입해주셔서 감사합니다.<br>새 숙소의 관리자 계정을 준비했습니다.</p><div class="temp-pin"><span>임시 관리자 PIN</span><strong>1234</strong></div><p>관리자로 로그인한 뒤 <b>계정관리</b>에서<br>관리자 PIN을 꼭 변경해주세요.</p><button id="welcomeConfirm" type="button">관리자 로그인하기</button></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="notification-config.js"></script><script src="notification-client.js"></script><script src="work-config.js"></script>
<script>
let role="staff",staff=[],admins=[];const accountSelect=document.getElementById("accountSelect"),button=document.getElementById("loginButton"),message=document.getElementById("message"),pin=document.getElementById("pin"),welcome=document.getElementById("welcomeModal");
function renderAccounts(){const source=role==="staff"?staff:admins,label=role==="staff"?"근무자":"관리자";document.getElementById("accountLabel").textContent=label;accountSelect.replaceChildren();if(role==="staff")accountSelect.add(new Option("직원을 선택하세요",""));else if(source.length!==1)accountSelect.add(new Option("관리자를 선택하세요",""));source.forEach(item=>accountSelect.add(new Option(item.display_name,role==="staff"?item.employee_id:item.owner_id)));if(role==="admin"&&source.length===1)accountSelect.value=source[0].owner_id;button.disabled=!source.length;message.textContent=source.length?"":`로그인 가능한 ${label} 계정이 없습니다.`;}
function setRole(next){role=next;document.getElementById("staffTab").classList.toggle("on",role==="staff");document.getElementById("adminTab").classList.toggle("on",role==="admin");pin.pattern=role==="staff"?"[0-9]{6,8}":"[0-9]{4,8}";pin.minLength=role==="staff"?6:4;pin.placeholder=role==="staff"?"6~8자리 숫자":"4~8자리 숫자";renderAccounts();}
document.getElementById("staffTab").onclick=()=>setRole("staff");document.getElementById("adminTab").onclick=()=>setRole("admin");
async function ready(){if(window.omgSession.get()){const activeSession=await window.omgSession.require();if(activeSession){location.replace("app.html");return;}}const account=await window.omgAccount.require();if(!account)return;document.getElementById("accountEmail").textContent=account.user.email||"";const{data:property,error:propertyError}=await window.omgSupabase.rpc("get_or_create_account_property");if(propertyError||!property?.ok)throw new Error(property?.message||"숙소 정보를 준비하지 못했습니다.");const[resultStaff,resultAdmins]=await Promise.all([window.omgSupabase.rpc("list_account_login_employees"),window.omgSupabase.rpc("list_account_login_admins")]);if(resultStaff.error||resultAdmins.error)throw new Error("로그인 계정 목록을 불러오지 못했습니다.");staff=resultStaff.data||[];admins=resultAdmins.data||[];const propertyTitle=document.getElementById("propertyTitle");propertyTitle.textContent=property.property_name;propertyTitle.classList.remove("loading");propertyTitle.removeAttribute("aria-busy");document.title=`${property.property_name} 로그인`;if(property.onboarding_pending){welcome.hidden=false;setRole("admin");}else renderAccounts();document.getElementById("loginShell").classList.add("ready");window.omgTransition.ready();}
document.getElementById("welcomeConfirm").onclick=async()=>{const{data,error}=await window.omgSupabase.rpc("acknowledge_account_onboarding");if(error||!data?.ok){message.textContent="안내 확인을 저장하지 못했습니다. 다시 눌러주세요.";return;}welcome.hidden=true;setRole("admin");accountSelect.value=admins[0]?.owner_id||"";pin.focus();};
document.getElementById("loginForm").addEventListener("submit",async event=>{event.preventDefault();message.textContent="";button.disabled=true;button.textContent="로그인 중...";try{const args=role==="staff"?{p_employee_id:accountSelect.value,p_pin:pin.value}:{p_owner_id:accountSelect.value,p_pin:pin.value};const{data,error}=await window.omgSupabase.rpc(role==="staff"?"start_account_work_session":"start_account_admin_session",args);if(error||!data?.ok)throw new Error(data?.message||"로그인하지 못했습니다.");window.omgSession.set(window.omgSession.fromResponse(data,data.access_token));if(role==="staff"&&data.warning_message_ids?.length){await Promise.allSettled(data.warning_message_ids.map(message_id=>window.omgNotifications.send(data.access_token,message_id,{timeoutMs:4000})));}location.replace("app.html");}catch(error){message.textContent=error.message||"로그인하지 못했습니다.";}finally{pin.value="";button.disabled=false;button.textContent="로그인";}});
ready().catch(error=>{message.textContent=error.message;document.getElementById("loginShell").classList.add("ready");window.omgTransition.ready();});
</script></body></html>
