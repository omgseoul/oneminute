name: Verify bot briefing and employee roles
on:
  pull_request:
    paths: ['bot-briefing.js', 'supabase/setup/briefing_owner_delivery.sql', 'supabase/migrations/*briefing_owner_delivery.sql', 'supabase/setup/briefing_test_delivery.sql', 'supabase/migrations/*briefing_test_delivery.sql', 'supabase/setup/briefing_shared_picker.sql', 'supabase/migrations/*briefing_shared_picker.sql', 'bot-settings.*', 'employee-duty-roles.js', 'staff-management.html', 'supabase/functions/bot-briefing/**', 'supabase/functions/dispatch-briefing/**', 'supabase/setup/bot_briefing.sql', 'supabase/migrations/*bot_briefing_roles.sql', 'supabase/setup/monthly_ai_allowance.sql', 'supabase/migrations/*monthly_ai_allowance.sql', 'platform-ai.js', 'tests/bot-briefing/**', '.github/workflows/bot-briefing-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tests/attendance-nfc
      - run: tests/attendance-nfc/node_modules/.bin/playwright install --with-deps chromium
      - name: Check periods, permissions, credits and mobile settings
        env: {NODE_PATH: '${{ github.workspace }}/tests/attendance-nfc/node_modules'}
        run: |
          node tests/bot-briefing/categories.cjs
          node tests/bot-briefing/database.cjs
          node tests/bot-briefing/monthly.cjs
          node --test tests/bot-briefing/edge.mjs
          node tests/bot-briefing/dispatch.mjs
          node tests/bot-briefing/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMS-bot-briefing-preview
          path: /tmp/oms-briefing-*.png
