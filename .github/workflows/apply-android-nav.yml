name: Apply Android navigation fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-property-data-permission-fix
          fetch-depth: 0
      - name: Apply patch on current main
        run: |
          cp android-nav.bundle.b64 /tmp/android-nav.bundle.b64
          git fetch origin main
          git reset --hard origin/main
          base64 -d /tmp/android-nav.bundle.b64 > /tmp/android-nav.patch
          git apply /tmp/android-nav.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Fix Android WebView navigation and publish 0.14.2"
          git push --force origin HEAD:codex-property-data-permission-fix
